<body><main><header><strong>操作デモ</strong><button id="op" aria-pressed="true">運営画面</button><button id="sp" aria-pressed="false">参加者画面</button></header>

<script>
const admin=document.getElementById('admin'), spectator=document.getElementById('spectator');
let snapshot=null;
window.addEventListener('message', e=>{
  if(e.source===admin.contentWindow && e.data && e.data.type==='month-demo-state') {
    snapshot=e.data; spectator.contentWindow.postMessage(snapshot,'*');
  } else if(e.source===spectator.contentWindow && e.data && e.data.type==='month-demo-view-ready' && snapshot) spectator.contentWindow.postMessage(snapshot,'*');
});
function selectScreen(isAdmin){
  admin.hidden=!isAdmin; spectator.hidden=isAdmin;
  document.getElementById('op').setAttribute('aria-pressed',String(isAdmin));
  document.getElementById('sp').setAttribute('aria-pressed',String(!isAdmin));
}
document.getElementById('op').onclick=()=>selectScreen(true);
document.getElementById('sp').onclick=()=>selectScreen(false);

var l = d ? '明るい画面にする' : '暗い画面にする'; b.setAttribute('aria-label', l); b.title = l; });\n    all('[data-fs-set]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-fs-set') === fs ? 'true' : 'false'); });\n  }\n  function closeAll() { all('.vc-pop').forEach(function (p) { p.hidden = true; }); all('[data-vc=\"font\"]').forEach(function (b) { b.setAttribute('aria-expanded', 'false'); }); }\n  document.addEventListener('click', function (e) {\n    var el = e.target && e.target.closest ? e.target : null;\n    var b = el && el.closest('[data-vc],[data-fs-set]');\n    if (!b) { if (!(el && el.closest('.vc-pop'))) closeAll(); return; }\n    var vc = b.getAttribute('data-vc');\n    if (vc === 'theme') { var n = isDark() ? 'light' : 'dark'; R.setAttribute('data-theme', n); s('theme', n); closeAll(); paint(); }\n    else if (vc === 'font') { var pop = b.parentNode.querySelector('.vc-pop'), open = pop.hidden; closeAll(); pop.hidden = !open; b.setAttribute('aria-expanded', open ? 'true' : 'false'); }\n    else { var v = b.getAttribute('data-fs-set'); if (v === 'm') R.removeAttribute('data-fs'); else R.setAttribute('data-fs', v); s('fs', v); paint(); }\n  });\n  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(); });\n  if (mq && mq.addEventListener) mq.addEventListener('change', paint);\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint); else paint();\n})();\n\u003c/script>\n\n\u003cdiv class=\"wrap\">\n  \u003c!-- ===== パスコード ===== -->\n  \u003cdiv class=\"lockwrap\" id=\"lock\">\n    \u003cdiv class=\"vc-row\">\u003cdiv class=\"viewctl\" role=\"group\" aria-label=\"画面の表示\">\n\u003cbutton type=\"button\" class=\"vc-btn\" data-vc=\"theme\" aria-label=\"暗い画面にする\">\u003c/button>\n\u003cbutton type=\"button\" class=\"vc-btn\" data-vc=\"font\" aria-haspopup=\"true\" aria-expanded=\"false\" aria-label=\"文字の大きさを変える\" title=\"文字の大きさ\">\u003cspan class=\"vc-a\" aria-hidden=\"true\">\u003cspan class=\"s\">あ\u003c/span>\u003cspan class=\"b\">あ\u003c/span>\u003c/span>\u003c/button>\n\u003cdiv class=\"vc-pop\" hidden>\u003cb>文字の大きさ\u003c/b>\u003cdiv class=\"vc-opts\">\u003cbutton type=\"button\" data-fs-set=\"m\">標準\u003c/button>\u003cbutton type=\"button\" data-fs-set=\"l\">大きめ\u003c/button>\u003cbutton type=\"button\" data-fs-set=\"xl\">特大\u003c/button>\u003c/div>\u003csmall>この端末で覚えておきます\u003c/small>\u003c/div>\n\u003c/div>\u003c/div>\n    \u003cdiv>\n      \u003cdiv class=\"org\">泉鋼業(株)モルック部\u003c/div>\n      \u003ch1 class=\"title\" style=\"font-size:clamp(2.2rem,11vw,3.4rem)\">運営\u003cbr>メニュー\u003c/h1>\n    \u003c/div>\n    \u003cdiv class=\"box\">\n      \u003cp>受付・チーム抽選・結果の修正・リセットなどは、運営パスコードを入れると使えます。\u003c/p>\n      \u003cform id=\"lockForm\" style=\"display:grid;gap:10px\">\n        \u003cinput class=\"input big-in\" id=\"adminPassIn\" type=\"password\" autocomplete=\"current-password\" placeholder=\"運営パスコード\" aria-label=\"運営パスコード\">\n        \u003cbutton class=\"btn primary wide\" type=\"submit\">運営モードにする\u003c/button>\n      \u003c/form>\n      \u003cdiv class=\"err\" id=\"lockErr\" aria-live=\"polite\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"demo-bar\" id=\"demoBar\" hidden>これはプレビュー用のデモデータです。パスコードは \u003cb>demo-local\u003c/b> です。\u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"app\" hidden>\n    \u003cheader class=\"abar\">\n      \u003cdiv class=\"abar-in\">\n        \u003cdiv class=\"abar-top\">\u003ch1 class=\"abrand\">\u003csmall>泉鋼業(株)モルック部\u003c/small>\u003cspan id=\"aName\">月いちモルック\u003c/span> 運営\u003c/h1>\n\u003cdiv class=\"viewctl\" role=\"group\" aria-label=\"画面の表示\">\n\u003cbutton type=\"button\" class=\"vc-btn\" data-vc=\"theme\" aria-label=\"暗い画面にする\">\u003c/button>\n\u003cbutton type=\"button\" class=\"vc-btn\" data-vc=\"font\" aria-haspopup=\"true\" aria-expanded=\"false\" aria-label=\"文字の大きさを変える\" title=\"文字の大きさ\">\u003cspan class=\"vc-a\" aria-hidden=\"true\">\u003cspan class=\"s\">あ\u003c/span>\u003cspan class=\"b\">あ\u003c/span>\u003c/span>\u003c/button>\n\u003cdiv class=\"vc-pop\" hidden>\u003cb>文字の大きさ\u003c/b>\u003cdiv class=\"vc-opts\">\u003cbutton type=\"button\" data-fs-set=\"m\">標準\u003c/button>\u003cbutton type=\"button\" data-fs-set=\"l\">大きめ\u003c/button>\u003cbutton type=\"button\" data-fs-set=\"xl\">特大\u003c/button>\u003c/div>\u003csmall>この端末で覚えておきます\u003c/small>\u003c/div>\n\u003c/div>\u003c/div>\n        \u003cdiv class=\"pills\" id=\"pills\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"when-line\" id=\"whenLine\">\u003c/div>\n      \u003cdiv id=\"alertBox\">\u003c/div>\n      \u003cdiv class=\"loadbar\" id=\"loadbar\">\u003c/div>\n    \u003c/header>\n\n    \u003cmain>\n      \u003c!-- ===== 受付 ===== -->\n      \u003csection class=\"panel\" id=\"ph-entry\" hidden>\n        \u003cdiv class=\"box\">\n          \u003ch2 class=\"h\">受付\u003c/h2>\n          \u003cdiv class=\"field\">\n            \u003clabel for=\"eq\">名前で探す\u003c/label>\n            \u003cinput class=\"input big-in\" id=\"eq\" type=\"search\" autocomplete=\"off\" enterkeyhint=\"done\" placeholder=\"名前の一部（はじめての人はフルネーム）\">\n          \u003c/div>\n          \u003cdiv class=\"rgrid\" id=\"rList\">\u003c/div>\n          \u003cdiv class=\"subbox\" id=\"newBox\" hidden style=\"margin-top:12px\">\n            \u003cdiv id=\"newMsg\">\u003cb id=\"newName\">\u003c/b> さんは名簿にいません。はじめての人として受付します。\u003c/div>\n            \u003cdiv class=\"actions\">\n              \u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"pExp\">\u003cspan class=\"tr\">\u003c/span>経験豊富\u003c/label>\n              \u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"pEarly\">\u003cspan class=\"tr\">\u003c/span>早めに帰る\u003c/label>\n            \u003c/div>\n            \u003cdiv class=\"field\">\u003clabel for=\"pPair\">同じチーム希望の目印（任意）\u003c/label>\u003cinput class=\"input\" id=\"pPair\" autocomplete=\"off\" maxlength=\"20\" placeholder=\"例：A（同じ目印の人は同じチーム）\">\u003c/div>\n            \u003cbutton class=\"btn primary wide\" id=\"newAdd\" type=\"button\">はじめての人として受付\u003c/button>\n          \u003c/div>\n          \u003cp class=\"muted\" id=\"rNote\" style=\"margin:10px 0 0\">参加回数が多い順。タップでチェックして、下のボタンでまとめて受付します。\u003c/p>\n        \u003c/div>\n        \u003cdiv id=\"entryStatus\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"qbar\" id=\"qBar\" hidden>\u003cbutton class=\"btn primary\" id=\"qAdd\" type=\"button\">チェックした人を受付\u003c/button>\u003c/div>\n        \u003cdiv class=\"box\">\n          \u003cdiv class=\"sec-h\">\u003ch2 class=\"h\">受付済み\u003c/h2>\u003cdiv class=\"chiprow\" id=\"pCount\">\u003c/div>\u003c/div>\n          \u003cp class=\"muted\">名前を押すと、経験豊富・早めに帰る・同じチーム希望・チーム・名前の修正と削除ができます。\u003c/p>\n          \u003cul class=\"plist2\" id=\"plist\">\u003c/ul>\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- ===== チーム ===== -->\n      \u003csection id=\"ph-team\" hidden>\n        \u003cdiv class=\"box\" id=\"drawCard\">\n          \u003ch2 class=\"h\" id=\"drawH\">チーム抽選\u003c/h2>\n          \u003cdiv class=\"drawbox\">\n            \u003cdiv class=\"actions\">\n              \u003cspan>\u003cb>チーム数\u003c/b>\u003cspan class=\"muted\">（偶数）\u003c/span>\u003c/span>\n              \u003cspan class=\"stepper\">\u003cbutton class=\"btn small\" id=\"tcMinus\" aria-label=\"チーム数を2つ減らす\">－\u003c/button>\u003cspan class=\"big num\" id=\"tcVal\">6\u003c/span>\u003cbutton class=\"btn small\" id=\"tcPlus\" aria-label=\"チーム数を2つ増やす\">＋\u003c/button>\u003c/span>\n              \u003cbutton class=\"btn small ghost\" id=\"tcAuto\">おすすめに戻す\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"sizes\" id=\"tcSizes\">\u003c/div>\n            \u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"usePairs\">\u003cspan class=\"tr\">\u003c/span>「同じチーム希望」を使う\u003c/label>\n            \u003clabel class=\"switch\" id=\"forceWrap\" hidden>\u003cinput type=\"checkbox\" id=\"forceDraw\">\u003cspan class=\"tr\">\u003c/span>入力済みの結果を消してやり直す\u003c/label>\n            \u003cbutton class=\"btn primary wide\" id=\"drawBtn\">抽選する\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"box\" id=\"teamCard\">\n          \u003cdiv class=\"sec-h\">\u003ch2 class=\"h\">チーム\u003c/h2>\u003cspan class=\"muted\" id=\"teamCnt\">\u003c/span>\u003c/div>\n          \u003cdiv id=\"syncMsg\" style=\"margin-bottom:10px\">\u003c/div>\n          \u003cdiv class=\"tgrid\" id=\"adjust\">\u003c/div>\n          \u003cdiv class=\"actions\" id=\"teamOps\" style=\"margin-top:12px\">\u003cbutton class=\"btn ghost\" id=\"addTeam\">チームを1つ追加\u003c/button>\u003cbutton class=\"btn primary\" id=\"rebuild\">対戦表を作り直す\u003c/button>\u003c/div>\n          \u003cp class=\"muted\" style=\"margin:8px 0 0\">メンバーの名前を押すとチームを移せます。作り直しても入力済みの結果は残り、まだの試合だけ今のチームで組み直します。\u003c/p>\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- ===== 試合 ===== -->\n      \u003csection class=\"panel\" id=\"ph-game\" hidden>\n        \u003cdiv class=\"box plain prog\" id=\"gProg\">\u003c/div>\n        \u003cdiv class=\"chiprow\" id=\"gFilter\">\n          \u003cbutton class=\"chip\" data-f=\"todo\" aria-pressed=\"true\">未入力だけ\u003c/button>\n          \u003cbutton class=\"chip\" data-f=\"all\" aria-pressed=\"false\">すべての試合\u003c/button>\n        \u003c/div>\n        \u003cdiv id=\"gBody\" class=\"panel\">\u003c/div>\n        \u003cdiv class=\"box\">\n          \u003ch2 class=\"h\">いまの順位\u003c/h2>\n          \u003col class=\"mini\" id=\"gRank\">\u003c/ol>\n        \u003c/div>\n        \u003cdiv class=\"box\">\n          \u003ch2 class=\"h\">対戦表の巡\u003c/h2>\n          \u003cp id=\"cycleInfo\">\u003c/p>\n          \u003cdiv class=\"actions\">\u003cbutton class=\"btn cyan\" id=\"addCycle\">もう1巡追加\u003c/button>\u003cbutton class=\"btn ghost\" id=\"rmCycle\">最後の巡を消す\u003c/button>\u003c/div>\n          \u003cp class=\"muted\" style=\"margin:8px 0 0\">1巡が終わってまだ時間があるときは、同じ組み合わせでもう1巡追加できます。\u003c/p>\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- ===== 記録 ===== -->\n      \u003csection class=\"panel\" id=\"ph-rec\" hidden>\n        \u003cdiv class=\"box\">\n          \u003ch2 class=\"h\">覇王戦\u003c/h2>\n          \u003cdiv id=\"haohAdmin\" class=\"muted\">記録を読み込んでいます\u003c/div>\n          \u003cform id=\"haohForm\" class=\"subbox\" style=\"margin-top:12px\">\n            \u003cb>覇王戦の結果を記録\u003c/b>\n            \u003cdiv class=\"rowform\">\n              \u003cdiv class=\"field\">\u003clabel for=\"hNo\">第何回\u003c/label>\u003cinput class=\"input\" id=\"hNo\" type=\"number\" min=\"1\" inputmode=\"numeric\">\u003c/div>\n              \u003cdiv class=\"field\">\u003clabel for=\"hDate\">開催日\u003c/label>\u003cinput class=\"input\" id=\"hDate\" type=\"date\">\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"field\">\u003clabel for=\"hKing\">覇王（優勝した人）\u003c/label>\u003cinput class=\"input\" id=\"hKing\" list=\"hKingList\" autocomplete=\"off\" maxlength=\"30\">\u003cdatalist id=\"hKingList\">\u003c/datalist>\u003c/div>\n            \u003cdiv class=\"field\">\u003cspan style=\"font-weight:700;font-size:.9rem\">出場者\u003c/span>\u003cdiv class=\"rgrid\" id=\"hEntrants\" style=\"margin-top:0\">\u003c/div>\u003c/div>\n            \u003cbutton class=\"btn primary\" type=\"submit\">覇王戦の結果を記録\u003c/button>\n            \u003cp class=\"muted\" style=\"margin:0\">記録すると、その日より後に優勝した人が次の覇王戦の出場資格者になります。出場者が分からない回は、チェックを外したままで大丈夫です。\u003c/p>\n          \u003c/form>\n        \u003c/div>\n        \u003cdiv class=\"box\">\n          \u003ch2 class=\"h\">過去の優勝を追加\u003c/h2>\n          \u003cp class=\"muted\">このシステムを使う前の大会の優勝チームを入れると、記録と覇者の一覧に入ります。分かる回だけで大丈夫です。\u003c/p>\n          \u003cform id=\"pastForm\" style=\"display:grid;gap:10px\">\n            \u003cdiv class=\"field\">\u003clabel for=\"pastDate\">開催日\u003c/label>\u003cinput class=\"input\" id=\"pastDate\" type=\"date\">\u003c/div>\n            \u003cdiv class=\"field\">\u003clabel for=\"pastNames\">優勝チームのメンバー\u003cspan class=\"muted\" style=\"font-weight:500\">（「、」か改行で区切る）\u003c/span>\u003c/label>\u003ctextarea class=\"input\" id=\"pastNames\" rows=\"3\" placeholder=\"例：いずみ たろう、こくぶ はなこ、たかまつ じろう\">\u003c/textarea>\u003c/div>\n            \u003cbutton class=\"btn cyan\" type=\"submit\">優勝を追加\u003c/button>\n          \u003c/form>\n        \u003c/div>\n        \u003cdiv class=\"box plain\">\n          \u003cdiv class=\"sec-h\">\u003ch2 class=\"h\">名簿\u003c/h2>\u003cspan class=\"muted num\" id=\"rosterCnt\">\u003c/span>\u003c/div>\n          \u003cp class=\"muted\">一度でも受付した人が名簿に入ります。参加回数・覇者の回数の多い順。\u003c/p>\n          \u003cul class=\"mini\" id=\"rosterList\">\u003c/ul>\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- ===== 設定 ===== -->\n      \u003csection class=\"panel\" id=\"ph-set\" hidden>\n        \u003cdiv class=\"box\">\n          \u003ch2 class=\"h\">参加者に共有\u003c/h2>\n          \u003cp class=\"muted\">「QR」を押すと大きなQRコードが出ます。その場で読み取ってもらうか、スクショして送ってください。\u003c/p>\n          \u003cdiv class=\"share\" id=\"shareList\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"box\">\n          \u003ch2 class=\"h\">大会情報\u003c/h2>\n          \u003cform id=\"setForm\" style=\"display:grid;gap:10px\">\n            \u003cdiv class=\"rowform\">\n              \u003cdiv class=\"field\">\u003clabel for=\"sDate\">開催日\u003c/label>\u003cinput class=\"input\" id=\"sDate\" type=\"date\">\u003c/div>\n              \u003cdiv class=\"field\">\u003clabel for=\"sTime\">時間\u003c/label>\u003cinput class=\"input\" id=\"sTime\" placeholder=\"12時〜17時\">\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"field\">\u003clabel for=\"sPlace\">場所\u003c/label>\u003cinput class=\"input\" id=\"sPlace\">\u003c/div>\n            \u003cdiv class=\"field\">\u003clabel for=\"sAddr\">住所\u003c/label>\u003cinput class=\"input\" id=\"sAddr\">\u003c/div>\n            \u003cdiv class=\"rowform\">\n              \u003cdiv class=\"field\">\u003clabel for=\"sFee\">参加費\u003c/label>\u003cinput class=\"input\" id=\"sFee\">\u003c/div>\n              \u003cdiv class=\"field\">\u003clabel for=\"sCourts\">コート数\u003c/label>\u003cinput class=\"input\" id=\"sCourts\" type=\"number\" inputmode=\"numeric\" min=\"1\" max=\"50\">\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"field\">\u003clabel for=\"sName\">大会名\u003c/label>\u003cinput class=\"input\" id=\"sName\">\u003c/div>\n            \u003cdiv class=\"field\">\u003clabel for=\"sNotice\">お知らせ（参加者画面のルールの最初に出ます）\u003c/label>\u003cinput class=\"input\" id=\"sNotice\">\u003c/div>\n            \u003cbutton class=\"btn cyan\" type=\"submit\">大会情報を保存\u003c/button>\n          \u003c/form>\n        \u003c/div>\n        \u003cdiv class=\"box danger\">\n          \u003ch2 class=\"h\">今月のリセット\u003c/h2>\n          \u003cp>大会が終わったら押します。順位と試合結果、参加者ごとの記録を残してから、参加者・チーム・対戦表を空にします。大会情報とパスコードはそのまま残ります。\u003c/p>\n          \u003cp id=\"resetInfo\" style=\"font-weight:900\">\u003c/p>\n          \u003cform id=\"resetForm\" class=\"actions\">\n            \u003cinput class=\"input\" id=\"resetWord\" autocomplete=\"off\" placeholder=\"「リセット」と入力\" style=\"flex:1 1 180px\">\n            \u003cbutton class=\"btn primary\" type=\"submit\">リセットする\u003c/button>\n          \u003c/form>\n        \u003c/div>\n        \u003cbutton class=\"btn ghost\" id=\"logout\">運営モードを終える\u003c/button>\n      \u003c/section>\n    \u003c/main>\n    \u003cp class=\"mk-ver\" id=\"verLine\" style=\"margin:28px 16px 20px;text-align:center;font-size:13px;line-height:1.6;color:var(--muted,#777)\">版 2026.11.21\u003c/p>\n  \u003c/div>\n\u003c/div>\n\n\u003cnav class=\"bnav\" id=\"bnav\" aria-label=\"運営メニュー\" hidden>\n  \u003cdiv class=\"bnav-in\">\n    \u003cbutton class=\"nb\" data-ph=\"entry\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"9\" cy=\"8\" r=\"4\"/>\u003cpath d=\"M2 21c0-4 3-6 7-6s7 2 7 6\"/>\u003cpath d=\"M19 8v6M16 11h6\"/>\u003c/svg>受付\u003cspan class=\"badge\" id=\"bd-entry\" hidden>\u003c/span>\u003c/button>\n    \u003cbutton class=\"nb\" data-ph=\"team\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"7\" cy=\"8\" r=\"3\"/>\u003ccircle cx=\"17\" cy=\"8\" r=\"3\"/>\u003cpath d=\"M1 20c0-3 2.5-5 6-5s6 2 6 5M11 20c0-3 2.5-5 6-5s6 2 6 5\"/>\u003c/svg>チーム\u003cspan class=\"badge\" id=\"bd-team\" hidden>\u003c/span>\u003c/button>\n    \u003cbutton class=\"nb\" data-ph=\"game\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/>\u003cpath d=\"M3 9h18M9 4v16\"/>\u003c/svg>試合\u003cspan class=\"badge\" id=\"bd-game\" hidden>\u003c/span>\u003c/button>\n    \u003cbutton class=\"nb\" data-ph=\"rec\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M8 4h8v5a4 4 0 0 1-8 0z\"/>\u003cpath d=\"M8 6H4a3 3 0 0 0 4 4M16 6h4a3 3 0 0 1-4 4M12 13v4M8 21h8\"/>\u003c/svg>記録\u003c/button>\n    \u003cbutton class=\"nb\" data-ph=\"set\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/>\u003cpath d=\"M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1\"/>\u003c/svg>設定\u003c/button>\n  \u003c/div>\n\u003c/nav>\n\n\u003cdiv class=\"ov\" id=\"ov\" hidden>\u003cdiv class=\"sheet\" id=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sheetTitle\">\u003c/div>\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" hidden>\u003c/div>\n\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js\">\u003c/script>\n\u003cscript>\n/* 版番号：コードを直したら3ファイル（Code.gs・Index・Admin）とも同じ日付に変える。運営画面の下に出る */\nvar MK_VER = '2026.11.21';\n/* ===== 月いちモルック 共通ロジック（サーバーとプレビューで同じものを使う） ===== */\nvar MK_PUBLIC_KEYS = ['大会名', '開催日', '時間', '場所', '住所', '参加費', 'お知らせ', 'インスタ', 'コート数'];\n\nfunction mk_courtCount(settings) {\n  var n = Math.floor(Number(settings && settings['コート数']));\n  return n >= 1 && n \u003c= 50 ? n : 6;\n}\n\n/* ラウンドごとに、試合の並び順でコート1から割り当てる。コートが足りないときは空いたコートに2組目が入る */\nfunction mk_assignCourts(matches, courts) {\n  var groups = {};\n  matches.forEach(function (m) {\n    var key = m.cycle + '-' + m.round;\n    (groups[key] = groups[key] || []).push(m);\n  });\n  var out = {};\n  Object.keys(groups).forEach(function (key) {\n    groups[key].slice().sort(function (x, y) {\n      return (Number(String(x.id).split('-')[2]) || 0) - (Number(String(y.id).split('-')[2]) || 0);\n    }).forEach(function (m, i) {\n      out[m.id] = { court: (i % courts) + 1, wave: Math.floor(i / courts) + 1 };\n    });\n  });\n  return out;\n}\n\nfunction mk_shuffle(arr) {\n  var a = arr.slice();\n  for (var i = a.length - 1; i > 0; i--) {\n    var j = Math.floor(Math.random() * (i + 1));\n    var t = a[i]; a[i] = a[j]; a[j] = t;\n  }\n  return a;\n}\n\nfunction mk_suggestTeams(n) {\n  /* 休みが出ないよう偶数チーム。1チーム3人に近くなる数を選ぶ */\n  if (n \u003c 4) return 2;\n  var best = 2, bestD = Infinity;\n  for (var t = 2; t \u003c= n / 2; t += 2) {\n    var d = Math.abs(n / t - 3);\n    if (d \u003c bestD - 1e-9) { best = t; bestD = d; }\n  }\n  return best;\n}\n\n/* チーム抽選：経験豊富者 → 各チームへ1人ずつ、残り → 人数の少ないチームへ。固定ペアはまとめて1つの単位として扱う。\n   早めに帰る人がいるときは、その人が抜けても2人以上残るチーム（または全員が早帰りで丸ごと解散できるチーム）になるよう入れ替える */\nfunction mk_teamCheck(team) {\n  var size = 0, early = 0, strong = 0;\n  team.forEach(function (u) { size += u.members.length; early += u.early; strong += u.strong || 0; });\n  var stay = size - early;\n  return { size: size, early: early, strong: strong, stay: stay, bad: early > 0 && stay === 1, dissolve: early > 0 && stay === 0 };\n}\n\n/* 実績：直近12回の大会で、優勝3点・2〜3位1点として数える。その日の参加者のうち上位（チーム数ぶん）を「実績上位」とし、なるべく別々のチームにする */\nfunction mk_strengths(hist) {\n  var dates = {};\n  (hist || []).forEach(function (r) { if (r.date) dates[r.date] = 1; });\n  var recent = {};\n  Object.keys(dates).sort().reverse().slice(0, 12).forEach(function (d) { recent[d] = 1; });\n  var sc = {};\n  (hist || []).forEach(function (r) {\n    if (!recent[r.date] || !r.rank) return;\n    var pt = r.rank === 1 ? 3 : r.rank \u003c= 3 ? 1 : 0;\n    if (!pt) return;\n    if (r.mid) sc['m:' + r.mid] = (sc['m:' + r.mid] || 0) + pt;\n    sc['n:' + r.name] = (sc['n:' + r.name] || 0) + pt;\n  });\n  return sc;\n}\nfunction mk_topStrong(players, hist, N) {\n  var sc = mk_strengths(hist);\n  var list = players.map(function (p) {\n    var v = (p.mid && sc['m:' + p.mid] !== undefined) ? sc['m:' + p.mid] : (sc['n:' + p.name] || 0);\n    return { id: p.id, v: v };\n  }).filter(function (x) { return x.v > 0; });\n  list.sort(function (a, b) { return b.v - a.v; });\n  var out = {};\n  list.slice(0, N).forEach(function (x) { out[x.id] = x.v; });\n  return out;\n}\n\nfunction mk_drawOnce(units, N, cap) {\n  var teams = [], info = [];\n  for (var i = 0; i \u003c N; i++) { teams.push([]); info.push({ size: 0, exp: 0, early: 0, strong: 0 }); }\n  var idx = info.map(function (_, i) { return i; });\n  function pick(cands, keys) {\n    var best = cands;\n    keys.forEach(function (f) {\n      var m = Math.min.apply(null, best.map(f));\n      best = best.filter(function (t) { return f(t) === m; });\n    });\n    return best[Math.floor(Math.random() * best.length)];\n  }\n  function place(u, phase) {\n    var cands = idx.filter(function (i) { return info[i].size + u.members.length \u003c= cap; });\n    if (!cands.length) cands = idx.slice();\n    var keys = phase === 'exp'\n      ? [function (i) { return info[i].exp; }, function (i) { return u.strong ? info[i].strong : 0; }, function (i) { return info[i].size; }]\n      : phase === 'early'\n        ? [function (i) { return info[i].early; }, function (i) { return u.strong ? info[i].strong : 0; }, function (i) { return info[i].size; }]\n        /* 残りの人は人数の少ないチームへ。同じ人数なら早帰りの人がいるチームを先に大きくする */\n        : [function (i) { return info[i].size; }, function (i) { return u.strong ? info[i].strong : 0; }, function (i) { return -info[i].early; }];\n    var ti = pick(cands, keys);\n    teams[ti].push(u);\n    info[ti].size += u.members.length; info[ti].exp += u.exp; info[ti].early += u.early; info[ti].strong += u.strong || 0;\n  }\n  var bySize = function (a, b) { return b.members.length - a.members.length; };\n  /* 2人以上のまとまりを先に置く（経験者を先に配ると、まとまりの入る空きがなくなるため） */\n  mk_shuffle(units.filter(function (u) { return u.members.length > 1; })).sort(bySize).forEach(function (u) { place(u, u.exp > 0 ? 'exp' : 'rest'); });\n  var singles = units.filter(function (u) { return u.members.length === 1; });\n  mk_shuffle(singles.filter(function (u) { return u.exp > 0; })).forEach(function (u) { place(u, 'exp'); });\n  mk_shuffle(singles.filter(function (u) { return u.exp === 0 && u.early > 0; })).forEach(function (u) { place(u, 'early'); });\n  mk_shuffle(singles.filter(function (u) { return u.exp === 0 && u.early === 0; })).forEach(function (u) { place(u, 'rest'); });\n  return teams;\n}\n\n/* チームの人数が「全体を均等に分けた人数」から外れていないか */\nfunction mk_sizeOk(teams, n) {\n  var lo = Math.floor(n / teams.length), hi = Math.ceil(n / teams.length);\n  return teams.every(function (t) { var s = mk_teamCheck(t).size; return s >= lo && s \u003c= hi && s >= 2; });\n}\n\nfunction mk_drawScore(teams) {\n  var sc = 0;\n  teams.forEach(function (t) { var c = mk_teamCheck(t); if (c.bad) sc += 10; if (c.dissolve) sc += 1; if (c.strong > 1) sc += (c.strong - 1) * 3; });\n  return sc;\n}\n\n/* 経験者の人数と、チームの人数のばらつきを崩さない入れ替え・移動で、早帰りの条件を満たすように直す */\nfunction mk_improve(teams) {\n  var score = mk_drawScore(teams);\n  for (var guard = 0; guard \u003c 400 && score > 0; guard++) {\n    var moves = [];\n    for (var a = 0; a \u003c teams.length; a++) for (var b = 0; b \u003c teams.length; b++) {\n      if (a === b) continue;\n      var sa = mk_teamCheck(teams[a]).size, sb = mk_teamCheck(teams[b]).size;\n      teams[a].forEach(function (u, ui) {\n        if (a \u003c b) teams[b].forEach(function (v, vi) {\n          if (u.members.length === v.members.length && u.exp === v.exp && (u.early !== v.early || (u.strong || 0) !== (v.strong || 0))) moves.push(['swap', a, ui, b, vi]);\n        });\n        if (u.members.length === 1 && u.exp === 0 && sa - sb === 1) moves.push(['move', a, ui, b]);\n      });\n    }\n    mk_shuffle(moves);\n    var improved = false;\n    for (var k = 0; k \u003c moves.length; k++) {\n      var m = moves[k], A = teams[m[1]], B = teams[m[3]];\n      if (m[0] === 'swap') {\n        var t = A[m[2]]; A[m[2]] = B[m[4]]; B[m[4]] = t;\n        var ns = mk_drawScore(teams);\n        if (ns \u003c score) { score = ns; improved = true; break; }\n        t = A[m[2]]; A[m[2]] = B[m[4]]; B[m[4]] = t;\n      } else {\n        var u = A.splice(m[2], 1)[0]; B.push(u);\n        var ns2 = mk_drawScore(teams);\n        if (ns2 \u003c score) { score = ns2; improved = true; break; }\n        B.pop(); A.splice(m[2], 0, u);\n      }\n    }\n    if (!improved) break;\n  }\n  return score;\n}\n\nfunction mk_drawTeams(players, N, usePairs, strongMap) {\n  strongMap = strongMap || {};\n  var units = [], byTag = {};\n  players.forEach(function (p) {\n    var tag = usePairs ? String(p.pair || '').trim() : '';\n    if (tag) {\n      if (!byTag[tag]) { byTag[tag] = { members: [], exp: 0, early: 0, strong: 0 }; units.push(byTag[tag]); }\n      byTag[tag].members.push(p);\n      if (p.exp) byTag[tag].exp++;\n      if (p.early) byTag[tag].early++;\n      if (strongMap[p.id]) byTag[tag].strong++;\n    } else {\n      units.push({ members: [p], exp: p.exp ? 1 : 0, early: p.early ? 1 : 0, strong: strongMap[p.id] ? 1 : 0 });\n    }\n  });\n  var cap = Math.ceil(players.length / N);\n  var hasEarly = units.some(function (u) { return u.early > 0 || u.strong > 0; });\n  var best = null, bestScore = Infinity;\n  for (var tryNo = 0; tryNo \u003c 200; tryNo++) {\n    var teams = mk_drawOnce(units, N, cap);\n    if (!mk_sizeOk(teams, players.length)) continue;\n    var sc = hasEarly ? mk_improve(teams) : 0;\n    if (sc \u003c bestScore) { best = teams; bestScore = sc; }\n    if (sc === 0 || tryNo >= 40) break;\n  }\n  /* 人数をそろえられないときは、チームや対戦表を変える前に止める */\n  if (!best) throw mk_err('「同じチーム希望」の組み合わせのせいで、人数がそろうチーム分けができませんでした。目印を減らすか、チーム数を変えるか、「同じチーム希望」をオフにしてください');\n  var assign = {}, expOrder = [], restOrder = [], warn = [], dissolve = [];\n  best.forEach(function (team, ti) {\n    team.forEach(function (u) {\n      u.members.forEach(function (m) {\n        assign[m.id] = ti + 1;\n        (u.exp > 0 ? expOrder : restOrder).push({ id: m.id, team: ti + 1, phase: u.exp > 0 ? 'exp' : 'rest' });\n      });\n    });\n    var c = mk_teamCheck(team);\n    if (c.bad) warn.push(ti + 1);\n    if (c.dissolve) dissolve.push(ti + 1);\n  });\n  return { assign: assign, order: mk_shuffle(expOrder).concat(mk_shuffle(restOrder)), warn: warn, dissolve: dissolve };\n}\n\n/* 総当たり（サークル方式）。チーム数が同じなら毎回同じ表になる */\nfunction mk_roundRobin(N) {\n  var list = [];\n  for (var i = 1; i \u003c= N; i++) list.push(i);\n  return mk_roundRobinList(list);\n}\n\n/* 総当たり（サークル方式）。同じチーム構成なら毎回同じ表になる */\nfunction mk_roundRobinList(nos) {\n  var list = nos.slice().sort(function (a, b) { return a - b; });\n  if (list.length % 2) list.push(0);\n  var M = list.length, rounds = [], arr = list.slice();\n  for (var r = 0; r \u003c M - 1; r++) {\n    var pairs = [];\n    for (var k = 0; k \u003c M / 2; k++) {\n      var a = arr[k], b = arr[M - 1 - k];\n      if (a && b) pairs.push(a \u003c b ? [a, b] : [b, a]);\n    }\n    pairs.sort(function (x, y) { return x[0] - y[0]; });\n    rounds.push(pairs);\n    arr = [arr[0], arr[M - 1]].concat(arr.slice(1, M - 1));\n  }\n  return rounds;\n}\n\nfunction mk_match(cycle, round, k, a, b) {\n  return { id: cycle + '-' + round + '-' + k + '-' + Math.random().toString(36).slice(2, 8), cycle: cycle, round: round, a: a, b: b, a1: '', a2: '', b1: '', b2: '', by: '', at: '' };\n}\n\nfunction mk_buildMatches(nos, cycle) {\n  if (typeof nos === 'number') { var n = nos; nos = []; for (var i = 1; i \u003c= n; i++) nos.push(i); }\n  var out = [];\n  mk_roundRobinList(nos).forEach(function (pairs, r) {\n    pairs.forEach(function (p, k) { out.push(mk_match(cycle, r + 1, k + 1, p[0], p[1])); });\n  });\n  return out;\n}\n\n/* 大会途中でチームが変わったとき：結果の入った試合は残し、まだ当たっていない組み合わせだけで続きのラウンドを組む */\nfunction mk_rebuildMatches(teamNos, matches) {\n  var kept = matches.filter(mk_hasResult);\n  var last = matches.reduce(function (mx, m) { return Math.max(mx, Number(m.cycle) || 1); }, 1);\n  var has = {}; teamNos.forEach(function (n) { has[n] = 1; });\n  var out = kept.slice();\n  matches.forEach(function (m) {\n    if (!mk_hasResult(m) && Number(m.cycle) \u003c last && has[m.a] && has[m.b]) out.push(m);\n  });\n  return out.concat(mk_rebuildCycle(teamNos, kept, last, matches));\n}\nfunction mk_rebuildCycle(teamNos, kept, cycle, old) {\n  /* 送信待ちの結果がずれないよう、同じ2チームのまだの試合は、もとの試合番号を引き継ぐ */\n  var oldId = {};\n  (old || []).forEach(function (m) { if (!mk_hasResult(m) && Number(m.cycle) === cycle) oldId[Math.min(m.a, m.b) + '-' + Math.max(m.a, m.b)] = m.id; });\n  var played = {};\n  kept.forEach(function (m) { if (Number(m.cycle) === cycle) played[Math.min(m.a, m.b) + '-' + Math.max(m.a, m.b)] = 1; });\n  var remaining = [];\n  mk_roundRobinList(teamNos).forEach(function (pairs) {\n    pairs.forEach(function (p) { if (!played[p[0] + '-' + p[1]]) remaining.push(p); });\n  });\n  var round = kept.filter(function (m) { return Number(m.cycle) === cycle; }).reduce(function (mx, m) { return Math.max(mx, m.round); }, 0);\n  var out = [];\n  var nosSorted = teamNos.slice().sort(function (a, b) { return a - b; });\n  /* 1ラウンドで全チームが試合できる組み方を探す。見つからなければできるだけ多く組む */\n  function perfect(pool) {\n    var used = {}, pick = [], tries = 0;\n    function dfs() {\n      if (++tries > 20000) return false;\n      var t = nosSorted.filter(function (n) { return !used[n]; })[0];\n      if (t === undefined) return true;\n      for (var i = 0; i \u003c pool.length; i++) {\n        var q = pool[i];\n        if ((q[0] === t || q[1] === t) && !used[q[0]] && !used[q[1]]) {\n          used[q[0]] = used[q[1]] = 1; pick.push(i);\n          if (dfs()) return true;\n          used[q[0]] = used[q[1]] = 0; pick. ackground: var(--panel-2); border: 2px dashed var(--muted); font-weight: 900; font-size: .9rem; }\n.pendbar { margin: 4px 0 12px; padding: 12px 14px; border-radius: 12px; background: var(--danger-soft); border: 3px solid var(--red); display: grid; gap: 8px; }\n.pendbar b { color: var(--red); }\n.pendbar ul { margin: 0; padding-left: 1.2em; }\n.sendbox { border-radius: 12px; padding: 12px 14px; font-weight: 900; display: grid; gap: 6px; }\n.sendbox.sending { background: var(--cyan-soft); border: 2px solid var(--cyan); }\n.sendbox.held { background: var(--danger-soft); border: 3px solid var(--red); }\n.sendbox.done { background: var(--good-soft); border: 2px solid var(--good); }\n.mt .state.held { background: var(--danger-soft); color: var(--red); }\n\u003c/style>\u003c/head>\u003cbody>\n\u003cscript>\n/* 表示の切り替え：明るい・暗い／文字の大きさ。最初は端末の設定に合わせ、選んだらこの端末で覚える */\n(function () {\n  var R = document.documentElement, P = 'mk_view_';\n  function g(k) { try { return localStorage.getItem(P + k); } catch (e) { return null; } }\n  function s(k, v) { try { localStorage.setItem(P + k, v); } catch (e) {} }\n  var t = g('theme'); if (t === 'light' || t === 'dark') R.setAttribute('data-theme', t);\n  var f = g('fs'); if (f === 'l' || f === 'xl') R.setAttribute('data-fs', f);\n  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;\n  function isDark() { var a = R.getAttribute('data-theme'); return a ? a === 'dark' : !!(mq && mq.matches); }\n  var MOON = '\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z\"/>\u003c/svg>';\n  var SUN = '\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"4\"/>\u003cpath d=\"M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/>\u003c/svg>';\n  function all(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }\n  function paint() {\n    var d = isDark() 中\u003c/div>\n        \u003cdiv class=\"where\" id=\"where\">香川県高松市国分寺 B&amp;G海洋センター ゲートボールコート\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"photo\">\n        \u003cimg id=\"pinsImg\" alt=\"数字が書かれた12本のモルックのピン\" width=\"440\" height=\"360\" src=\"\">\n        \u003cdiv class=\"cloud\">参加費\u003cb id=\"fee\">1人200円\u003c/b>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"syncStatus\" role=\"status\">大会情報を読み込み中…\u003c/div>\u003cbutton class=\"btn small\" id=\"syncRetry\" hidden>もう一度読み込む\u003c/button>\n  \u003c/header>\n\n  \u003cnav class=\"tabs\" aria-label=\"ページ切り替え\">\n    \u003cdiv class=\"tabs-row\">\n    \u003cdiv class=\"tabs-in\" role=\"tablist\">\n      \u003cbutton class=\"tab\" role=\"tab\" id=\"t-rules\" aria-controls=\"p-rules\" data-tab=\"rules\">ルール\u003c/button>\n      \u003cbutton class=\"tab\" role=\"tab\" id=\"t-rank\" aria-controls=\"p-rank\" data-tab=\"rank\">順位\u003c/button>\n      \u003cbutton class=\"tab\" role=\"tab\" id=\"t-match\" aria-controls=\"p-match\" data-tab=\"match\">対戦・結果\u003c/button>\n      \u003cbutton class=\"tab\" role=\"tab\" id=\"t-team\" aria-controls=\"p-team\" data-tab=\"team\">チーム\u003c/button>\n      \u003cbutton class=\"tab\" role=\"tab\" id=\"t-rec\" aria-controls=\"p-rec\" data-tab=\"rec\">記録\u003c/button>\n    \u003c/div>\n\u003cdiv class=\"viewctl\" role=\"group\" aria-label=\"画面の表示\">\n\u003cbutton type=\"button\" class=\"vc-btn\" data-vc=\"theme\" aria-label=\"暗い画面にする\">\u003c/button>\n\u003cbutton type=\"button\" class=\"vc-btn\" data-vc=\"font\" aria-haspopup=\"true\" aria-expanded=\"false\" aria-label=\"文字の大きさを変える\" title=\"文字の大きさ\">\u003cspan class=\"vc-a\" aria-hidden=\"true\">\u003cspan class=\"s\">あ\u003c/span>\u003cspan class=\"b\">あ\u003c/span>\u003c/span>\u003c/button>\n\u003cdiv class=\"vc-pop\" hidden>\u003cb>文字の大きさ\u003c/b>\u003cdiv class=\"vc-opts\">\u003cbutton type=\"button\" data-fs-set=\"m\">標準\u003c/button>\u003cbutton type=\"button\" data-fs-set=\"l\">大きめ\u003c/button>\u003cbutton type=\"button\" data-fs-set=\"xl\">特大\u003c/button>\u003c/div>\u003csmall>この端末で覚えておきます\u003c/small>\u003c/div>\n\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"loadbar\" id=\"loadbar\">\u003c/div>\n  \u003c/nav>\n\n  \u003cmain>\n    \u003cdiv id=\"netBar\" class=\"netbar\" hidden role=\"status\">\u003c/div>\n    \u003cdiv id=\"pendBar\" class=\"pendbar\" hidden role=\"alert\">\u003c/div>\n    \u003c!-- ===== ルール ===== -->\n    \u003csection class=\"panel\" id=\"p-rules\" role=\"tabpanel\" aria-labelledby=\"t-rules\">\n      \u003cdiv class=\"callout\" id=\"notice\">指導員6名在籍なので初心者の方も大歓迎！\u003c/div>\n      \u003cnav class=\"toc\" aria-label=\"ルールの目次\">\n        \u003ca href=\"#r-flow\">大会のながれ\u003c/a>\u003ca href=\"#r-team\">チームの決め方\u003c/a>\u003ca href=\"#r-score\">試合と得点\u003c/a>\u003ca href=\"#r-basic\">モルックの基本\u003c/a>\u003ca href=\"#r-input\">対戦と結果の見方\u003c/a>\u003ca href=\"#r-faq\">よくある質問\u003c/a>\n      \u003c/nav>\n\n      \u003cdiv class=\"box\" id=\"r-flow\">\n        \u003ch2 class=\"h\">大会のながれ\u003c/h2>\n        \u003col class=\"flow\">\n          \u003cli>\u003cdiv>\u003cb>受付（ひとりずつエントリー）\u003c/b>参加費 \u003cspan id=\"fee2\">1人200円\u003c/span>。友だち同士でも、まずは1人ずつ受付します。\u003c/div>\u003c/li>\n          \u003cli>\u003cdiv>\u003cb>チーム抽選\u003c/b>その日の参加者で、抽選で3人ずつのチームを作ります。お休みのチームが出ないよう、チーム数は偶数にします。\u003c/div>\u003c/li>\n          \u003cli>\u003cdiv>\u003cb>総当たり戦\u003c/b>2チームで対戦。時間の許す限り、いろいろなチームと当たります。対戦表に出る\u003cb>コート番号\u003c/b>を見て移動してください。\u003c/div>\u003c/li>\n          \u003cli>\u003cdiv>\u003cb>順位発表\u003c/b>全試合の合計点がいちばん高いチームが優勝です。\u003c/div>\u003c/li>\n        \u003c/ol>\n      \u003c/div>\n\n      \u003cdiv class=\"box\" id=\"r-team\">\n        \u003ch2 class=\"h\">チームの決め方\u003c/h2>\n        \u003cp>チームは基本\u003cb>3人\u003c/b>。参加人数によって\u003cb>2〜4人\u003c/b>のチームもできます。チーム数はだいたい\u003cb>6〜12チーム\u003c/b>で、お休みが出ないよう必ず\u003cb>偶数\u003c/b>にします。\u003c/p>\n        \u003ch3 class=\"s\">抽選は2段階\u003c/h3>\n        \u003col class=\"rules\">\n          \u003cli>\u003cb>① 経験豊富な人\u003c/b>を先に抽選して、各チームに1人ずつ入れます。\u003c/li>\n          \u003cli>\u003cb>② 残りの人\u003c/b>を抽選して、人数がそろうように振り分けます。\u003c/li>\n        \u003c/ol>\n        \u003cp class=\"muted\" style=\"margin-top:8px\">経験者が各チームにいるので、はじめての人も安心して投げられます。これまでの大会で上位に入ることが多い人どうしも、なるべく別のチームになるように抽選します。\u003c/p>\n        \u003cdiv class=\"calc\" aria-live=\"polite\">\n          \u003clabel for=\"calcN\">\u003cb>参加人数でチーム数を見てみる\u003c/b>\u003c/label>\n          \u003cinput type=\"range\" id=\"calcN\" min=\"6\" max=\"40\" value=\"21\">\n          \u003cdiv class=\"calc-out\" id=\"calcOut\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"box\" id=\"r-score\">\n        \u003ch2 class=\"h\">試合と得点\u003c/h2>\n        \u003cul class=\"rules\">\n          \u003cli>\u003cb>2チームで対戦\u003c/b>します。\u003c/li>\n          \u003cli>1試合は\u003cb>2セット\u003c/b>。2セットの得点を\u003cb>足した数\u003c/b>が、その試合のチームの得点です。\u003c/li>\n          \u003cli>勝ち負けではなく、\u003cb>取った点数がそのまま積み上がります\u003c/b>。負けたセットの点も大事です。\u003c/li>\n          \u003cli>大会の順位は\u003cb>全試合の合計点\u003c/b>が高い順。\u003c/li>\n        \u003c/ul>\n        \u003ch3 class=\"s\">例えば\u003c/h3>\n        \u003cdiv class=\"ex\">\n          \u003cdiv>\u003cdiv class=\"tm\">チーム1\u003c/div>\u003cdiv class=\"calcline num\">50＋32\u003c/div>\u003cdiv class=\"big num\" style=\"font-size:1.5rem\">82点\u003c/div>\u003c/div>\n          \u003cdiv class=\"vs\">VS\u003c/div>\n          \u003cdiv>\u003cdiv class=\"tm\">チーム2\u003c/div>\u003cdiv class=\"calcline num\">41＋50\u003c/div>\u003cdiv class=\"big num\" style=\"font-size:1.5rem\">91点\u003c/div>\u003c/div>\n        \u003c/div>\n        \u003cp class=\"muted\" style=\"margin-top:8px\">この試合で、チーム1の合計に82点、チーム2の合計に91点が加わります。\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"box\" id=\"r-basic\">\n        \u003ch2 class=\"h\">モルックの基本（はじめての方へ）\u003c/h2>\n        \u003cul class=\"rules\">\n          \u003cli>木の棒「モルック」を\u003cb>下手投げ\u003c/b>でピンに向かって投げます。チーム内で順番に1投ずつ。\u003c/li>\n          \u003cli>\u003cb>1本だけ\u003c/b>倒れたら、そのピンの\u003cb>数字\u003c/b>が得点。\u003c/li>\n          \u003cli>\u003cb>2本以上\u003c/b>倒れたら、倒れた\u003cb>本数\u003c/b>が得点。\u003c/li>\n          \u003cli>\u003cb>ぴったり50点\u003c/b>で上がり。50点を超えたら\u003cb>25点\u003c/b>に戻ります。\u003c/li>\n          \u003cli>倒れたピンは、倒れた場所で立てて次の投てきへ。\u003c/li>\n          \u003cli>1本も倒せない投てきが\u003cb>3回連続\u003c/b>すると、\u003cb>そのセットは0点\u003c/b>になります。\u003c/li>\n        \u003c/ul>\n        \u003ch3 class=\"s\">ピンをタップして体験\u003c/h3>\n        \u003cdiv class=\"sim\">\n          \u003cdiv class=\"pins\" id=\"pins\" aria-label=\"ピンの並び\">\u003c/div>\n          \u003cdiv class=\"sim-score\">\u003cspan>今回 \u003cb class=\"big num\" id=\"simNow\">0\u003c/b> 点\u003c/span>\u003cspan>合計 \u003cb class=\"big num\" id=\"simTot\">0\u003c/b> 点\u003c/span>\u003c/div>\n          \u003cdiv class=\"sim-msg\" id=\"simMsg\" aria-live=\"polite\">倒したいピンをタップして「投げる」\u003c/div>\n          \u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" id=\"simThrow\">投げる\u003c/button>\u003cbutton class=\"btn ghost\" id=\"simReset\">最初から\u003c/button>\u003c/div>\n        \u003c/div>\n        \u003cp class=\"muted\" style=\"margin-top:8px\">細かいルールは当日、指導員がやさしく教えてくれます。\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"box\" id=\"r-input\">\n        \u003ch2 class=\"h\">対戦と結果の見方\u003c/h2>\n        \u003col class=\"flow\">\n          \u003cli>\u003cdiv>\u003cb>「対戦・結果」を開く\u003c/b>自分のチームを選ぶと、自分の試合だけ見やすくなります。\u003c/div>\u003c/li>\n          \u003cli>\u003cdiv>\u003cb>自分のコートで試合\u003c/b>試合が終わったら、各チームの2セット合計点を運営へ伝えてください。\u003c/div>\u003c/li>\n          \u003cli>\u003cdiv>\u003cb>「順位」で確認\u003c/b>運営が登録すると合計点と順位に反映されます。訂正は運営へお知らせください。\u003c/div>\u003c/li>\n        \u003c/ol>\n        \u003cdiv class=\"actions\" style=\"margin-top:10px\">\u003cbutton class=\"btn cyan\" data-go=\"match\">対戦・結果へ\u003c/button>\u003cbutton class=\"btn\" data-go=\"rank\">順位を見る\u003c/button>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"box\" id=\"r-faq\">\n        \u003ch2 class=\"h\">よくある質問\u003c/h2>\n        \u003cdetails class=\"faq\">\u003csummary>モルックをやったことがなくても大丈夫？\u003c/summary>\u003cp>大丈夫です。指導員が6名在籍しています。各チームに経験者が入るように抽選するので、投げ方もその場で教われます。\u003c/p>\u003c/details>\n        \u003cdetails class=\"faq\">\u003csummary>ひとりで参加してもいい？\u003c/summary>\u003cp>もちろんです。個人エントリーなので、ひとりで来た方も抽選でチームに入ります。\u003c/p>\u003c/details>\n        \u003cdetails class=\"faq\">\u003csummary>子どもも参加できる？\u003c/summary>\u003cp>小学生もガンガン投げています。家族での参加も大歓迎です。\u003c/p>\u003c/details>\n        \u003cdetails class=\"faq\">\u003csummary>知り合いと同じチームで出たい\u003c/summary>\u003cp>受付のときに運営へ伝えてください。\u003c/p>\u003c/details>\n        \u003cdetails class=\"faq\">\u003csummary>途中から来る・途中で帰るときは？\u003c/summary>\u003cp>早めに帰る予定が分かっている方は、受付のときに伝えてください。抜けても2人以上残るチームに入れます。急に帰ることになったときも運営に伝えてください。大会の途中でも、チームのメンバーやチーム数を組み替えることがあります。そのときは対戦表も新しくなるので、「対戦・結果」で次の相手を確認してください。それまでに取った点数はそのまま残ります。\u003c/p>\u003c/details>\n        \u003cdetails class=\"faq\">\u003csummary>「覇者」「覇王戦」って？\u003c/summary>\u003cp>毎月の大会で優勝したチームのメンバーは「覇者」です。ときどき開催される「覇王戦」（個人戦）には、前回の覇王戦より後に優勝した覇者だけが出場できます。今の覇者は「記録」タブで見られます。\u003c/p>\u003c/details>\n        \u003cdetails class=\"faq\">\u003csummary>どうやって申し込むの？\u003c/summary>\u003cp>インスタグラム \u003cb id=\"insta\">@izumi_molkky\u003c/b> にDMをください。県内の方も県外の方もお待ちしています。\u003c/p>\u003c/details>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ===== 順位 ===== -->\n    \u003csection class=\"panel\" id=\"p-rank\" role=\"tabpanel\" aria-labelledby=\"t-rank\" hidden>\n      \u003cdiv class=\"box plain prog\" id=\"rankProg\">\u003c/div>\n      \u003cdiv id=\"rankBody\">\u003c/div>\n      \u003cdiv id=\"champBox\">\u003c/div>\n    \u003c/section>\n\n    \u003c!-- ===== 対戦 ===== -->\n    \u003csection class=\"panel\" id=\"p-match\" role=\"tabpanel\" aria-labelledby=\"t-match\" hidden>\n      \u003cdiv class=\"box plain\" style=\"display:grid;gap:10px\">\n        \u003cdiv>\u003cb>自分のチーム\u003c/b>\u003cspan class=\"muted\">（選ぶと自分の試合が目立ちます）\u003c/span>\u003c/div>\n        \u003cdiv class=\"chiprow\" id=\"myTeamChips\">\u003c/div>\n        \u003cdiv class=\"chiprow\" id=\"matchFilter\">\n          \u003cbutton class=\"chip\" data-f=\"all\" aria-pressed=\"true\">すべての試合\u003c/button>\n          \u003cbutton class=\"chip\" data-f=\"todo\" aria-pressed=\"false\">結果待ち\u003c/button>\n          \u003cbutton class=\"chip\" data-f=\"mine\" aria-pressed=\"false\">自分のチームだけ\u003c/button>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"matchBody\" class=\"panel\">\u003c/div>\n    \u003c/section>\n\n    \u003c!-- ===== チーム ===== -->\n    \u003csection class=\"panel\" id=\"p-team\" role=\"tabpanel\" aria-labelledby=\"t-team\" hidden>\n      \u003cdiv id=\"teamBody\">\u003c/div>\n    \u003c/section>\n\n    \u003c!-- ===== 記録 ===== -->\n    \u003csection class=\"panel\" id=\"p-rec\" role=\"tabpanel\" aria-labelledby=\"t-rec\" hidden>\n      \u003cdiv class=\"box plain\" style=\"display:grid;gap:10px\">\n        \u003cdiv class=\"recsum\" id=\"recSum\">\u003c/div>\n        \u003cdiv class=\"chiprow\" id=\"recYears\">\u003c/div>\n        \u003cinput class=\"input\" id=\"recSearch\" type=\"search\" autocomplete=\"off\" placeholder=\"名前で探す\" aria-label=\"名前で探す\">\n      \u003c/div>\n      \u003cdiv class=\"box haoh\" id=\"haohBox\" hidden>\u003c/div>\n      \u003cdiv class=\"reclist\" id=\"recList\">\u003cdiv class=\"box plain empty\">\u003cb>記録を読み込んでいます\u003c/b>\u003c/div>\u003c/div>\n      \u003cp class=\"muted\">記録は、運営がその月の大会を「リセット」したときに、その日の順位と一緒に残ります。\u003c/p>\n    \u003c/section>\n\n  \u003c/main>\n  \u003cp class=\"mk-ver\" style=\"margin:28px 16px 20px;text-align:center;font-size:13px;line-height:1.6;color:var(--muted,#777)\">版 2026.11.21\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"ov\" id=\"ov\" hidden>\u003cdiv class=\"sheet\" id=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sheetTitle\">\u003c/div>\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" hidden>\u003c/div>\n\n\u003cscript>\n/* 版番号：コードを直したら3ファイル（Code.gs・Index・Admin）とも同じ日付に変える。運営画面の下に出る */\nfunction mk_suggestTeams(n) {\n  /* 休みが出ないよう偶数チーム。1チーム3人に近くなる数を選ぶ */\n  if (n \u003c 4) return 2;\n  var best = 2, bestD = Infinity;\n  for (var t = 2; t \u003c= n / 2; t += 2) {\n    var d = Math.abs(n / t - 3);\n    if (d \u003c bestD - 1e-9) { best = t; bestD = d; }\n  }\n  return best;\n}\n\n/* チーム抽選：経験豊富者 → 各チームへ1人ずつ、残り → 人数の少ないチームへ。固定ペアはまとめて1つの単位として扱う。\n   早めに帰る人がいるときは、その人が抜けても2人以上残るチーム（または全員が早帰りで丸ごと解散できるチーム）になるよう入れ替える */\nfunction mk_num(v) { return v === '' || v === null || v === undefined ? null : Number(v); }\nfunction mk_total(m, side) {\n  var first = mk_num(m[side + '1']), second = mk_num(m[side + '2']);\n  if (first !== null && second !== null) return first + second;\n  return mk_num(m[side === 'a' ? 'totalA' : 'totalB']);\n}\nfunction mk_hasResult(m) {\n  return ['a','b'].every(function (side) {\n    var total = mk_total(m, side);\n    return total !== null && Number.isInteger(total) && total >= 0 && total \u003c= 100;\n  });\n}\nfunction mk_haohStatus(rows, haoh, roster) {\n  var last = (haoh || []).reduce(function (a, h) { return !a || h.date > a.date ? h : a; }, null);\n  var cutoff = last ? last.date : '';\n  var nm = {};\n  (roster || []).forEach(function (r) { nm[r.id] = r.name; });\n  var by = {};\n  (rows || []).forEach(function (r) {\n    if (Number(r.rank) !== 1 || !r.date || (cutoff && r.date \u003c= cutoff)) return;\n    var key = r.mid || ('n:' + r.name);\n    var e = by[key] || (by[key] = { key: key, name: nm[r.mid] || r.name, wins: 0, dates: {}, last: '' });\n    if (e.dates[r.date]) return;\n    e.dates[r.date] = 1; e.wins++;\n    if (r.date > e.last) e.last = r.date;\n  });\n  var list = Object.keys(by).map(function (k) { var e = by[k]; delete e.dates; return e; })\n    .sort(function (a, b) { return b.wins - a.wins || (a.last \u003c b.last ? -1 : a.last > b.last ? 1 : 0); });\n  return { last: last, cutoff: cutoff, nextNo: (haoh || []).reduce(function (mx, h) { return Math.max(mx, h.no || 0); }, 0) + 1, eligible: list };\n}\n\

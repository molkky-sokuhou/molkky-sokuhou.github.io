<body><main><header><strong>操作デモ</strong><button id="op" aria-pressed="true">運営画面</button><button id="sp" aria-pressed="false">参加者画面</button></header>

<script>
const admin=document.getElementById('admin'), spectator=document.getElementById('spectator');
let snapshot=null;
window.addEventListener('message', e=>{
  if(e.source===admin.contentWindow && e.data && e.data.type==='month-demo-state') {
    snapshot=e.data; spectator.contentWindow.postMessage(snapshot,'*');
  } else if(e.source===spectator.contentWindow && e.data && e.data.type==='month-demo-view-ready' && snapshot) spectator.contentWindow.postMessage(snapshot,'*');
});
function selectScreen(isAdmin){
  admin.hidden=!isAdmin; spectator.hidden=isAdmin;
  document.getElementById('op').setAttribute('aria-pressed',String(isAdmin));
  document.getElementById('sp').setAttribute('aria-pressed',String(!isAdmin));
}
document.getElementById('op').onclick=()=>selectScreen(true);
document.getElementById('sp').onclick=()=>selectScreen(false);

var l = d ? '明るい画面にする' : '暗い画面にする'; b.setAttribute('aria-label', l); b.title = l; });\n    all('[data-fs-set]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-fs-set') === fs ? 'true' : 'false'); });\n  }\n  function closeAll() { all('.vc-pop').forEach(function (p) { p.hidden = true; }); all('[data-vc=\"font\"]').forEach(function (b) { b.setAttribute('aria-expanded', 'false'); }); }\n  document.addEventListener('click', function (e) {\n    var el = e.target && e.target.closest ? e.target : null;\n    var b = el && el.closest('[data-vc],[data-fs-set]');\n    if (!b) { if (!(el && el.closest('.vc-pop'))) closeAll(); return; }\n    var vc = b.getAttribute('data-vc');\n    if (vc === 'theme') { var n = isDark() ? 'light' : 'dark'; R.setAttribute('data-theme', n); s('theme', n); closeAll(); paint(); }\n    else if (vc === 'font') { var pop = b.parentNode.querySelector('.vc-pop'), open = pop.hidden; closeAll(); pop.hidden = !open; b.setAttribute('aria-expanded', open ? 'true' : 'false'); }\n    else { var v = b.getAttribute('data-fs-set'); if (v === 'm') R.removeAttribute('data-fs'); else R.setAttribute('data-fs', v); s('fs', v); paint(); }\n  });\n  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(); });\n  if (mq && mq.addEventListener) mq.addEventListener('change', paint);\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint); else paint();\n})();\n\u003c/script>\n\n\u003cdiv class=\"wrap\">\n  \u003c!-- ===== パスコード ===== -->\n  \u003cdiv class=\"lockwrap\" id=\"lock\">\n    \u003cdiv class=\"vc-row\">\u003cdiv class=\"viewctl\" role=\"group\" aria-label=\"画面の表示\">\n\u003cbutton type=\"button\" class=\"vc-btn\" data-vc=\"theme\" aria-label=\"暗い画面にする\">\u003c/button>\n\u003cbutton type=\"button\" class=\"vc-btn\" data-vc=\"font\" aria-haspopup=\"true\" aria-expanded=\"false\" aria-label=\"文字の大きさを変える\" title=\"文字の大きさ\">\u003cspan class=\"vc-a\" aria-hidden=\"true\">\u003cspan class=\"s\">あ\u003c/span>\u003cspan class=\"b\">あ\u003c/span>\u003c/span>\u003c/button>\n\u003cdiv class=\"vc-pop\" hidden>\u003cb>文字の大きさ\u003c/b>\u003cdiv class=\"vc-opts\">\u003cbutton type=\"button\" data-fs-set=\"m\">標準\u003c/button>\u003cbutton type=\"button\" data-fs-set=\"l\">大きめ\u003c/button>\u003cbutton type=\"button\" data-fs-set=\"xl\">特大\u003c/button>\u003c/div>\u003csmall>この端末で覚えておきます\u003c/small>\u003c/div>\n\u003c/div>\u003c/div>\n    \u003cdiv>\n      \u003cdiv class=\"org\">泉鋼業(株)モルック部\u003c/div>\n      \u003ch1 class=\"title\" style=\"font-size:clamp(2.2rem,11vw,3.4rem)\">運営\u003cbr>メニュー\u003c/h1>\n    \u003c/div>\n    \u003cdiv class=\"box\">\n      \u003cp>受付・チーム抽選・結果の修正・リセットなどは、運営パスコードを入れると使えます。\u003c/p>\n      \u003cform id=\"lockForm\" style=\"display:grid;gap:10px\">\n        \u003cinput class=\"input big-in\" id=\"adminPassIn\" type=\"password\" autocomplete=\"current-password\" placeholder=\"運営パスコード\" aria-label=\"運営パスコード\">\n        \u003cbutton class=\"btn primary wide\" type=\"submit\">運営モードにする\u003c/button>\n      \u003c/form>\n      \u003cdiv class=\"err\" id=\"lockErr\" aria-live=\"polite\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"demo-bar\" id=\"demoBar\" hidden>これはプレビュー用のデモデータです。パスコードは \u003cb>demo-local\u003c/b> です。\u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"app\" hidden>\n    \u003cheader class=\"abar\">\n      \u003cdiv class=\"abar-in\">\n        \u003cdiv class=\"abar-top\">\u003ch1 class=\"abrand\">\u003csmall>泉鋼業(株)モルック部\u003c/small>\u003cspan id=\"aName\">月いちモルック\u003c/span> 運営\u003c/h1>\n\u003cdiv class=\"viewctl\" role=\"group\" aria-label=\"画面の表示\">\n\u003cbutton type=\"button\" class=\"vc-btn\" data-vc=\"theme\" aria-label=\"暗い画面にする\">\u003c/button>\n\u003cbutton type=\"button\" class=\"vc-btn\" data-vc=\"font\" aria-haspopup=\"true\" aria-expanded=\"false\" aria-label=\"文字の大きさを変える\" title=\"文字の大きさ\">\u003cspan class=\"vc-a\" aria-hidden=\"true\">\u003cspan class=\"s\">あ\u003c/span>\u003cspan class=\"b\">あ\u003c/span>\u003c/span>\u003c/button>\n\u003cdiv class=\"vc-pop\" hidden>\u003cb>文字の大きさ\u003c/b>\u003cdiv class=\"vc-opts\">\u003cbutton type=\"button\" data-fs-set=\"m\">標準\u003c/button>\u003cbutton type=\"button\" data-fs-set=\"l\">大きめ\u003c/button>\u003cbutton type=\"button\" data-fs-set=\"xl\">特大\u003c/button>\u003c/div>\u003csmall>この端末で覚えておきます\u003c/small>\u003c/div>\n\u003c/div>\u003c/div>\n        \u003cdiv class=\"pills\" id=\"pills\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"when-line\" id=\"whenLine\">\u003c/div>\n      \u003cdiv id=\"alertBox\">\u003c/div>\n      \u003cdiv class=\"loadbar\" id=\"loadbar\">\u003c/div>\n    \u003c/header>\n\n    \u003cmain>\n      \u003c!-- ===== 受付 ===== -->\n      \u003csection class=\"panel\" id=\"ph-entry\" hidden>\n        \u003cdiv class=\"box\">\n          \u003ch2 class=\"h\">受付\u003c/h2>\n          \u003cdiv class=\"field\">\n            \u003clabel for=\"eq\">名前で探す\u003c/label>\n            \u003cinput class=\"input big-in\" id=\"eq\" type=\"search\" autocomplete=\"off\" enterkeyhint=\"done\" placeholder=\"名前の一部（はじめての人はフルネーム）\">\n          \u003c/div>\n          \u003cdiv class=\"rgrid\" id=\"rList\">\u003c/div>\n          \u003cdiv class=\"subbox\" id=\"newBox\" hidden style=\"margin-top:12px\">\n            \u003cdiv id=\"newMsg\">\u003cb id=\"newName\">\u003c/b> さんは名簿にいません。はじめての人として受付します。\u003c/div>\n            \u003cdiv class=\"actions\">\n              \u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"pExp\">\u003cspan class=\"tr\">\u003c/span>経験豊富\u003c/label>\u003clabel id=\"pLevelWrap\" hidden>経験者レベル（10が最高） \u003cselect class=\"input\" id=\"pLevel\">\u003coption value=\"1\">1\u003c/option>\u003coption value=\"2\">2\u003c/option>\u003coption value=\"3\">3\u003c/option>\u003coption value=\"4\">4\u003c/option>\u003coption value=\"5\" selected>5\u003c/option>\u003coption value=\"6\">6\u003c/option>\u003coption value=\"7\">7\u003c/option>\u003coption value=\"8\">8\u003c/option>\u003coption value=\"9\">9\u003c/option>\u003coption value=\"10\">10\u003c/option>\u003c/select>\u003c/label>\n              \u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"pEarly\">\u003cspan class=\"tr\">\u003c/span>早めに帰る\u003c/label>\n            \u003c/div>\n            \u003cdiv class=\"field\">\u003clabel for=\"pPair\">同じチーム希望の目印（任意）\u003c/label>\u003cinput class=\"input\" id=\"pPair\" autocomplete=\"off\" maxlength=\"20\" placeholder=\"例：A（同じ目印の人は同じチーム）\">\u003c/div>\n            \u003cbutton class=\"btn primary wide\" id=\"newAdd\" type=\"button\">はじめての人として受付\u003c/button>\n          \u003c/div>\n          \u003cp class=\"muted\" id=\"rNote\" style=\"margin:10px 0 0\">参加回数が多い順。タップでチェックして、下のボタンでまとめて受付します。\u003c/p>\n        \u003c/div>\n        \u003cdiv id=\"entryStatus\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"qbar\" id=\"qBar\" hidden>\u003cbutton class=\"btn primary\" id=\"qAdd\" type=\"button\">チェックした人を受付\u003c/button>\u003c/div>\n        \u003cdiv class=\"box\">\n          \u003cdiv class=\"sec-h\">\u003ch2 class=\"h\">受付済み\u003c/h2>\u003cdiv class=\"chiprow\" id=\"pCount\">\u003c/div>\u003c/div>\n          \u003cp class=\"muted\">名前を押すと、経験豊富・早めに帰る・同じチーム希望・チーム・名前の修正と削除ができます。\u003c/p>\n          \u003cul class=\"plist2\" id=\"plist\">\u003c/ul>\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- ===== チーム ===== -->\n      \u003csection id=\"ph-team\" hidden>\n        \u003cdiv class=\"box\" id=\"drawCard\">\n          \u003ch2 class=\"h\" id=\"drawH\">チーム抽選\u003c/h2>\n          \u003cdiv class=\"drawbox\">\n            \u003cdiv class=\"actions\">\n              \u003cspan>\u003cb>チーム数\u003c/b>\u003cspan class=\"muted\">（偶数）\u003c/span>\u003c/span>\n              \u003cspan class=\"stepper\">\u003cbutton class=\"btn small\" id=\"tcMinus\" aria-label=\"チーム数を2つ減らす\">－\u003c/button>\u003cspan class=\"big num\" id=\"tcVal\">6\u003c/span>\u003cbutton class=\"btn small\" id=\"tcPlus\" aria-label=\"チーム数を2つ増やす\">＋\u003c/button>\u003c/span>\n              \u003cbutton class=\"btn small ghost\" id=\"tcAuto\">おすすめに戻す\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"sizes\" id=\"tcSizes\">\u003c/div>\n            \u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"usePairs\">\u003cspan class=\"tr\">\u003c/span>「同じチーム希望」を使う\u003c/label>\n            \u003clabel class=\"switch\" id=\"forceWrap\" hidden>\u003cinput type=\"checkbox\" id=\"forceDraw\">\u003cspan class=\"tr\">\u003c/span>入力済みの結果を消してやり直す\u003c/label>\n            \u003cbutton class=\"btn primary wide\" id=\"drawBtn\">抽選する\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"box\" id=\"teamCard\">\n          \u003cdiv class=\"sec-h\">\u003ch2 class=\"h\">チーム\u003c/h2>\u003cspan class=\"muted\" id=\"teamCnt\">\u003c/span>\u003c/div>\n          \u003cdiv id=\"syncMsg\" style=\"margin-bottom:10px\">\u003c/div>\n          \u003cdiv class=\"tgrid\" id=\"adjust\">\u003c/div>\n          \u003cdiv class=\"actions\" id=\"teamOps\" style=\"margin-top:12px\">\u003cbutton class=\"btn ghost\" id=\"addTeam\">チームを1つ追加\u003c/button>\u003cbutton class=\"btn primary\" id=\"rebuild\">対戦表を作り直す\u003c/button>\u003c/div>\n          \u003cp class=\"muted\" style=\"margin:8px 0 0\">メンバーの名前を押すとチームを移せます。作り直しても入力済みの結果は残り、まだの試合だけ今のチームで組み直します。\u003c/p>\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- ===== 試合 ===== -->\n      \u003csection class=\"panel\" id=\"ph-game\" hidden>\n        \u003cdiv class=\"box plain prog\" id=\"gProg\">\u003c/div>\n        \u003cdiv class=\"chiprow\" id=\"gFilter\">\n          \u003cbutton class=\"chip\" data-f=\"todo\" aria-pressed=\"true\">未入力だけ\u003c/button>\n          \u003cbutton class=\"chip\" data-f=\"all\" aria-pressed=\"false\">すべての試合\u003c/button>\n        \u003c/div>\n        \u003cdiv id=\"gBody\" class=\"panel\">\u003c/div>\n        \u003cdiv class=\"box\">\n          \u003ch2 class=\"h\">いまの順位\u003c/h2>\n          \u003col class=\"mini\" id=\"gRank\">\u003c/ol>\n        \u003c/div>\n        \u003cdiv class=\"box\">\n          \u003ch2 class=\"h\">対戦表の巡\u003c/h2>\n          \u003cp id=\"cycleInfo\">\u003c/p>\n          \u003cdiv class=\"actions\">\u003cbutton class=\"btn cyan\" id=\"addCycle\">もう1巡追加\u003c/button>\u003cbutton class=\"btn ghost\" id=\"rmCycle\">最後の巡を消す\u003c/button>\u003c/div>\n          \u003cp class=\"muted\" style=\"margin:8px 0 0\">1巡が終わってまだ時間があるときは、同じ組み合わせでもう1巡追加できます。\u003c/p>\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- ===== 記録 ===== -->\n      \u003csection class=\"panel\" id=\"ph-rec\" hidden>\n        \u003cdiv class=\"box\">\n          \u003ch2 class=\"h\">覇王戦\u003c/h2>\n          \u003cdiv id=\"haohAdmin\" class=\"muted\">記録を読み込んでいます\u003c/div>\n          \u003cform id=\"haohForm\" class=\"subbox\" style=\"margin-top:12px\">\n            \u003cb>覇王戦の結果を記録\u003c/b>\n            \u003cdiv class=\"rowform\">\n              \u003cdiv class=\"field\">\u003clabel for=\"hNo\">第何回\u003c/label>\u003cinput class=\"input\" id=\"hNo\" type=\"number\" min=\"1\" inputmode=\"numeric\">\u003c/div>\n              \u003cdiv class=\"field\">\u003clabel for=\"hDate\">開催日\u003c/label>\u003cinput class=\"input\" id=\"hDate\" type=\"date\">\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"field\">\u003clabel for=\"hKing\">覇王（優勝した人）\u003c/label>\u003cinput class=\"input\" id=\"hKing\" list=\"hKingList\" autocomplete=\"off\" maxlength=\"30\">\u003cdatalist id=\"hKingList\">\u003c/datalist>\u003c/div>\n            \u003cdiv class=\"field\">\u003cspan style=\"font-weight:700;font-size:.9rem\">出場者\u003c/span>\u003cdiv class=\"rgrid\" id=\"hEntrants\" style=\"margin-top:0\">\u003c/div>\u003c/div>\n            \u003cbutton class=\"btn primary\" type=\"submit\">覇王戦の結果を記録\u003c/button>\n            \u003cp class=\"muted\" style=\"margin:0\">記録すると、その日より後に優勝した人が次の覇王戦の出場資格者になります。出場者が分からない回は、チェックを外したままで大丈夫です。\u003c/p>\n          \u003c/form>\n        \u003c/div>\n        \u003cdiv class=\"box\">\n          \u003ch2 class=\"h\">過去の優勝を追加\u003c/h2>\n          \u003cp class=\"muted\">このシステムを使う前の大会の優勝チームを入れると、記録と覇者の一覧に入ります。分かる回だけで大丈夫です。\u003c/p>\n          \u003cform id=\"pastForm\" style=\"display:grid;gap:10px\">\n            \u003cdiv class=\"field\">\u003clabel for=\"pastDate\">開催日\u003c/label>\u003cinput class=\"input\" id=\"pastDate\" type=\"date\">\u003c/div>\n            \u003cdiv class=\"field\">\u003clabel for=\"pastNames\">優勝チームのメンバー\u003cspan class=\"muted\" style=\"font-weight:500\">（「、」か改行で区切る）\u003c/span>\u003c/label>\u003ctextarea class=\"input\" id=\"pastNames\" rows=\"3\" placeholder=\"例：いずみ たろう、こくぶ はなこ、たかまつ じろう\">\u003c/textarea>\u003c/div>\n            \u003cbutton class=\"btn cyan\" type=\"submit\">優勝を追加\u003c/button>\n          \u003c/form>\n        \u003c/div>\n        \u003cdiv class=\"box plain\">\n          \u003cdiv class=\"sec-h\">\u003ch2 class=\"h\">名簿\u003c/h2>\u003cspan class=\"muted num\" id=\"rosterCnt\">\u003c/span>\u003c/div>\n          \u003cp class=\"muted\">一度でも受付した人が名簿に入ります。参加は通算、覇者は今シーズン（2025/11/22〜）の回数です。\u003c/p>\n          \u003cul class=\"mini\" id=\"rosterList\">\u003c/ul>\n        \u003c/div>\n      \u003c/section>\n\n      \u003c!-- ===== 設定 ===== -->\n      \u003csection class=\"panel\" id=\"ph-set\" hidden>\n        \u003cdiv class=\"box\">\n          \u003ch2 class=\"h\">参加者に共有\u003c/h2>\n          \u003cp class=\"muted\">「QR」を押すと大きなQRコードが出ます。その場で読み取ってもらうか、スクショして送ってください。\u003c/p>\n          \u003cdiv class=\"share\" id=\"shareList\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"box\">\n          \u003ch2 class=\"h\">大会情報\u003c/h2>\n          \u003cform id=\"setForm\" style=\"display:grid;gap:10px\">\n            \u003cdiv class=\"rowform\">\n              \u003cdiv class=\"field\">\u003clabel for=\"sDate\">開催日\u003c/label>\u003cinput class=\"input\" id=\"sDate\" type=\"date\">\u003c/div>\n              \u003cdiv class=\"field\">\u003clabel for=\"sTime\">時間\u003c/label>\u003cinput class=\"input\" id=\"sTime\" placeholder=\"12時〜17時\">\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"field\">\u003clabel for=\"sPlace\">場所\u003c/label>\u003cinput class=\"input\" id=\"sPlace\">\u003c/div>\n            \u003cdiv class=\"field\">\u003clabel for=\"sAddr\">住所\u003c/label>\u003cinput class=\"input\" id=\"sAddr\">\u003c/div>\n            \u003cdiv class=\"rowform\">\n              \u003cdiv class=\"field\">\u003clabel for=\"sFee\">参加費\u003c/label>\u003cinput class=\"input\" id=\"sFee\">\u003c/div>\n              \u003cdiv class=\"field\">\u003clabel for=\"sCourts\">コート数\u003c/label>\u003cinput class=\"input\" id=\"sCourts\" type=\"number\" inputmode=\"numeric\" min=\"1\" max=\"50\">\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"field\">\u003clabel for=\"sName\">大会名\u003c/label>\u003cinput class=\"input\" id=\"sName\">\u003c/div>\n            \u003cdiv class=\"field\">\u003clabel for=\"sNotice\">お知らせ（参加者画面のルールの最初に出ます）\u003c/label>\u003cinput class=\"input\" id=\"sNotice\">\u003c/div>\n            \u003cbutton class=\"btn cyan\" type=\"submit\">大会情報を保存\u003c/button>\n          \u003c/form>\n        \u003c/div>\n        \u003cdiv class=\"box danger\">\n          \u003ch2 class=\"h\">今月のリセット\u003c/h2>\n          \u003cp>大会が終わったら押します。順位と試合結果、参加者ごとの記録を残してから、参加者・チーム・対戦表を空にします。大会情報とパスコードはそのまま残ります。\u003c/p>\n          \u003cp id=\"resetInfo\" style=\"font-weight:900\">\u003c/p>\n          \u003cform id=\"resetForm\" class=\"actions\">\n            \u003cinput class=\"input\" id=\"resetWord\" autocomplete=\"off\" placeholder=\"「リセット」と入力\" style=\"flex:1 1 180px\">\n            \u003cbutton class=\"btn primary\" type=\"submit\">リセットする\u003c/button>\n          \u003c/form>\n        \u003c/div>\n        \u003cbutton class=\"btn ghost\" id=\"logout\">運営モードを終える\u003c/button>\n      \u003c/section>\n    \u003c/main>\n    \u003cp class=\"mk-ver\" id=\"verLine\" style=\"margin:28px 16px 20px;text-align:center;font-size:13px;line-height:1.6;color:var(--muted,#777)\">版 2026.11.22-2\u003c/p>\n  \u003c/div>\n\u003c/div>\n\n\u003cnav class=\"bnav\" id=\"bnav\" aria-label=\"運営メニュー\" hidden>\n  \u003cdiv class=\"bnav-in\">\n    \u003cbutton class=\"nb\" data-ph=\"entry\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"9\" cy=\"8\" r=\"4\"/>\u003cpath d=\"M2 21c0-4 3-6 7-6s7 2 7 6\"/>\u003cpath d=\"M19 8v6M16 11h6\"/>\u003c/svg>受付\u003cspan class=\"badge\" id=\"bd-entry\" hidden>\u003c/span>\u003c/button>\n    \u003cbutton class=\"nb\" data-ph=\"team\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"7\" cy=\"8\" r=\"3\"/>\u003ccircle cx=\"17\" cy=\"8\" r=\"3\"/>\u003cpath d=\"M1 20c0-3 2.5-5 6-5s6 2 6 5M11 20c0-3 2.5-5 6-5s6 2 6 5\"/>\u003c/svg>チーム\u003cspan class=\"badge\" id=\"bd-team\" hidden>\u003c/span>\u003c/button>\n    \u003cbutton class=\"nb\" data-ph=\"game\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/>\u003cpath d=\"M3 9h18M9 4v16\"/>\u003c/svg>試合\u003cspan class=\"badge\" id=\"bd-game\" hidden>\u003c/span>\u003c/button>\n    \u003cbutton class=\"nb\" data-ph=\"rec\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M8 4h8v5a4 4 0 0 1-8 0z\"/>\u003cpath d=\"M8 6H4a3 3 0 0 0 4 4M16 6h4a3 3 0 0 1-4 4M12 13v4M8 21h8\"/>\u003c/svg>記録\u003c/button>\n    \u003cbutton class=\"nb\" data-ph=\"set\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/>\u003cpath d=\"M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1\"/>\u003c/svg>設定\u003c/button>\n  \u003c/div>\n\u003c/nav>\n\n\u003cdiv class=\"ov\" id=\"ov\" hidden>\u003cdiv class=\"sheet\" id=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sheetTitle\">\u003c/div>\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" hidden>\u003c/div>\n\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js\">\u003c/script>\n\u003cscript>\n/* 版番号：コードを直したら3ファイル（Code.gs・Index・Admin）とも同じ日付に変える。運営画面の下に出る */\nvar MK_VER = '2026.11.22-2';\n/* ===== 月いちモルック 共通ロジック（サーバーとプレビューで同じものを使う） ===== */\nvar MK_PUBLIC_KEYS = ['大会名', '開催日', '時間', '場所', '住所', '参加費', 'お知らせ', 'インスタ', 'コート数'];\n\nfunction mk_courtCount(settings) {\n  var n = Math.floor(Number(settings && settings['コート数']));\n  return n >= 1 && n \u003c= 50 ? n : 6;\n}\n\n// 会場掲示の8チーム表。Aを固定し、各ラウンドの両端から1〜4コートに置く。\nfunction mk_boardOrder(group, teamNos, courts) {\n  if (courts \u003c 4 || teamNos.length !== 8 || group.length !== 4) return null;\n  var round = Number(group[0].round);\n  if (round \u003c 1 || round > 7 || !Number.isInteger(round)) return null;\n  var ring = teamNos.slice().sort(function (a,b) { return a-b; });\n  for (var r = 1; r \u003c round; r++) ring.splice(1, 0, ring.pop());\n  var ordered = [];\n  for (var c = 0; c \u003c 4; c++) {\n    var a = ring[c], b = ring[7-c];\n    var match = group.find(function (m) { return (m.a === a && m.b === b) || (m.a === b && m.b === a); });\n    if (!match) return null;\n    ordered.push(match);\n  }\n  return ordered;\n}\n\nfunction mk_assignCourts(matches, courts) {\n  var groups = {}, teamSets = {}, out = {};\n  matches.forEach(function (m) {\n    var key = m.cycle + '-' + m.round;\n    (groups[key] = groups[key] || []).push(m);\n    var teams = teamSets[m.cycle] || (teamSets[m.cycle] = new Set());\n    teams.add(m.a); teams.add(m.b);\n  });\n  Object.keys(groups).forEach(function (key) {\n    var group = groups[key];\n    var ordered = mk_boardOrder(group, Array.from(teamSets[group[0].cycle]), courts);\n    if (!ordered) ordered = group.slice().sort(function (x, y) {\n      return (Number(String(x.id).split('-')[2]) || 0) - (Number(String(y.id).split('-')[2]) || 0);\n    });\n    ordered.forEach(function (m, i) {\n      out[m.id] = { court: (i % courts) + 1, wave: Math.floor(i / courts) + 1 };\n    });\n  });\n  return out;\n}\n\nfunction mk_shuffle(arr) {\n  var a = arr.slice();\n  for (var i = a.length - 1; i > 0; i--) {\n    var j = Math.floor(Math.random() * (i + 1));\n    var t = a[i]; a[i] = a[j]; a[j] = t;\n  }\n  return a;\n}\n\nfunction mk_suggestTeams(n) {\n  /* 休みが出ないよう偶数チーム。1チーム3人に近くなる数を選ぶ */\n  if (n \u003c 4) return 2;\n  var best = 2, bestD = Infinity;\n  for (var t = 2; t \u003c= n / 2; t += 2) {\n    var d = Math.abs(n / t - 3);\n    if (d \u003c bestD - 1e-9) { best = t; bestD = d; }\n  }\n  return best;\n}\n\n/* チーム抽選：経験豊富者 → 各チームへ1人ずつ、残り → 人数の少ないチームへ。固定ペアはまとめて1つの単位として扱う。\n   早めに帰る人がいるときは、その人が抜けても2人以上残るチーム（または全員が早帰りで丸ごと解散できるチーム）になるよう入れ替える */\nfunction mk_teamCheck(team) {\n  var size = 0, early = 0, strong = 0;\n  team.forEach(function (u) { size += u.members.length; early += u.early; strong += u.strong || 0; });\n  var stay = size - early;\n  return { size: size, early: early, strong: strong, stay: stay, bad: early > 0 && stay === 1, dissolve: early > 0 && stay === 0 };\n}\n\n/* 実績：直近12回の大会で、優勝3点・2〜3位1点として数える。その日の参加者のうち上位（チーム数ぶん）を「実績上位」とし、なるべく別々のチームにする */\nfunction mk_strengths(hist) {\n  var dates = {};\n  (hist || []).forEach(function (r) { if (r.date) dates[r.date] = 1; });\n  var recent = {};\n  Object.keys(dates).sort().reverse().slice(0, 12).forEach(function (d) { recent[d] = 1; });\n  var sc = {};\n  (hist || []).forEach(function (r) {\n    if (!recent[r.date] || !r.rank) return;\n    var pt = r.rank === 1 ? 3 : r.rank \u003c= 3 ? 1 : 0;\n    if (!pt) return;\n    if (r.mid) sc['m:' + r.mid] = (sc['m:' + r.mid] || 0) + pt;\n    sc['n:' + r.name] = (sc['n:' + r.name] || 0) + pt;\n  });\n  return sc;\n}\nfunction mk_topStrong(players, hist, N) {\n  var sc = mk_strengths(hist);\n  var list = players.map(function (p) {\n    var v = (p.mid && sc['m:' + p.mid] !== undefined) ? sc['m:' + p.mid] : (sc['n:' + p.name] || 0);\n    return { id: p.id, v: v };\n  }).filter(function (x) { return x.v > 0; });\n  list.sort(function (a, b) { return b.v - a.v; });\n  var out = {};\n  list.slice(0, N).forEach(function (x) { out[x.id] = x.v; });\n  return out;\n}\n\nfunction mk_level(value) {\n  var n = Number(value);\n  return Number.isInteger(n) && n >= 1 && n \u003c= 10 ? n : 5;\n}\n\nfunction mk_drawUnits(players, usePairs, strongMap) {\n  var groups = new Map(), units = [];\n  players.forEach(function (p) {\n    var tag = usePairs && String(p.pair || '').trim();\n    var u = tag && groups.get(tag);\n    if (!u) {\n      u = {members:[], exp:0, power:0, early:0, strong:0};\n      units.push(u);\n      if (tag) groups.set(tag, u);\n    }\n    u.members.push(p);\n    if (p.exp) { u.exp++; u.power += mk_level(p.level); }\n    if (p.early) u.early++;\n    if (strongMap && strongMap[p.id]) u.strong++;\n  });\n  return units;\n}\n\n// 同じ残り枠のチームは、希望グループを収容できるかという点では等価。\nfunction mk_packGroups(groups, capacities) {\n  var left = capacities.slice(), slots = [], failed = new Set();\n  function fit(k) {\n    if (k === groups.length) return true;\n    var key = k + '/' + left.slice().sort(function(a,b){return a-b;}).join(',');\n    if (failed.has(key)) return false;\n    var tried = new Set(), n = groups[k].members.length;\n    for (var i = 0; i \u003c left.length; i++) {\n      if (left[i] \u003c n || tried.has(left[i])) continue;\n      tried.add(left[i]);\n      left[i] -= n; slots[k] = i;\n      if (fit(k + 1)) return true;\n      left[i] += n;\n    }\n    failed.add(key);\n    return false;\n  }\n  return fit(0) ? slots : null;\n}\n\nfunction mk_capacityPlan(units, n, count) {\n  if (count \u003c 2 || count % 2 || n \u003c 2 * count) return null;\n  var groups = units.filter(function(u){return u.members.length > 1;})\n    .sort(function(a,b){return b.members.length - a.members.length;});\n  var largest = groups.length ? groups[0].members.length : 0;\n  function plan(caps) {\n    var slots = mk_packGroups(groups, caps);\n    return slots && {caps:caps, groups:groups, slots:slots};\n  }\n  if (largest > 4 && groups.some(function(u){return u.members.length === 4;})) return null;\n  if (largest !== 4) {\n    return plan(Array.from({length:count}, function(_,i){return Math.floor(n/count) + (i \u003c n % count ? 1 : 0);}));\n  }\n  var fixed = groups.filter(function(u){return u.members.length === 4;}).length;\n  for (var fours = Math.max(fixed, n - 3 * count); fours \u003c= count; fours++) {\n    var threes = n - 2 * count - 2 * fours;\n    if (threes \u003c 0) break;\n    var twos = count - fours - threes;\n    if (twos \u003c 0) continue;\n    var result = plan(Array(fours).fill(4).concat(Array(threes).fill(3), Array(twos).fill(2)));\n    if (result) return result;\n  }\n  return null;\n}\n\nfunction mk_fillTeams(units, plan) {\n  var groups = mk_shuffle(plan.groups.slice()).sort(function(a,b){return b.members.length-a.members.length;});\n  var teams = plan.caps.map(function(){return [];});\n  var space = plan.caps.slice(), exp = teams.map(function(){return 0;}), power = exp.slice();\n  function put(u,i) {\n    teams[i].push(u); space[i] -= u.members.length; exp[i] += u.exp; power[i] += u.power;\n  }\n  groups.forEach(function(u,k){put(u,plan.slots[k]);});\n  var singles = mk_shuffle(units.filter(function(u){return u.members.length === 1;}));\n  singles.sort(function(a,b){return b.power-a.power || b.early-a.early || b.strong-a.strong;});\n  singles.forEach(function(u){\n    var available = mk_shuffle(teams.map(function(_,i){return i;}).filter(function(i){return space[i]>0;}));\n    available.sort(function(a,b){return (u.exp && (exp[a]-exp[b] || power[a]-power[b])) || space[b]-space[a];});\n    put(u, available[0]);\n  });\n  return mk_shuffle(teams);\n}\n\nfunction mk_drawScore(teams) {\n  var sc = 0;\n  teams.forEach(function(t){\n    var power = 0, exp = 0;\n    t.forEach(function(u){power += u.power; exp += u.exp;});\n    sc += exp * exp * 10000 + power * power;\n  });\n  teams.forEach(function (t) { var c = mk_teamCheck(t); if (c.bad) sc += 100000; if (c.dissolve) sc += 1000; if (c.strong > 1) sc += (c.strong - 1) * 100; });\n  return sc;\n}\n\n/* 経験者の人数と、チームの人数のばらつきを崩さない入れ替え・移動で、早帰りの条件を満たすように直す */\nfunction mk_improve(teams) {\n  var score = mk_drawScore(teams);\n  for (var guard = 0; guard \u003c 400 && score > 0; guard++) {\n    var moves = [];\n    for (var a = 0; a \u003c teams.length; a++) for (var b = 0; b \u003c teams.length; b++) {\n      if (a === b) continue;\n      var sa = mk_teamCheck(teams[a]).size, sb = mk_teamCheck(teams[b]).size;\n      teams[a].forEach(function (u, ui) {\n        if (a \u003c b) teams[b].forEach(function (v, vi) {\n          if (u.members.length === v.members.length && u.exp === v.exp && (u.power !== v.power || u.early !== v.early || (u.strong || 0) !== (v.strong || 0))) moves.push(['swap', a, ui, b, vi]);\n        });\n        if (u.members.length === 1 && u.exp === 0 && sa - sb === 1) moves.push(['move', a, ui, b]);\n      });\n    }\n    mk_shuffle(moves);\n    var improved = false;\n    for (var k = 0; k \u003c moves.length; k++) {\n      var m = moves[k], A = teams[m[1]], B = teams[m[3]];\n      if (m[0] === 'swap') {\n        var t = A[m[2]]; A[m[2]] = B[m[4]]; B[m[4]] = t;\n        var ns = mk_drawScore(teams);\n        if (ns \u003c score) { score = ns; improved = true; break; }\n        t = A[m[2]]; A[m[2]] = B[m[4]]; B[m[4]] = t;\n      } else {\n        var u = A.splice(m[2], 1)[0]; B.push(u);\n        var ns2 = mk_drawScore(teams);\n        if (ns2 \u003c score) { score = ns2; improved = true; break; }\n        B.pop(); A.splice(m[2], 0, u);\n      }\n    }\n    if (!improved) break;\n  }\n  return score;\n}\n\nfunction mk_drawTeams(players, N, usePairs, strongMap) {\n  var units = mk_drawUnits(players, usePairs, strongMap);\n  var plan = mk_capacityPlan(units, players.length, N);\n  if (!plan) throw mk_err('このチーム数では同じ目印の全員を一緒にできません。人数の内訳を確認してください');\n  var best, bestScore = Infinity;\n  for (var attempt = 0; attempt \u003c 20; attempt++) {\n    var candidate = mk_fillTeams(units, plan);\n    var score = mk_drawScore(ca ">\n  \u003cheader>\u003cdiv class=\"headin\">\u003cdiv class=\"pre\">\u003cspan id=\"when\">月いちモルック\u003c/span>\u003cdiv class=\"headtools\">\u003cbutton type=\"button\" id=\"fontSwitch\">大きい文字\u003c/button>\u003cbutton type=\"button\" id=\"themeSwitch\">暗くする\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"ttl\">\u003ch1 id=\"title\">月いちモルック\u003c/h1>\u003cbutton type=\"button\" id=\"headReload\">最新にする\u003c/button>\u003c/div>\u003cdiv class=\"stamp\">\u003cspan id=\"syncStatus\" role=\"status\">読み込み中…\u003c/span>\u003cbutton id=\"syncRetry\" hidden>再読み込み\u003c/button>\u003c/div>\u003cdiv id=\"progressLine\" role=\"status\">\u003c/div>\u003cdiv class=\"loadbar\" id=\"loadbar\">\u003c/div>\u003c/div>\u003c/header>\n\u003cnav id=\"tabs\" role=\"tablist\" aria-label=\"速報のページ\">\u003cbutton data-tab=\"team\" id=\"t-team\" role=\"tab\">自分の\u003cbr>試合\u003c/button>\u003cbutton data-tab=\"match\" id=\"t-match\" role=\"tab\">試合・\u003cbr>コート\u003c/button>\u003cbutton data-tab=\"rank\" id=\"t-rank\" role=\"tab\">順位・\u003cbr>記録\u003c/button>\u003cbutton data-tab=\"rules\" id=\"t-rules\" role=\"tab\">会場・\u003cbr>ルール\u003c/button>\u003c/nav>\n  \u003cmain>\n    \u003cdiv id=\"netBar\" class=\"netbar\" hidden role=\"status\">\u003c/div>\n    \u003cdiv id=\"pendBar\" class=\"pendbar\" hidden role=\"alert\">\u003c/div>\n    \u003c!-- ===== ルール ===== -->\n    \u003csection class=\"panel\" id=\"p-rules\" role=\"tabpanel\" aria-labelledby=\"t-rules\">\n      \u003ch2>会場・ルール\u003c/h2>\u003cdiv class=\"whereLine\" id=\"where\">\u003c/div>\u003cdiv>参加費　\u003cspan id=\"fee\">\u003c/span>\u003c/div>\u003cdiv class=\"callout\" id=\"notice\">指導員6名在籍なので初心者の方も大歓迎！\u003c/div>\n      \u003cnav class=\"toc\" aria-label=\"ルールの目次\">\n        \u003ca href=\"#r-flow\">大会のながれ\u003c/a>\u003ca href=\"#r-team\">チームの決め方\u003c/a>\u003ca href=\"#r-score\">試合と得点\u003c/a>\u003ca href=\"#r-basic\">モルックの基本\u003c/a>\u003ca href=\"#r-input\">対戦と結果の見方\u003c/a>\u003ca href=\"#r-faq\">よくある質問\u003c/a>\n      \u003c/nav>\n\n      \u003cdiv class=\"box\" id=\"r-flow\">\n        \u003ch2 class=\"h\">大会のながれ\u003c/h2>\n        \u003col class=\"flow\">\n          \u003cli>\u003cdiv>\u003cb>受付（ひとりずつエントリー）\u003c/b>参加費 \u003cspan id=\"fee2\">1人200円\u003c/span>。友だち同士でも、まずは1人ずつ受付します。\u003c/div>\u003c/li>\n          \u003cli>\u003cdiv>\u003cb>チーム抽選\u003c/b>その日の参加者で、抽選で3人ずつのチームを作ります。お休みのチームが出ないよう、チーム数は偶数にします。\u003c/div>\u003c/li>\n          \u003cli>\u003cdiv>\u003cb>総当たり戦\u003c/b>2チームで対戦。時間の許す限り、いろいろなチームと当たります。対戦表に出る\u003cb>コート番号\u003c/b>を見て移動してください。\u003c/div>\u003c/li>\n          \u003cli>\u003cdiv>\u003cb>順位発表\u003c/b>全試合の合計点がいちばん高いチームが優勝です。\u003c/div>\u003c/li>\n        \u003c/ol>\n      \u003c/div>\n\n      \u003cdiv class=\"box\" id=\"r-team\">\n        \u003ch2 class=\"h\">チームの決め方\u003c/h2>\n        \u003cp>チームは基本\u003cb>3人\u003c/b>。参加人数によって\u003cb>2〜4人\u003c/b>のチームもできます。チーム数はだいたい\u003cb>6〜12チーム\u003c/b>で、お休みが出ないよう必ず\u003cb>偶数\u003c/b>にします。\u003c/p>\n        \u003ch3 class=\"s\">抽選は2段階\u003c/h3>\n        \u003col class=\"rules\">\n          \u003cli>\u003cb>① 経験豊富な人\u003c/b>を先に抽選して、各チームに1人ずつ入れます。\u003c/li>\n          \u003cli>\u003cb>② 残りの人\u003c/b>を抽選して、人数がそろうように振り分けます。\u003c/li>\n        \u003c/ol>\n        \u003cp class=\"muted\" style=\"margin-top:8px\">経験者が各チームにいるので、はじめての人も安心して投げられます。これまでの大会で上位に入ることが多い人どうしも、なるべく別のチームになるように抽選します。\u003c/p>\n        \u003cdiv class=\"calc\" aria-live=\"polite\">\n          \u003clabel for=\"calcN\">\u003cb>参加人数でチーム数を見てみる\u003c/b>\u003c/label>\n          \u003cinput type=\"range\" id=\"calcN\" min=\"6\" max=\"40\" value=\"21\">\n          \u003cdiv class=\"calc-out\" id=\"calcOut\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"box\" id=\"r-score\">\n        \u003ch2 class=\"h\">試合と得点\u003c/h2>\n        \u003cul class=\"rules\">\n          \u003cli>\u003cb>2チームで対戦\u003c/b>します。\u003c/li>\n          \u003cli>1試合は\u003cb>2セット\u003c/b>。2セットの得点を\u003cb>足した数\u003c/b>が、その試合のチームの得点です。\u003c/li>\n          \u003cli>勝ち負けではなく、\u003cb>取った点数がそのまま積み上がります\u003c/b>。負けたセットの点も大事です。\u003c/li>\n          \u003cli>大会の順位は\u003cb>全試合の合計点\u003c/b>が高い順。\u003c/li>\n        \u003c/ul>\n        \u003ch3 class=\"s\">例えば\u003c/h3>\n        \u003cdiv class=\"ex\">\n          \u003cdiv>\u003cdiv class=\"tm\">チーム1\u003c/div>\u003cdiv class=\"calcline num\">50＋32\u003c/div>\u003cdiv class=\"big num\" style=\"font-size:1.5rem\">82点\u003c/div>\u003c/div>\n          \u003cdiv class=\"vs\">VS\u003c/div>\n          \u003cdiv>\u003cdiv class=\"tm\">チーム2\u003c/div>\u003cdiv class=\"calcline num\">41＋50\u003c/div>\u003cdiv class=\"big num\" style=\"font-size:1.5rem\">91点\u003c/div>\u003c/div>\n        \u003c/div>\n        \u003cp class=\"muted\" style=\"margin-top:8px\">この試合で、チーム1の合計に82点、チーム2の合計に91点が加わります。\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"box\" id=\"r-basic\">\n        \u003ch2 class=\"h\">モルックの基本（はじめての方へ）\u003c/h2>\n        \u003cul class=\"rules\">\n          \u003cli>木の棒「モルック」を\u003cb>下手投げ\u003c/b>でピンに向かって投げます。チーム内で順番に1投ずつ。\u003c/li>\n          \u003cli>\u003cb>1本だけ\u003c/b>倒れたら、そのピンの\u003cb>数字\u003c/b>が得点。\u003c/li>\n          \u003cli>\u003cb>2本以上\u003c/b>倒れたら、倒れた\u003cb>本数\u003c/b>が得点。\u003c/li>\n          \u003cli>\u003cb>ぴったり50点\u003c/b>で上がり。50点を超えたら\u003cb>25点\u003c/b>に戻ります。\u003c/li>\n          \u003cli>倒れたピンは、倒れた場所で立てて次の投てきへ。\u003c/li>\n          \u003cli>1本も倒せない投てきが\u003cb>3回連続\u003c/b>すると、\u003cb>そのセットは0点\u003c/b>になります。\u003c/li>\n        \u003c/ul>\n        \u003ch3 class=\"s\">ピンをタップして体験\u003c/h3>\n        \u003cdiv class=\"sim\">\n          \u003cdiv class=\"pins\" id=\"pins\" aria-label=\"ピンの並び\">\u003c/div>\n          \u003cdiv class=\"sim-score\">\u003cspan>今回 \u003cb class=\"big num\" id=\"simNow\">0\u003c/b> 点\u003c/span>\u003cspan>合計 \u003cb class=\"big num\" id=\"simTot\">0\u003c/b> 点\u003c/span>\u003c/div>\n          \u003cdiv class=\"sim-msg\" id=\"simMsg\" aria-live=\"polite\">倒したいピンをタップして「投げる」\u003c/div>\n          \u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" id=\"simThrow\">投げる\u003c/button>\u003cbutton class=\"btn ghost\" id=\"simReset\">最初から\u003c/button>\u003c/div>\n        \u003c/div>\n        \u003cp class=\"muted\" style=\"margin-top:8px\">細かいルールは当日、指導員がやさしく教えてくれます。\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"box\" id=\"r-input\">\n        \u003ch2 class=\"h\">対戦と結果の見方\u003c/h2>\n        \u003col class=\"flow\">\n          \u003cli>\u003cdiv>\u003cb>「対戦・結果」を開く\u003c/b>自分のチームを選ぶと、自分の試合だけ見やすくなります。\u003c/div>\u003c/li>\n          \u003cli>\u003cdiv>\u003cb>自分のコートで試合\u003c/b>試合が終わったら、各チームの2セット合計点を運営へ伝えてください。\u003c/div>\u003c/li>\n          \u003cli>\u003cdiv>\u003cb>「順位」で確認\u003c/b>運営が登録すると合計点と順位に反映されます。訂正は運営へお知らせください。\u003c/div>\u003c/li>\n        \u003c/ol>\n        \u003cdiv class=\"actions\" style=\"margin-top:10px\">\u003cbutton class=\"btn cyan\" data-go=\"match\">対戦・結果へ\u003c/button>\u003cbutton class=\"btn\" data-go=\"rank\">順位を見る\u003c/button>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"box\" id=\"r-faq\">\n        \u003ch2 class=\"h\">よくある質問\u003c/h2>\n        \u003cdetails class=\"faq\">\u003csummary>モルックをやったことがなくても大丈夫？\u003c/summary>\u003cp>大丈夫です。指導員が6名在籍しています。各チームに経験者が入るように抽選するので、投げ方もその場で教われます。\u003c/p>\u003c/details>\n        \u003cdetails class=\"faq\">\u003csummary>ひとりで参加してもいい？\u003c/summary>\u003cp>もちろんです。個人エントリーなので、ひとりで来た方も抽選でチームに入ります。\u003c/p>\u003c/details>\n        \u003cdetails class=\"faq\">\u003csummary>子どもも参加できる？\u003c/summary>\u003cp>小学生もガンガン投げています。家族での参加も大歓迎です。\u003c/p>\u003c/details>\n        \u003cdetails class=\"faq\">\u003csummary>知り合いと同じチームで出たい\u003c/summary>\u003cp>受付のときに運営へ伝えてください。\u003c/p>\u003c/details>\n        \u003cdetails class=\"faq\">\u003csummary>途中から来る・途中で帰るときは？\u003c/summary>\u003cp>早めに帰る予定が分かっている方は、受付のときに伝えてください。抜けても2人以上残るチームに入れます。急に帰ることになったときも運営に伝えてください。大会の途中でも、チームのメンバーやチーム数を組み替えることがあります。そのときは対戦表も新しくなるので、「対戦・結果」で次の相手を確認してください。それまでに取った点数はそのまま残ります。\u003c/p>\u003c/details>\n        \u003cdetails class=\"faq\">\u003csummary>「覇者」「覇王戦」って？\u003c/summary>\u003cp>毎月の大会で優勝したチームのメンバーは「覇者」です。ときどき開催される「覇王戦」（個人戦）には、前回の覇王戦より後に優勝した覇者だけが出場できます。今の覇者は「記録」タブで見られます。\u003c/p>\u003c/details>\n        \u003cdetails class=\"faq\">\u003csummary>どうやって申し込むの？\u003c/summary>\u003cp>インスタグラム \u003cb id=\"insta\">@izumi_molkky\u003c/b> にDMをください。県内の方も県外の方もお待ちしています。\u003c/p>\u003c/details>\n      \u003c/div>\n    \u003c/section>\n\n\u003csection id=\"p-team\" role=\"tabpanel\" aria-labelledby=\"t-team\">\u003cdiv id=\"pickBox\">\u003ch2>自分のチームを選ぶ\u003c/h2>\u003clabel for=\"teamQuery\">チーム名・メンバー名で探す\u003c/label>\u003cinput id=\"teamQuery\" type=\"search\" placeholder=\"名前を入力\" autocomplete=\"off\">\u003cul class=\"pick\" id=\"teamPickList\">\u003c/ul>\u003c/div>\u003cdiv id=\"mineBody\">\u003c/div>\u003c/section>\n\u003csection id=\"p-match\" role=\"tabpanel\" aria-labelledby=\"t-match\" hidden>\u003cdiv id=\"gamesBody\">\u003c/div>\u003c/section>\n\u003csection id=\"p-rank\" role=\"tabpanel\" aria-labelledby=\"t-rank\" hidden>\u003ch2>順位・記録\u003c/h2>\u003cdiv id=\"rankBody\">\u003c/div>\u003cdiv id=\"champBox\">\u003c/div>\u003cdetails id=\"recordsPanel\">\u003csummary>過去の個人成績・覇王戦を見る\u003c/summary>\n      \u003cdiv class=\"box plain\" style=\"display:grid;gap:10px\">\n        \u003cdiv class=\"recsum\" id=\"recSum\">\u003c/div>\n        \u003cdiv class=\"chiprow\" id=\"recYears\">\u003c/div>\n        \u003cinput class=\"input\" id=\"recSearch\" type=\"search\" autocomplete=\"off\" placeholder=\"名前で探す\" aria-label=\"名前で探す\">\n      \u003c/div>\n      \u003cdiv class=\"box haoh\" id=\"haohBox\" hidden>\u003c/div>\n      \u003cdiv class=\"reclist\" id=\"recList\">\u003cdiv class=\"box plain empty\">\u003cb>記録を読み込んでいます\u003c/b>\u003c/div>\u003c/div>\n      \u003cp class=\"muted\">記録は、運営がその月の大会を「リセット」したときに、その日の順位と一緒に残ります。\u003c/p>\n    \u003c/details>\u003c/section>\n  \u003c/main>\n  \u003cp class=\"mk-ver\" style=\"margin:28px 16px 20px;text-align:center;font-size:13px;line-height:1.6;color:var(--muted,#777)\">版 2026.11.22-2\u003c/p>\n\u003c/div>\n\n\u003cdiv class=\"ov\" id=\"ov\" hidden>\u003cdiv class=\"sheet\" id=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sheetTitle\">\u003c/div>\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" hidden>\u003c/div>\n\n\u003cscript>\n/* 版番号：コードを直したら3ファイル（Code.gs・Index・Admin）とも同じ日付に変える。運営画面の下に出る */\nfunction mk_suggestTeams(n) {\n  /* 休みが出ないよう偶数チーム。1チーム3人に近くなる数を選ぶ */\n  if (n \u003c 4) return 2;\n  var best = 2, bestD = Infinity;\n  for (var t = 2; t \u003c= n / 2; t += 2) {\n    var d = Math.abs(n / t - 3);\n    if (d \u003c bestD - 1e-9) { best = t; bestD = d; }\n  }\n  return best;\n}\n\n/* チーム抽選：経験豊富者 → 各チームへ1人ずつ、残り → 人数の少ないチームへ。固定ペアはまとめて1つの単位として扱う。\n   早めに帰る人がいるときは、その人が抜けても2人以上残るチーム（または全員が早帰りで丸ごと解散できるチーム）になるよう入れ替える */\nfunction mk_num(v) { return v === '' || v === null || v === undefined ? null : Number(v); }\nfunction mk_total(m, side) {\n  var first = mk_num(m[side + '1']), second = mk_num(m[side + '2']);\n  if (first !== null && second !== null) return first + second;\n  return mk_num(m[side === 'a' ? 'totalA' : 'totalB']);\n}\nfunction mk_hasResult(m) {\n  return ['a','b'].every(function (side) {\n    var total = mk_total(m, side);\n    return total !== null && Number.isInteger(total) && total >= 0 && total \u003c= 100;\n  });\n}\nfunction mk_normDate(s) {\n  var m = /^\\s*(\\d{4})[-\\/.年](\\d{1,2})[-\\/.月](\\d{1,2})日?\\s*$/.exec(String(s || ''));\n  if (!m) return '';\n  var p = function (n) { return (Number(n) \u003c 10 ? '0' : '') + Number(n); };\n  return m[1] + '-' + p(m[2]) + '-' + p(m[3]);\n}\nfunction mk_teamLabel(no) {\n  var label = '';\n  for (var n = Math.floor(Number(no)); Number.isFinite(n) && n > 0; n = Math.floor((n - 1) / 26)) {\n    label = String.fromCharCode(65 + (n - 1) % 26) + label;\n  }\n  return label;\n}\nvar MK_SEASON_START = '2025-11-22';\nfunction mk_haohStatus(rows, haoh, roster) {\n  var last = (haoh || []).reduce(function (a, h) { return !a || h.date > a.date ? h : a; }, null);\n  var cutoff = last ? last.date : '';\n  var nm = {};\n  (roster || []).forEach(function (r) { nm[r.id] = r.name; });\n  var by = {};\n  (rows || []).forEach(function (r) {\n    if (Number(r.rank) !== 1 || !r.date || (mk_normDate(r.date) \u003c MK_SEASON_START || (mk_normDate(cutoff) > MK_SEASON_START && mk_normDate(r.date) \u003c= mk_normDate(cutoff)))) return;\n    var key = r.mid || ('n:' + r.name);\n    var e = by[key] || (by[key] = { key: key, name: nm[r.mid] || r.name, wins: 0, dates: {}, last: '' });\n    if (e.dates[r.date]) return;\n    e.dates[r.date] = 1; e.wins++;\n    if (r.date > e.last) e.last = r.date;\n  });\n  var list = Object.keys(by).map(function (k) { var e = by[k]; delete e.dates; return e; })\n    .sort(function (a, b) { return b.wins - a.wins || (a.last \u003c b.last ? -1 : a.last > b.last ? 1 : 0); });\n  return { last: last, cutoff: cutoff, nextNo: (haoh || []).reduce(function (mx, h) { return Math.max(mx, h.no || 0); }, 0) + 1, eligible: list };\n}\n\n/* mk: true は「ルールで受け付けなかった」印。これがないエラー（混雑・シートの一時的な失敗）は、画面側で送り直してよい */\n\u003c/script>\n\u003cscript>\n(function () {\n  'use strict';\n  var $ = function (id) { return document.getElementById(id); };\n  var esc = function (s) { return String(s === undefined || s === null ? '' : s).replace(/[&\u003c>\"']/g, function (c) { return { '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]; }); };\n  var store = {\n    get: function (k, d) { try { var v = localStorage.getItem('mk_' + k); return v === null ? d : v; } catch (e) { return d; } },\n    set: function (k, v) { try { localStorage.setItem('mk_' + k, v); } catch (e) {} },\n    sget: function (k) { try { return sessionStorage.getItem('mk_' + k) || ''; } catch (e) { return MEM[k] || ''; } },\n    sset: function (k, v) { MEM[k] = v; try { sessionStorage.setItem('mk_' + k, v); } catch (e) {} }\n  };\n  var MEM = {};\n  var sheetId = new URLSearchParams(location.search).get('sheet') || '';\n\n  var S = null;\n  var ui = { tab: 'rules', myTeam: Number(store.get('myTeam', '0')) || 0, filter: 'all', busy: 0, modal: false };\n\n\n\n  /* ---------- 通信 ---------- */\n  var snapshot = null;\n  function call(action) {\n    if (!snapshot) return Promise.reject(new Error('デモを準備しています'));\n    if (action === 'records') return Promise.resolve({extra:snapshot.records});\n    S = snapshot.state;\n    return Promise.resolve({state:S});\n  }\n  window.addEventListener('message',function(e) {\n    if(e.source !== parent || !e.data || e.data.type !== 'month-demo-state') return;\n    snapshot=e.data; S=snapshot.state; REC=snapshot.records;\n    $('syncStatus').textContent='デモ　'+S.updatedAt+' 更新';\n    renderAll(); if(ui.tab==='rank' && $('recordsPanel').open) renderRecords();\n  });\n  function setBusy(d) { ui.busy = Math.max(0, ui.busy + d); $('loadbar').classList.toggle('on', ui.busy > 0); }\n\n  var toastT;\n  function toast(msg, bad) {\n    var t = $('toast'); t.textContent = msg; t.classList.toggle('bad', !!bad); t.hidden = false;\n    clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, bad ? 4200 : 2400);\n  }\n  function fail(e) {\n    toast(e && e.message ? e.message : 'うまくいきませんでした', true);\n  }\n\n  /* ---------- 共通 ---------- */\n  var WD = ['日', '月', '火', '水', '木', '金', '土'];\n  function fmtDate(s) {\n    var m = /^(\\d{4})-(\\d{1,2})-(\\d{1,2})/.exec(String(s || ''));\n    if (!m) return String(s || '');\n    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));\n    var y = Number(m[1]) !== new Date().getFullYear() ? m[1] + '年' : '';\n    return y + Number(m[2]) + '月' + Number(m[3]) + '日(' + WD[d.getDay()] + ')';\n  }\n  function teamName(no) { if (!S) return mk_teamLabel(no); var t = S.teams.filter(function (x) { return x.no === no; })[0]; return t ? t.name : mk_teamLabel(no) + '（解散）'; }\n  function members(no) { return S.players.filter(function (p) { return p.team === no; }); }\n  function tot(m, side) { return mk_total(m, side); }\n  function sizeText(n, t) {\n    if (!t || n \u003c t) return '';\n    var base = Math.floor(n / t), extra = n % t, parts = [];\n    if (extra) parts.push((base + 1) + '人 × ' + extra + 'チーム');\n    if (t - extra) parts.push(base + '人 × ' + (t - extra) + 'チーム');\n    return parts.join('、');\n  }\n\n  /* ---------- 大会情報 ---------- */\n  function renderInfo() {\n    var s = S.settings;\n    var name = s['大会名'] || '月いちモルック';\n    var m = /^(.*?)(モルック)$/.exec(name);\n    $('title').textContent = name + ' 速報';\n    $('when').textContent = s['開催日'] ? fmtDate(s['開催日']) + ' ' + (s['時間'] || '') : '次回の開催日は準備中';\n    $('where').innerHTML = esc(s['場所'] || '') + (s['住所'] ? '\u003csmall>' + esc(s['住所']) + '\u003c/small>' : '');\n    $('fee').textContent = s['参加費'] || '';\n    $('fee2').textContent = s['参加費'] || '';\n    $('notice').textContent = s['お知らせ'] || '';\n    $('notice').hidden = !s['お知らせ'];\n    $('insta').textContent = '@' + (s['インスタ'] || 'izumi_molkky');\n    document.title = name;\n  }\n\n\n  /* ---------- ルールの体験 ---------- */\n  $('calcN').addEventListener('input', calcTeams);\n  function calcTeams() {\n    var n = Number($('calcN').value), t = mk_suggestTeams(n);\n    $('calcOut').textContent = n + '人なら ' + t + 'チーム（' + sizeText(n, t) + '）';\n  }\n  calcTeams();\n\n  var LAYOUT = [[7, 9, 8], [5, 11, 12, 6], [3, 10, 4], [1, 2]];\n  var sim = { tot: 0, miss: 0, down: {} };\n  $('pins').innerHTML = LAYOUT.map(function (row) {\n    return '\u003cdiv class=\"row\">' + row.map(function (n) { return '\u003cbutton class=\"pin\" data-pin=\"' + n + '\" aria-pressed=\"false\" aria-label=\"' + n + 'のピン\">' + n + '\u003c/button>'; }).join('') + '\u003c/div>';\n  }).join('');\n  function simNow() { var ks = Object.keys(sim.down); return ks.length === 1 ? Number(ks[0]) : ks.length; }\n  $('pins').querySelectorAll('[data-pin]').forEach(function (b) {\n    b.onclick = function () {\n      var n = b.dataset.pin;\n      if (sim.down[n]) delete sim.down[n]; else sim.down[n] = 1;\n      b.setAttribute('aria-pressed', sim.down[n] ? 'true' : 'false');\n      var k = Object.keys(sim.down).length;\n      $('simNow').textContent = simNow();\n      $('simMsg').textContent = k === 0 ? '倒したいピンをタップして「投げる」' : k === 1 ? '1本だけ → ピンの数字 ' + n + ' 点' : k + '本倒れた → 本数の ' + k + ' 点';\n    };\n  });\n  $('simThrow').onclick = function () {\n    if (sim.tot === 50) { $('simMsg').textContent = '上がりです！もう一度は「最初から」を押してください'; return; }\n    var pts = simNow();\n    if (!pts) {\n      sim.miss++;\n      $('simMsg').textContent = sim.miss >= 3 ? '3回連続でミス…そのセットは0点です' : '0点（ミス ' + sim.miss + '回目）';\n      if (sim.miss >= 3) { sim.miss = 0; sim.tot = 0; }\n    } else {\n      sim.miss = 0;\n      var t = sim.tot + pts;\n      if (t === 50) { $('simMsg').textContent = 'ぴったり50点！上がりです'; sim.tot = 50; }\n      else if (t > 50) { $('simMsg').textContent = t + '点で50点オーバー → 25点に戻ります'; sim.tot = 25; }\n      else { $('simMsg').textContent = '+' + pts + '点。あと' + (50 - t) + '点'; sim.tot = t; }\n    }\n    $('simTot').textContent = sim.tot;\n    sim.down = {}; $('simNow').textContent = 0;\n    $('pins').querySelectorAll('[data-pin]').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });\n  };\n  $('simReset').onclick = function () { sim = { tot: 0, miss: 0, down: {} }; $('simTot').textContent = 0; $('simNow').textContent = 0; $('simMsg').textContent = '倒したいピンをタップして「投げる」'; $('pins').querySelectorAll('[data-pin]').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); }); };\n\n  /* ---------- 記録・名簿 ---------- */\n  var REC = null, recYear = store.get('recPeriod2', 'season'), recLoading = false;\n  function loadRecords() {\n    if (recLoading) return;\n    recLoading = true;\n    call('records').then(function (r) { recLoading = false; REC = r.extra; renderRecords(); })\n      .catch(function () { recLoading = false; if (!REC) $('recList').innerHTML = '\u003cdiv class=\"box plain empty\">\u003cb>記録を読み込めませんでした\u003c/b>電波の良い場所で、もう一度「記録」を開いてください。\u003c/div>'; });\n  }\n  function memberStats(rows) {\n    var by = {};\n    rows.forEach(function (r) {\n      var key = r.mid || ('n:' + r.name);\n      var m = by[key] || (by[key] = { key: key, name: r.name, dates: {}, wins: 0, pod: 0, best: 0, list: [] });\n      if (m.dates[r.date]) return;\n      m.dates[r.date] = 1;\n      m.name = r.name;\n      if (r.rank === 1) m.wins++;\n      if (r.rank && r.rank \u003c= 3) m.pod++;\n      if (r.rank && (!m.best || r.rank \u003c m.best)) m.best = r.rank;\n      m.list.push(r);\n    });\n    var rn = {};\n    (REC && REC.roster || []).forEach(function (x) { rn[x.id] = x.name; });\n    return Object.keys(by).map(function (k) {\n      var m = by[k];\n      if (rn[k]) m.name = rn[k];\n      m.count = Object.keys(m.dates).length;\n      m.list.sort(function (a, b) { return a.date \u003c b.date ? 1 : -1; });\n      m.last = m.list[0] ? m.list[0].date : '';\n      return m;\n    });\n  }\n  function renderRecords() {\n    if (!REC) { if (ui.tab === 'rank' && $('recordsPanel').open) loadRecords(); return; }\n    renderHaoh();\n    var kingMap = haohKings();\n    var all = REC.rows || [];\n    var years = {};\n    all.forEach(function (r) { var y = String(r.date).slice(0, 4); if (/^\\d{4}$/.test(y)) years[y] = 1; });\n    var ys = Object.keys(years).sort().reverse();\n    if (recYear && recYear !== 'season' && !years[recYear]) recYear = 'season';\n    $('recYears').innerHTML = ['\u003cbutton class=\"chip\" data-y=\"season\" aria-pressed=\"' + (recYear === 'season') + '\">今シーズン（2025/11/22〜）\u003c/button>', '\u003cbutton class=\"chip\" data-y=\"\" aria-pressed=\"' + (recYear ? 'false' : 'true') + '\">通算\u003c/button>'].concat(ys.map(function (y) {\n      return '\u003cbutton class=\"chip\" data-y=\"' + y + '\" aria-pressed=\"' + (recYear === y ? 'true' : 'false') + '\">' + y + '年\u003c/button>';\n    })).join('');\n    $('recYears').querySelectorAll('[data-y]').forEach(function (b) { b.onclick = function () { recYear = b.dataset.y; store.set('recPeriod2', recYear); renderRecords(); }; });\n    var rows = recYear === 'season' ? all.filter(function (r) {return mk_normDate(r.date) >= MK_SEASON_START;}) : recYear ? all.filter(function (r) { return String(r.date).slice(0, 4) === recYear; }) : all;\n    var stats = memberStats(rows).sort(function (a, b) { return b.count - a.count || b.wins - a.wins || b.pod - a.pod || (a.name \u003c b.name ? -1 : 1); });\n    var dates = {}; rows.forEach(function (r) { dates[r.date] = 1; });\n    $('recSum').innerHTML = '\u003cspan>開催 \u003cb class=\"num\">' + Object.keys(dates).length + '\u003c/b> 回\u003c/span>\u003cspan>参加した人 \u003cb class=\"num\">' + stats.length + '\u003c/b> 人\u003c/span>\u003cspan>のべ \u003cb class=\"num\">' + stats.reduce(function (a, m) { return a + m.count; }, 0) + '\u003c/b> 人\u003c/span>';\n    var q = $('recSearch').value.trim();\n    var shown = q ? stats.filter(function (m) { return m.name.indexOf(q) >= 0; }) : stats;\n    if (!stats.length) {\n      $('recList').innerHTML = '\u003cdiv class=\"box plain empty\">\u003cb>まだ記録がありません\u003c/b>大会のあとに運営が「リセット」すると、その日の参加と順位がここに残ります。\u003c/div>';\n      return;\n    }\n    $('recList').innerHTML = shown.length ? shown.map(function (m) {\n      var kc = kingMap[m.key] || 0;\n      return '\u003cdetails class=\"rec\">\u003csummary>\u003cspan class=\"nm\">' + esc(m.name) + (kc ? ' \u003cspan class=\"crown\">覇王' + (kc > 1 ? '×' + kc : '') + '\u003c/span>' : '') + '\u003c/span>\u003cspan class=\"stats\">' +\n        '\u003cspan class=\"stat num\">参加' + m.count + '回\u003c/span>' +\n        (m.wins ? '\u003cspan class=\"stat win num\">覇者' + m.wins + '回\u003c/span>' : '') +\n        (m.pod ? '\u003cspan class=\"stat pod num\">3位以内' + m.pod + '\u003c/span>' : '') +\n        '\u003c/span>\u003c/summary>\u003cdiv class=\"rechist\">\u003ctable>\u003cthead>\u003ctr>\u003cth>開催日\u003c/th>\u003cth>チーム\u003c/th>\u003cth>順位\u003c/th>\u003cth>合計点\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>' +\n        m.list.map(function (r) {\n          return '\u003ctr>\u003ctd>' + esc(fmtDate(r.date)) + '\u003c/td>\u003ctd>' + esc(r.team) + '\u003c/td>\u003ctd class=\"num' + (r.rank === 1 ? ' r1' : '') + '\">' + r.rank + '位' + (r.teams ? ' / ' + r.teams : '') + '\u003c/td>\u003ctd class=\"num\">' + r.total + '点\u003c/td>\u003c/tr>';\n        }).join('') + '\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>';\n    }).join('') : '\u003cdiv class=\"box plain empty\">\u003cb>「' + esc(q) + '」に当てはまる人はいません\u003c/b>\u003c/div>';\n  }\n  $('recSearch').addEventListener('input', renderRecords);\n\n  function haohKings() {\n    var k = {};\n    (REC && REC.haoh || []).forEach(function (h) { k[h.mid || ('n:' + h.name)] = (k[h.mid || ('n:' + h.name)] || 0) + 1; });\n    return k;\n  }\n  function renderHaoh() {\n    if (!REC) return;\n    var hs = mk_haohStatus(REC.rows || [], REC.haoh || [], REC.roster || []);\n    var kings = (REC.haoh || []).slice().sort(function (a, b) { return b.no - a.no; });\n    var box = $('haohBox');\n    box.hidden = !kings.length && !hs.eligible.length;\n    box.innerHTML = '\u003ch2 class=\"h\" style=\"margin:0\">覇王戦\u003c/h2>' +\n      (kings.length ? '\u003cul class=\"kings\">' + kings.map(function (h) {\n        return '\u003cli>\u003cspan class=\"no\">第' + h.no + '回\u003c/span>\u003cspan class=\"kn\">' + esc(h.name) + '\u003c/span>\u003cspan class=\"crown\">覇王\u003c/span>\u003cspan class=\"muted\">' + esc(fmtDate(h.date)) + '\u003c/span>\u003c/li>';\n      }).join('') + '\u003c/ul>' : '') +\n      '\u003cdiv>\u003cb>次の覇王戦に出られる覇者\u003c/b> \u003cspan class=\"muted num\">' + hs.eligible.length + '人\u003c/span>' + (hs.cutoff ? ' \u003cspan class=\"muted\" style=\"white-space:nowrap\">（' + esc(fmtDate(hs.cutoff)) + (mk_normDate(hs.cutoff) \u003c= MK_SEASON_START ? '以降' : 'より後') + '）\u003c/span>' : '') + '\u003c/div>' +\n      (hs.eligible.length ? '\u003cdiv class=\"elig\">' + hs.eligible.map(function (e) { return '\u003cspan>' + esc(e.name) + (e.wins > 1 ? '\u003csmall class=\"num\">×' + e.wins + '\u003c/small>' : '') + '\u003c/span>'; }).join('') + '\u003c/div>'\n        : '\u003cp class=\"muted\" style=\"margin:0\">まだいません。次の大会で優勝すると、ここに名前が入ります。\u003c/p>');\n  }\n\n\n  /* ---------- 全体 ---------- */\n  var selectedRound = '', selectedCourt = 0, choosing = false;\n  var favourites = [];\n  try { favourites = JSON.parse(store.get('courtFavs','[]')); } catch (_) {}\n  if (!Array.isArray(favourites)) favourites = [];\n  function roundKey(m) { return m.cycle + '-' + m.round; }\n  function roundTitle(m) { return (m.cycle > 1 ? m.cycle + '巡目・' : '') + '第' + m.round + 'ラウンド'; }\n  function sortedMatches() {\n    return S.matches.slice().sort(function(a,b) { return a.cycle-b.cycle || a.round-b.round || a.wave-b.wave || a.court-b.court; });\n  }\n  function teamLabel(no) {\n    var names = members(no).map(function(p) { return p.name; });\n    return '\u003cspan class=\"teamlabel\">\u003cb>'+esc(teamName(no))+'\u003c/b>\u003csmall class=\"memberline\">'+esc(names.join('・'))+'\u003c/small>\u003c/span>';\n  }\n  function badge(m,big) {\n    return '\u003cspan class=\"cn'+(big?' big':'')+'\" aria-label=\"'+esc(m.court)+'コート\">'+esc(m.court)+'\u003c/span>';\n  }\n  function sideScore(m,team) { return tot(m, m.a === team ? 'a' : 'b'); }\n  function teamMatches(no) { return sortedMatches().filter(function(m){return m.a===no || m.b===no;}); }\n  function opponent(m,no) {return m.a===no ? m.b : m.a;}\n  function wave(m) {return m.wave>1 ? '・'+m.wave+'組目' : '';}\n  function teamPicker() {\n    var query = $('teamQuery').value.trim().normalize('NFKC').toLowerCase();\n    var teams = S.teams.filter(function(t){return [t.name].concat(members(t.no).map(function(p){return p.name;})).join(' ').normalize('NFKC').toLowerCase().includes(query);});\n    $('teamPickList').innerHTML = teams.length ? teams.map(function(t){return '\u003cli>\u003cbutton data-pick=\"'+t.no+'\">'+teamLabel(t.no)+'\u003cspan>選ぶ ›\u003c/span>\u003c/button>\u003c/li>';}).join('') :\n      '\u003cli class=\"note\">'+(S.teams.length?'該当するチームがありません。':'抽選後にチームが表示されます。')+'\u003c/li>';\n  }\nfunction mk_boardOrder(group, teamNos, courts) {\n  if (courts \u003c 4 || teamNos.length !== 8 || group.length !== 4) return null;\n  var round = Number(group[0].round);\n  if (round \u003c 1 || round > 7 || !Number.isInteger(round)) return null;\n  var ring = teamNos.slice().sort(function (a,b) { return a-b; });\n  for (var r = 1; r \u003c round; r++) ring.splice(1, 0, ring.pop());\n  var ordered = [];\n  for (var c = 0; c \u003c 4; c++) {\n    var a = ring[c], b = ring[7-c];\n    var match = group.find(function (m) { return (m.a === a && m.b === b) || (m.a === b && m.b === a); });\n    if (!match) return null;\n    ordered.push(match);\n  }\n  return ordered;\n}\n\n\n  function alignVenue(state) {\n    if(!state || Number(state.courts)\u003c4 || !Array.isArray(state.matches))return;\n    var groups = new Map(), cycles = new Map();\n    state.matches.forEach(function(m){\n      if(!cycles.has(m.cycle))cycles.set(m.cycle,new Set());\n      cycles.get(m.cycle).add(m.a).add(m.b);\n      var k=roundKey(m); if(!groups.has(k))groups.set(k,[]); groups.get(k).push(m);\n    });\n    groups.forEach(function(group){\n      var ordered=mk_boardOrder(group,Array.from(cycles.get(group[0].cycle)),Number(state.courts));\n      if(ordered)ordered.forEach(function(m,i){m.court=i+1;m.wave=1;});\n    });\n  }\n\n  function renderMine() {\n    var no = ui.myTeam;\n    $('pickBox').hidden = !!no && !choosing;\n    if (!$('pickBox').hidden) teamPicker();\n    if (!no) { $('mineBody').innerHTML=''; return; }\n    var list=teamMatches(no), next=list.find(function(m){return !mk_hasResult(m);});\n    var h='\u003cdiv class=\"myhead\">\u003cdiv class=\"nm\">'+teamLabel(no)+'\u003c/div>\u003cbutton class=\"btn\" data-change>変更\u003c/button>\u003c/div>';\n    if(next) h+='\u003cdiv class=\"next\">\u003cdiv class=\"lbl\">次の試合\u003c/div>\u003cdiv class=\"row\">'+badge(next,true)+'\u003cdiv>\u003cdiv class=\"when\">'+next.court+'コート\u003c/div>\u003cdiv class=\"what\">'+roundTitle(next)+wave(next)+'\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"vs\">対戦相手　'+teamLabel(opponent(next,no))+'\u003c/div>\u003c/div>';\n    else h+='\u003cp class=\"next\">'+(list.length?'このチームの試合はすべて終了しました。':'対戦表を準備しています。')+'\u003c/p>';\n    if(list.length) h+='\u003ch2>自分の試合予定・結果\u003c/h2>\u003cul class=\"plan\">'+list.map(function(m){\n      return '\u003cli'+(m===next?' class=\"cur\"':'')+'>'+badge(m,false)+'\u003cdiv>\u003cdiv class=\"t\">'+roundTitle(m)+wave(m)+'\u003c/div>\u003cdiv class=\"o\">'+teamLabel(opponent(m,no))+'\u003c/div>\u003cdiv class=\"s\">'+(mk_hasResult(m)?'自分 '+sideScore(m,no)+'点 ／ 相手 '+sideScore(m,opponent(m,no))+'点':'結果待ち')+'\u003c/div>\u003c/div>\u003c/li>';\n    }).join('')+'\u003c/ul>';\n    var peers=S.teams.filter(function(t){return t.no!==no;});\n    if(peers.length) h+='\u003ch2>仲間のチーム\u003c/h2>\u003cul class=\"favs\">'+peers.filter(function(t){return favourites.includes(t.no);}).map(function(t){\n      var q=teamMatches(t.no).find(function(m){return !mk_hasResult(m);});return '\u003cli>'+(q?badge(q,false):'')+'\u003cdiv>'+teamLabel(t.no)+'\u003cdiv class=\"note\">'+(q?roundTitle(q)+'・相手 '+esc(teamName(opponent(q,t.no))):'次の試合はありません')+'\u003c/div>\u003c/div>\u003cbutton class=\"fx\" data-fav=\"'+t.no+'\">外す\u003c/button>\u003c/li>';\n    }).join('')+'\u003c/ul>\u003cdetails>\u003csummary>仲間のチームを選ぶ\u003c/summary>\u003cul class=\"pick\">'+peers.map(function(t){return '\u003cli>\u003cbutton data-fav=\"'+t.no+'\">'+teamLabel(t.no)+'\u003cspan>'+(favourites.includes(t.no)?'登録済み':'追加')+'\u003c/span>\u003c/button>\u003c/li>';}).join('')+'\u003c/ul>\u003c/details>';\n    $('mineBody').innerHTML=h;\n  }\n  function renderGames() {\n    var list=sortedMatches(), groups=new Map();\n    list.forEach(function(m){var k=roundKey(m);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(m);});\n    if(!list.length){$('gamesBody').innerHTML='\u003cp class=\"empty\">抽選後に対戦表が表示されます。\u003c/p>';return;}\n    var first=list.find(function(m){return !mk_hasResult(m);}) || list[list.length-1];\n    var active=groups.has(selectedRound)?selectedRound:roundKey(first);\n    var draw=groups.get(active);\n    var h='\u003ch2>試合・コート\u003c/h2>\u003cdiv class=\"chips\" aria-label=\"ラウンドを選ぶ\">'+Array.from(groups.entries()).map(function(g){\n      return '\u003cbutton class=\"chip'+(g[0]===active?' on':'')+'\" aria-pressed=\"'+(g[0]===active)+'\" data-round=\"'+g[0]+'\">'+(g[1][0].cycle>1?g[1][0].cycle+'巡・':'')+'第'+g[1][0].round+'R\u003c/button>';\n    }).join('')+'\u003c/div>\u003clabel class=\"courtFilter\">コート \u003cselect id=\"courtSelect\">\u003coption value=\"0\">すべて\u003c/option>';\n    var ns=Array.from(new Set(list.map(function(m){return m.court;}))).sort(function(a,b){return a-b;});\n    if(!ns.includes(selectedCourt))selectedCourt=0;\n    ns.forEach(function(c){h+='\u003coption value=\"'+c+'\"'+(c===selectedCourt?' selected':'')+'>'+c+'コート\u003c/option>';});\n    h+='\u003c/select>\u003c/label>\u003cdiv class=\"rhead\">\u003cb class=\"t\">'+roundTitle(draw[0])+'\u003c/b>　'+draw.filter(mk_hasResult).length+' / '+draw.length+'試合終了\u003c/div>';\n    var shown=draw.filter(function(m){return !selectedCourt || m.court===selectedCourt;});\n    h+=shown.length?'\u003cul class=\"mlist\">'+shown.map(function(m){\n      return '\u003cli'+(ui.myTeam && [m.a,m.b].includes(ui.myTeam)?' class=\"mine\"':'')+'>'+badge(m,false)+'\u003cdiv class=\"teams\">'+[m.a,m.b].map(function(t){return '\u003cdiv class=\"tm\">'+teamLabel(t)+'\u003cspan class=\"sc\">'+(mk_hasResult(m)?sideScore(m,t)+'点':'―')+'\u003c/span>\u003c/div>';}).join('')+'\u003csmall>'+(mk_hasResult(m)?'結果確定':'結果待ち')+wave(m)+'\u003c/small>\u003c/div>\u003c/li>';\n    }).join('')+'\u003c/ul>':'\u003cp class=\"empty\">このラウンドの試合はありません。\u003c/p>';\n    $('gamesBody').innerHTML=h;\n  }\n  function renderStandings() {\n    $('rankBody').innerHTML=S.standings.length?'\u003ctable>\u003cthead>\u003ctr>\u003cth>順位\u003c/th>\u003cth>チーム・メンバー\u003c/th>\u003cth>試合\u003c/th>\u003cth>合計点\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+S.standings.map(function(row){return '\u003ctr'+(row.no===ui.myTeam?' class=\"mine\"':'')+'>\u003ctd>'+row.rank+'\u003c/td>\u003ctd>'+teamLabel(row.no)+'\u003c/td>\u003ctd>'+row.played+'\u003c/td>\u003ctd>\u003cstrong>'+row.total+'\u003c/strong>\u003csmall class=\"memberline\">平均 '+row.avg+'\u003c/small>\u003c/td>\u003c/tr>';}).join('')+'\u003c/tbody>\u003c/table>':'\u003cp>抽選後に順位が表示されます。\u003c/p>';\n    if (!S.teams.length && S.previousResult) {\n      var prev = S.previousResult;\n      $('rankBody').innerHTML = '\u003ch3>前回の大会結果　'+esc(fmtDate(prev.date))+'\u003c/h3>\u003ctable>\u003cthead>\u003ctr>\u003cth>順位\u003c/th>\u003cth>チーム・メンバー\u003c/th>\u003cth>試合\u003c/th>\u003cth>合計点\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+prev.standings.map(function(r){\n        return '\u003ctr>\u003ctd>'+esc(r.rank)+'\u003c/td>\u003ctd>'+esc(r.name)+'\u003csmall class=\"memberline\">'+esc(r.members)+'\u003c/small>\u003c/td>\u003ctd>'+esc(r.played)+'\u003c/td>\u003ctd>'+esc(r.total)+'\u003c/td>\u003c/tr>';\n      }).join('')+'\u003c/tbody>\u003c/table>';\n    } else if (resultAvailable()) {\n      $('rankBody').insertAdjacentHTML('afterbegin','\u003ch3>大会結果　'+esc(fmtDate(S.settings['開催日']))+'\u003c/h3>');\n    }\n    $('champBox').innerHTML=(S.champions||[]).length?'\u003ch3>これまでの優勝チーム\u003c/h3>\u003cul class=\"plan\">'+S.champions.map(function(c){return '\u003cli>'+esc(fmtDate(c.date))+'　'+esc(c.members || c.name)+'　'+Number(c.total)+'点\u003c/li>';}).join('')+'\u003c/ul>':'';\n  }\n  function resultAvailable() {\n    return S && ((!S.teams.length && S.previousResult) || (S.matches.length && S.matches.every(mk_hasResult)));\n  }\n  function showTab(name) {\n    if(name==='rec'){name='rank';$('recordsPanel').open=true;}\n    if(!['team','match','rank','rules'].includes(name))name='team';\n    ui.tab=name;\n    document.querySelectorAll('#tabs [data-tab]').forEach(function(b){\n      b.setAttribute('aria-selected',String(b.dataset.tab===name));\n      $('p-'+b.dataset.tab).hidden=b.dataset.tab!==name;\n    });\n    if(name==='rank' && $('recordsPanel').open) loadRecords();\n  }\n  $('teamQuery').oninput=function(){ if(S)teamPicker(); };\n  $('recordsPanel').ontoggle=function(){if(this.open)loadRecords();};\n  document.addEventListener('click',function(e){\n    var b=e.target.closest('button'); if(!b)return;\n    if(b.dataset.tab || b.dataset.go){showTab(b.dataset.tab||b.dataset.go);window.scrollTo(0,0);return;}\n    if(!S)return;\n    if(b.hasAttribute('data-change')){choosing=true;renderMine();$('teamQuery').focus();}\n    if(b.dataset.pick){ui.myTeam=Number(b.dataset.pick);store.set('myTeam',String(ui.myTeam));choosing=false;$('teamQuery').value='';renderAll();}\n    if(b.dataset.round){selectedRound=b.dataset.round;renderGames();}\n    if(b.dataset.fav){var n=Number(b.dataset.fav);favourites=favourites.includes(n)?favourites.filter(function(x){return x!==n;}):favourites.concat(n);store.set('courtFavs',JSON.stringify(favourites));renderMine();}\n  });\n  document.addEventListener('change',function(e){if(e.target.id==='courtSelect'){selectedCourt=Number(e.target.value);renderGames();}});\n  function paintDisplayButtons(){\n    var root=document.documentElement, mode=root.getAttribute('data-theme');\n    var dark=mode ? mode==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;\n    $('themeSwitch').textContent=dark?'明るくする':'暗くする';\n    $('fontSwitch').textContent=root.classList.contains('bigtext')?'標準の文字':'大きい文字';\n    $('themeSwitch').onclick=function(){var next=dark?'light':'dark';root.setAttribute('data-theme',next);store.set('scoreTheme',next);paintDisplayButtons();};\n    $('fontSwitch').onclick=function(){root.classList.toggle('bigtext');store.set('scoreBig',root.classList.contains('bigtext')?'1':'0');paintDisplayButtons();};\n  }\n  var savedTheme=store.get('scoreTheme','');\n  if(savedTheme)document.documentElement.setAttribute('data-theme',savedTheme);\n  document.documentElement.classList.toggle('bigtext',store.get('scoreBig','0')==='1');\n  paintDisplayButtons();\n  $('headReload').onclick=function(){parent.postMessage({type:'month-demo-view-ready'},'*');refresh(false);if(ui.tab==='rank' && $('recordsPanel').open)loadRecords();};\n  function renderAll() {\n    if (!S) return;\n    if(ui.myTeam && !S.teams.some(function(t){return t.no===ui.myTeam;})) {ui.myTeam=0;store.set('myTeam','0');}\n    alignVenue(S);\n    renderInfo();renderMine();renderGames();renderStandings();\n    $('progressLine').textContent=S.matches.length ? '試合結果　'+S.matches.filter(mk_hasResult).length+' / '+S.matches.length+'試合' : (S.previousResult ? '前回の大会結果を掲載中' : '対戦表の発表前');\n  }\n\n  function refresh(silent) {\n    return call('state').then(function () { renderAll(silent); return true; }).catch(function (e) { if (!silent) fail(e); return false; });\n  }\n\n\n  function start() {\n    var tabs = ['rules','rank','match','team','rec'];\n    var requested = new URLSearchParams(location.search).get('tab') || location.hash.slice(1);\n    var initial = tabs.indexOf(requested) >= 0 ? requested : 'team';\n    showTab(initial);\n    parent.postMessage({type:'month-demo-view-ready'},'*');\n  }\n  start();\n})();\n\u003c/script>\n\n\u003c/body>\u003c/html>";

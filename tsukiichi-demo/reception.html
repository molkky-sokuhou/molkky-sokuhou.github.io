<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月いちモルック｜受付通信テスト</title><style>

/* Layout: ポスターの砂利コートを地に、赤い極太見出し・水色の白フチ文字・黄色の雲バッジを引き継ぐ1カラムのスマホ向けアプリ */
:root {
  --bg: #ece2cd;
  --grit-a: rgba(110, 92, 62, .22);
  --grit-b: rgba(255, 255, 255, .55);
  --panel: #fffdf6;
  --panel-2: #f6efe0;
  --ink: #1d2230;
  --muted: #5d6170;
  --line: #cfc3a8;
  --frame: #6b6440;
  --red: #e2141c;
  --red-deep: #a90e14;
  --title-shadow: #1c2a4e;
  --cyan: #1687c4;
  --cyan-soft: #def1fa;
  --halo: #ffffff;
  --yellow: #f7c614;
  --yellow-ink: #3b2f00;
  --good: #1d7f48;
  --good-soft: #dff3e6;
  --warn-soft: #fff1c9;
  --danger-soft: #fde3e3;
  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #221f1a; --grit-a: rgba(255, 240, 210, .07); --grit-b: rgba(0, 0, 0, .35);
    --panel: #2d2923; --panel-2: #36312a; --ink: #f4efe4; --muted: #bdb4a4; --line: #4b4439; --frame: #8f8758;
    --red: #ff4a50; --red-deep: #ff7b7f; --title-shadow: #000000; --cyan: #5cc4f2; --cyan-soft: #1c3542; --halo: #10202a;
    --yellow: #f7c614; --yellow-ink: #3b2f00; --good: #5fd18f; --good-soft: #1d3527; --warn-soft: #3c3317; --danger-soft: #45201f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #221f1a; --grit-a: rgba(255, 240, 210, .07); --grit-b: rgba(0, 0, 0, .35);
  --panel: #2d2923; --panel-2: #36312a; --ink: #f4efe4; --muted: #bdb4a4; --line: #4b4439; --frame: #8f8758;
  --red: #ff4a50; --red-deep: #ff7b7f; --title-shadow: #000000; --cyan: #5cc4f2; --cyan-soft: #1c3542; --halo: #10202a;
  --yellow: #f7c614; --yellow-ink: #3b2f00; --good: #5fd18f; --good-soft: #1d3527; --warn-soft: #3c3317; --danger-soft: #45201f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--f-body);
  font-weight: 500;
  font-size: 1rem;
  line-height: 1.7;
  color: var(--ink);
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 20% 30%, var(--grit-a) 0 1.2px, transparent 1.6px),
    radial-gradient(circle at 70% 80%, var(--grit-a) 0 1.6px, transparent 2px),
    radial-gradient(circle at 45% 60%, var(--grit-b) 0 1px, transparent 1.5px),
    radial-gradient(circle at 85% 15%, var(--grit-a) 0 1px, transparent 1.4px);
  background-size: 11px 13px, 17px 19px, 9px 7px, 23px 21px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; }

/* ---------- hero ---------- */
.hero { padding-block: 18px 8px; display: grid; gap: 6px; }
.org { font-weight: 900; font-size: .85rem; letter-spacing: .08em; color: var(--muted); }
.title {
  margin: 0; font-family: var(--f-display); font-weight: 400;
  font-size: clamp(2.6rem, 13vw, 4.4rem); line-height: 1.02; letter-spacing: .01em;
  color: var(--red); text-shadow: 3px 4px 0 var(--title-shadow);
  text-wrap: balance;
}
.title .kaisai { font-size: .42em; color: var(--ink); text-shadow: 2px 2px 0 var(--halo); margin-left: .3em; vertical-align: .15em; }
.hero-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 6px; }
.facts { display: grid; gap: 4px; min-width: 0; }
.when { font-family: var(--f-display); color: var(--red); font-size: clamp(1.3rem, 6vw, 1.75rem); line-height: 1.25; text-shadow: 2px 2px 0 var(--title-shadow); }
.where { font-weight: 900; color: var(--cyan); font-size: 1.02rem; line-height: 1.45;
  text-shadow: -1.5px -1.5px 0 var(--halo), 1.5px -1.5px 0 var(--halo), -1.5px 1.5px 0 var(--halo), 1.5px 1.5px 0 var(--halo); }
.where small { display: block; font-size: .85rem; }
.photo { position: relative; justify-self: center; width: min(100%, 290px); }
@media (min-width: 620px) { .photo { width: min(100%, 360px); } }
.photo img { display: block; width: 100%; height: auto; border-radius: 50% 50% 18px 18px / 30% 30% 18px 18px; }
.cloud {
  position: absolute; right: -6px; bottom: -10px; background: var(--yellow); color: var(--yellow-ink);
  padding: 10px 18px 10px; border-radius: 48% 52% 46% 54% / 60% 55% 45% 40%;
  box-shadow: 0 0 0 3px #fff8d6, 4px 5px 0 rgba(0,0,0,.18); text-align: center; line-height: 1.15;
  font-weight: 900; transform: rotate(-4deg);
}
.cloud b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; }
@media (min-width: 620px) {
  .hero-grid { grid-template-columns: 1.2fr 1fr; align-items: center; }
}
.org-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.to-admin { flex: 0 0 auto; border: 2px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 999px; padding: 4px 12px; font-weight: 900; font-size: .8rem; text-decoration: none; white-space: nowrap; }
.to-admin:hover { border-color: var(--ink); color: var(--ink); }
.demo-bar { margin-top: 10px; background: var(--warn-soft); border: 2px dashed var(--frame); border-radius: 10px; padding: 8px 12px; font-size: .88rem; }

/* ---------- tabs ---------- */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 8px; margin-top: 10px; }
.tabs-in { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.tabs-in::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 2.5px solid var(--ink); background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 6px 16px; font-weight: 900; font-size: .98rem; white-space: nowrap;
}
.tab[aria-selected="true"] { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 2px 3px 0 var(--title-shadow); }
.loadbar { height: 3px; margin-top: 6px; background: linear-gradient(90deg, var(--cyan) 0 40%, transparent 40%); background-size: 200% 100%; opacity: 0; transition: opacity .2s; }
.loadbar.on { opacity: 1; animation: slide 1s linear infinite; }
@keyframes slide { from { background-position: 100% 0; } to { background-position: -100% 0; } }

/* ---------- panels ---------- */
main { padding-block: 6px 60px; }
.panel { display: grid; gap: 16px; }
.box {
  background: var(--panel); border: 3px solid var(--frame); border-radius: var(--r);
  padding: 16px; min-width: 0;
}
.box.plain { border-width: 2px; border-color: var(--line); }
h2.h { margin: 0 0 10px; font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; line-height: 1.3; color: var(--cyan);
  text-shadow: -1.5px -1.5px 0 var(--halo), 1.5px -1.5px 0 var(--halo), -1.5px 1.5px 0 var(--halo), 1.5px 1.5px 0 var(--halo), 2px 3px 0 rgba(0,0,0,.12); text-wrap: balance; }
h3.s { margin: 14px 0 6px; font-size: 1.05rem; font-weight: 900; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); font-size: .9rem; }
.big { font-family: var(--f-display); font-weight: 400; }
.num { font-variant-numeric: tabular-nums; }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 2px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 12px; font-weight: 700; font-size: .9rem; }
.chip[aria-pressed="true"] { border-color: var(--cyan); background: var(--cyan); color: #fff; }
.tag { display: inline-block; white-space: nowrap; font-size: .72rem; font-weight: 900; padding: 1px 7px; border-radius: 6px; background: var(--yellow); color: var(--yellow-ink); vertical-align: .1em; }
.tag.cy { background: var(--cyan-soft); color: var(--cyan); }
.tag.early { background: var(--danger-soft); color: var(--red); }
.tag.pod { background: var(--ink); color: var(--panel); }
.warnline { color: var(--red); font-weight: 900; }
/* ---------- records / roster ---------- */
.haoh { display: grid; gap: 10px; }
.kings { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.kings li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; background: var(--panel-2); border-radius: 10px; padding: 8px 12px; }
.kings .no { font-family: var(--f-display); color: var(--red); }
.kings .kn { font-weight: 900; font-size: 1.05rem; }
.crown { display: inline-block; font-size: .72rem; font-weight: 900; background: var(--title-shadow); color: var(--yellow); border-radius: 6px; padding: 1px 8px; white-space: nowrap; }
.elig { display: flex; flex-wrap: wrap; gap: 6px; }
.elig span { border: 2px solid var(--yellow); background: var(--warn-soft); border-radius: 999px; padding: 3px 12px; font-weight: 700; white-space: nowrap; }
.elig small { color: var(--muted); font-weight: 500; margin-left: 4px; }
.subbox { background: var(--panel-2); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.recsum { display: flex; flex-wrap: wrap; gap: 6px 16px; font-weight: 700; }
.recsum b { font-family: var(--f-display); font-weight: 400; font-size: 1.3rem; color: var(--red); }
.reclist { display: grid; gap: 8px; }
details.rec { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; }
details.rec[open] { border-color: var(--cyan); }
details.rec summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 12px; }
details.rec summary::-webkit-details-marker { display: none; }
details.rec .nm { font-weight: 900; min-width: 0; overflow-wrap: anywhere; }
details.rec .stats { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.stat { font-size: .78rem; font-weight: 900; background: var(--panel-2); border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
.stat.win { background: var(--red); color: #fff; }
.stat.pod { background: var(--yellow); color: var(--yellow-ink); }
.rechist { padding: 0 12px 12px; overflow-x: auto; }
.rechist table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.rechist th, .rechist td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.rechist td.r1 { color: var(--red); font-weight: 900; }
.quick { display: grid; gap: 8px; background: var(--panel-2); border-radius: 12px; padding: 12px; }
.qlist { display: flex; flex-wrap: wrap; gap: 6px; max-height: 260px; overflow-y: auto; padding: 2px; }
.qitem { position: relative; }
.qitem input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.qitem span { display: inline-flex; align-items: center; gap: 4px; border: 2px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.qitem input:checked + span { background: var(--good); border-color: var(--good); color: #fff; }
.qitem input:focus-visible + span { outline: 3px solid var(--cyan); outline-offset: 2px; }
.qitem small { font-weight: 500; opacity: .8; font-size: .75rem; }
.callout { background: var(--yellow); color: var(--yellow-ink); border-radius: var(--r); padding: 12px 16px; font-weight: 900; box-shadow: 3px 4px 0 rgba(0,0,0,.15); }

.btn { border: 2.5px solid var(--ink); background: var(--panel); color: var(--ink); border-radius: 12px; padding: 9px 16px; font-weight: 900; line-height: 1.3; }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 2px 3px 0 var(--title-shadow); }
.btn.cyan { background: var(--cyan); border-color: var(--cyan); color: #fff; }
.btn.small { padding: 4px 10px; font-size: .88rem; border-width: 2px; border-radius: 9px; }
.btn.ghost { border-color: var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.wide { width: 100%; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.field { display: grid; gap: 4px; }
.field label { font-weight: 700; font-size: .9rem; }
.input { width: 100%; border: 2px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 12px; min-width: 0; }
.input:focus { border-color: var(--cyan); outline: none; }
.switch { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .tr { width: 48px; height: 28px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; flex: 0 0 auto; }
.switch .tr::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch input:checked + .tr { background: var(--good); }
.switch input:checked + .tr::after { transform: translateX(20px); }
.switch input:focus-visible + .tr { outline: 3px solid var(--cyan); outline-offset: 2px; }

/* ---------- rules ---------- */
.toc { display: flex; flex-wrap: wrap; gap: 6px; }
.toc a { text-decoration: none; color: var(--ink); border-bottom: 2px solid var(--yellow); font-weight: 700; font-size: .92rem; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: f; }
.flow li { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start; counter-increment: f; }
.flow li::before { content: counter(f); width: 40px; height: 40px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-family: var(--f-display); font-size: 1.2rem; box-shadow: 2px 2px 0 var(--title-shadow); }
.flow b { display: block; font-weight: 900; }
.calc { display: grid; gap: 10px; background: var(--panel-2); border-radius: 12px; padding: 12px; }
.calc input[type=range] { width: 100%; accent-color: var(--red); }
.calc-out { font-weight: 900; font-size: 1.05rem; }
.ex { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; text-align: center; background: var(--panel-2); border-radius: 12px; padding: 12px; }
.ex .vs { font-family: var(--f-display); color: var(--red); }
.ex .tm { font-weight: 900; }
.ex .calcline { font-family: var(--f-display); font-size: 1.15rem; }
.rules { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.rules li { background: var(--panel-2); border-radius: 10px; padding: 8px 12px; }
.sim { display: grid; gap: 10px; justify-items: center; background: var(--panel-2); border-radius: 12px; padding: 14px 10px; }
.pins { display: grid; gap: 6px; justify-items: center; }
.pins .row { display: flex; gap: 6px; }
.pin { width: 46px; height: 46px; border-radius: 50%; border: 2px solid #b8925a; background: radial-gradient(circle at 40% 35%, #f6e2bd, #ddb77c); color: #5a2e0e; font-family: var(--f-display); font-size: 1.05rem; display: grid; place-items: center; transition: transform .12s, opacity .12s; }
.pin[aria-pressed="true"] { transform: rotate(-70deg) scale(.86); opacity: .55; border-color: var(--red); }
.sim-score { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; justify-content: center; }
.sim-score .big { font-size: 2rem; color: var(--red); }
.sim-msg { min-height: 1.6em; font-weight: 700; text-align: center; }
details.faq { border-bottom: 2px dashed var(--line); padding-block: 8px; }
details.faq summary { font-weight: 900; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
details.faq summary::after { content: "＋"; color: var(--red); }
details.faq[open] summary::after { content: "－"; }
details.faq p { margin-top: 6px; }

/* ---------- standings ---------- */
.prog { display: grid; gap: 6px; }
.prog .bar { height: 12px; border-radius: 99px; background: var(--panel-2); border: 2px solid var(--line); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--good); width: 0; transition: width .4s; }
.stand { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.st { display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.st.mine { border-color: var(--cyan); box-shadow: 0 0 0 2px var(--cyan) inset; }
.st .rk { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-size: 1.15rem; background: var(--panel-2); color: var(--ink); }
.st.r1 .rk { background: var(--red); color: #fff; box-shadow: 2px 2px 0 var(--title-shadow); }
.st.r2 .rk { background: var(--cyan); color: #fff; }
.st.r3 .rk { background: var(--yellow); color: var(--yellow-ink); }
.st .nm { font-weight: 900; min-width: 0; }
.st .mem { font-size: .82rem; color: var(--muted); font-weight: 500; overflow-wrap: anywhere; }
.st .pts { text-align: right; line-height: 1.15; }
.st .pts .big { font-size: 1.6rem; color: var(--red); }
.st .pts small { display: block; font-size: .75rem; color: var(--muted); }
.empty { text-align: center; padding: 22px 12px; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 4px; }

/* ---------- matches ---------- */
.round { display: grid; gap: 8px; }
.round-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.round-h h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 1.1rem; }
.bye { font-size: .85rem; color: var(--muted); }
.mt { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; width: 100%; }
.mt.done { border-color: var(--good); }
.mt.mine { box-shadow: 0 0 0 2px var(--cyan) inset; border-color: var(--cyan); }
.mt .t { font-weight: 900; min-width: 0; overflow-wrap: anywhere; line-height: 1.3; }
.mt .t small { display: block; font-weight: 700; color: var(--muted); font-size: .78rem; }
.mt .t .tot { font-family: var(--f-display); font-size: 1.5rem; color: var(--ink); display: block; }
.mt .t.win .tot { color: var(--red); }
.mt .mid { display: grid; gap: 4px; justify-items: center; }
.mt .mid .vs { font-family: var(--f-display); color: var(--red); }
.court { font-family: var(--f-display); font-size: .82rem; line-height: 1.2; background: var(--ink); color: var(--panel); border-radius: 8px; padding: 3px 8px; white-space: nowrap; }
.court small { display: block; font-family: var(--f-body); font-weight: 900; font-size: .66rem; }
.state { font-size: .72rem; font-weight: 900; padding: 1px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.done .state { background: var(--good-soft); color: var(--good); }

/* ---------- teams ---------- */
.teamgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 10px; }
.tc { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.tc.mine { border-color: var(--cyan); box-shadow: 0 0 0 2px var(--cyan) inset; }
.tc h3 { margin: 0 0 6px; font-family: var(--f-display); font-weight: 400; font-size: 1.15rem; color: var(--red); }
.tc ul { margin: 0; padding-left: 1.1em; }
.tc .foot { margin-top: 8px; font-size: .82rem; color: var(--muted); }

/* ---------- admin ---------- */
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pl { display: grid; gap: 6px; background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
.pl .who { min-width: 0; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.pl .who .pname { font-size: 1.02rem; word-break: keep-all; overflow-wrap: anywhere; }
.pl .who .muted { white-space: nowrap; }
.pl .ops { display: flex; gap: 6px; flex-wrap: wrap; }
.rowform { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 560px) { .rowform { grid-template-columns: 1fr 1fr; } }
.stepper { display: inline-flex; align-items: center; gap: 8px; }
.stepper .big { font-size: 1.8rem; min-width: 2ch; text-align: center; }
.sizes { font-weight: 700; }
.danger { background: var(--danger-soft); border-color: var(--red); }
.adjust { display: grid; gap: 10px; }
.adj-team { background: var(--panel-2); border-radius: 10px; padding: 10px; display: grid; gap: 6px; }
.adj-mem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.adj-mem > span { word-break: keep-all; overflow-wrap: anywhere; }

/* ---------- modal / toast ---------- */
.ov { position: fixed; inset: 0; background: rgba(10, 14, 24, .55); z-index: 50; display: grid; align-items: end; justify-items: center; }
.sheet { width: min(100%, 560px); max-height: 92vh; overflow-y: auto; background: var(--panel); border-radius: 20px 20px 0 0; border: 3px solid var(--frame); border-bottom: 0;

<style>main{max-width:700px;margin:auto;padding:16px}.testpanel{background:var(--panel);border:2px solid var(--frame);border-radius:16px;padding:16px;margin:12px 0}.people{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}input{max-width:100%}details label{display:block;margin:12px 0}#feedback{min-height:1.5em}.picked{outline:3px solid var(--cyan)}h1{margin:4px 0;color:var(--red)}button{touch-action:manipulation}</style>
<main><small>泉鋼業（株）モルック部　運営テスト版</small><h1>月いちモルック</h1><details class="testpanel"><summary>共有先の設定</summary><label>テスト用ウェブアプリURL<input id="url" type="url" placeholder="https://script.google.com/macros/s/…/exec"></label><label>テスト用運営コード<input id="pass" type="password"></label><button class="btn" id="connect">接続する</button><p id="configMsg" role="status"></p></details>
<section class="testpanel"><h2 class="h">受付</h2><p id="mode"></p><label>名簿を検索<input id="search" placeholder="名前を入力"></label><div id="people" class="people"></div><button id="add" class="btn primary wide"></button></section>
<section class="testpanel"><h2 class="h">保存待ち</h2><div id="waiting"></div><p role="status" id="feedback"></p><button class="btn small" id="sync">再送・更新</button></section>
<section class="testpanel"><h2 class="h">受付済み <span id="count"></span></h2><div id="done" class="people"></div></section></main>
<script>
const names='はると ゆい そうた めい けんた あおい りく ひな だいき さくら ゆうと みお こうき りな しょう なな たくみ えま れん ここ いつき ゆか そら かい'.split(' ');
const $=id=>document.getElementById(id);
const prefix='monthly-reception-test-v1:';
let url=localStorage.getItem(prefix+'url')||'', pass=sessionStorage.getItem(prefix+'pass')||'';
const key=()=>prefix+(url||'local');
function read(){return JSON.parse(localStorage.getItem(key())||'{"pending":[],"accepted":[]}')}
let state=read(), selected=new Set(),busy=false;
$('url').value=url;$('pass').value=pass;
function write(next){localStorage.setItem(key(),JSON.stringify(next));state=next}
function render(){
 $('mode').textContent=url?'テストシート共有モード':'端末内の練習モード（他端末との共有は未接続）';
 $('people').replaceChildren();
 names.forEach((name,n)=>{const id=n+1;if(state.pending.includes(id)||state.accepted.includes(id)||!name.includes($('search').value.trim()))return;
 const b=document.createElement('button');b.className='btn small'+(selected.has(id)?' picked':'');b.textContent=name;b.setAttribute('aria-pressed',selected.has(id));b.onclick=()=>{if(selected.has(id))selected.delete(id);else selected.add(id);render()};$('people').append(b)});
 $('add').disabled=!selected.size;$('add').textContent='チェックした'+selected.size+'人を受付';
 $('waiting').textContent=state.pending.map(i=>names[i-1]).join('・')||'なし';
 $('count').textContent=state.accepted.length+'人';$('done').textContent=state.accepted.map(i=>names[i-1]).join('・')||'まだ誰も受付していません';
}
async function flush(){
 if(busy || (url&&!pass)){if(url&&!pass)$('feedback').textContent='共有先の設定で運営コードを入力してください';return}
 busy=true;
 const batch=[...state.pending];
 try{
 let ids;
 if(url){const response=await fetch(url,{method:'POST',credentials:'omit',body:JSON.stringify({pass,ids:batch}),signal:AbortSignal.timeout(30000)});if(!response.ok)throw Error();const data=await response.json();if(data.error){$('feedback').textContent=data.error;return}ids=data.ids;
 if(!Array.isArray(ids)||ids.some(i=>!Number.isInteger(i)||i<1||i>24)||batch.some(i=>!ids.includes(i)))throw Error()}
 else {await new Promise(resolve=>setTimeout(resolve,300));ids=[...new Set([...state.accepted,...batch])]}
 write({accepted:ids,pending:state.pending.filter(i=>!ids.includes(i))});ids.forEach(i=>selected.delete(i));
 $('feedback').textContent=url?'共有先で確認済み':'この端末に保存済み';render();
 if(state.pending.length)setTimeout(flush,0);
 }catch{$('feedback').textContent='保存を確認できません。保存待ちを保持し、再接続時に再送します。'}finally{busy=false}
}
$('add').onclick=()=>{try{write({...state,pending:[...new Set([...state.pending,...selected])]});selected.clear();$('feedback').textContent='保存待ちに追加しました';render();setTimeout(flush,0)}catch{$('feedback').textContent='端末に保存できません。空き容量をご確認ください。'}};
$('connect').onclick=()=>{const next=$('url').value.trim();if(busy||next!==url&&state.pending.length){$('configMsg').textContent='保存・通信の完了後に切り替えてください';return}
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(next)||!$('pass').value){$('configMsg').textContent='テスト用URLと運営コードを入力してください';return}
 url=next;pass=$('pass').value;localStorage.setItem(prefix+'url',url);sessionStorage.setItem(prefix+'pass',pass);state=read();selected.clear();$('configMsg').textContent='設定を保存しました';render();flush()};
$('search').oninput=render;$('sync').onclick=flush;window.addEventListener('online',flush);setInterval(()=>{if(url&&!document.hidden)flush()},10000);render();if(url||state.pending.length)flush();
</script></html>

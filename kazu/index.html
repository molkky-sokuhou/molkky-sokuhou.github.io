<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c1c1a">
<title>速報ページの閲覧数</title>
<style>
:root{ --paper:#f4f4ef; --card:#fff; --ink:#1c1c1a; --sub:#55554f; --soft:#d6d6ce; --bar:#1e4fd6; --warn:#b54a00; }
:root[data-theme="dark"]{ --paper:#121314; --card:#1b1c1e; --ink:#eeeee8; --sub:#a8a8a1; --soft:#3a3b3e; --bar:#8aa8ff; --warn:#ffad6b; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#121314; --card:#1b1c1e; --ink:#eeeee8; --sub:#a8a8a1; --soft:#3a3b3e; --bar:#8aa8ff; --warn:#ffad6b; } }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html.bigtext{font-size:20px}
body{margin:0;line-break:strict;background:var(--paper);color:var(--ink);font:1rem/1.7 system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:3px solid var(--ink);padding:10px 14px 10px}
.tools{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tools button{white-space:nowrap}
html.bigtext .tools button{font-size:.8rem;padding:0 10px}
.tools button,.btn{min-height:44px;padding:0 12px;border:2px solid var(--ink);background:var(--card);border-radius:6px;font-weight:700;font-size:.95rem}
h1{margin:6px 0 0;font-size:1.15rem;line-height:1.4}
main{padding:14px;max-width:640px;margin:0 auto}
h2{font-size:1.05rem;margin:26px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.tour{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tour button{min-height:44px;padding:0 12px;border:2px solid var(--ink);background:var(--card);border-radius:6px;font-weight:700}
.tour button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.big{display:flex;align-items:baseline;gap:10px;margin:10px 0 2px}
.big b{font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.big span{font-weight:700}
.lead{color:var(--sub);margin:4px 0}
table{width:100%;border-collapse:collapse;background:var(--card);font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--soft);padding:8px 8px;text-align:right;line-height:1.4}
th{background:var(--paper);font-size:.85rem;text-align:center;overflow-wrap:normal;padding:6px 4px}
td .mk{display:block;font-size:.8rem;font-weight:700;color:var(--sub)}
td:first-child,th:first-child{text-align:left;white-space:nowrap}
.hours{list-style:none;margin:0;padding:0}
.hours li{display:grid;grid-template-columns:4.2em 1fr 3em;align-items:center;gap:8px;min-height:30px}
.hours .bar{height:18px;background:var(--bar);border-radius:2px;min-width:2px}
.hours .bar.zero{background:var(--soft)}
.hours .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.days{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.days button{min-height:44px;padding:0 12px;border:2px solid var(--ink);background:var(--card);border-radius:6px;font-weight:700}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.note{font-size:.9rem;color:var(--sub);margin:6px 0}
.box{border:2px solid var(--ink);background:var(--card);padding:10px 12px;border-radius:6px;margin-top:10px}
.state{font-size:.9rem;color:var(--sub);margin-top:6px}
.state.bad{color:var(--warn);font-weight:700}
.foot{margin:30px 0 20px;font-size:.85rem;color:var(--sub)}
ul.how{padding-left:1.2em;margin:6px 0}
</style>
</head>
<body>
<header>
  <div class="tools"><button id="big" type="button"></button><button id="thm" type="button"></button><button id="reload" type="button">最新にする</button></div>
  <h1>速報ページの<wbr>閲覧数</h1>
  <div class="tour" id="tour" role="group" aria-label="どの大会を見るか"></div>
  <div class="state" id="state" role="status"></div>
</header>
<main id="view"></main>
<script>
var VERSION = '11/26-2';
/* tournaments that have the counter (COUNT_ID in each page). days = the range to show */
var TOURS = [
  { id: 'ehime6', name: '第6回 モルックえひめ大会', from: '2026-11-26', to: '2026-11-30', main: ['2026-11-28', '2026-11-29'] }
];
var API = 'https://abacus.jasoncameron.dev/get/molkky-sokuhou/';
var store = {
  get: function(k){ try { return localStorage.getItem('ehm6:' + k); } catch(e){ return null; } },
  set: function(k, v){ try { localStorage.setItem('ehm6:' + k, v); } catch(e){} }
};
/* opening this page means it is Maruoka's phone: stop counting this phone on the 速報 pages */
if (store.get('nocount') == null) store.set('nocount', '1');

function p2(x){ return String(x).padStart(2, '0'); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ymd(s){ return s.replace(/-/g, ''); }
function daysOf(t){ var a = [], d = new Date(t.from + 'T00:00:00'), e = new Date(t.to + 'T00:00:00'); while (d <= e){ a.push(d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate())); d.setDate(d.getDate() + 1); } return a; }
function label(s){ var d = new Date(s + 'T00:00:00'); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + '日月火水木金土'[d.getDay()] + '）'; }
function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }

var S = { tour: store.get('kazu:tour') || TOURS[0].id, day: null };
if (!TOURS.some(function(t){ return t.id === S.tour; })) S.tour = TOURS[0].id;
function T(){ return TOURS.filter(function(t){ return t.id === S.tour; })[0]; }
var V = {};         /* key -> number (null = could not read) */
var busy = false, runId = 0, failed = 0;

/* the service allows about 30 reads per 10 seconds, so read one at a time */
function getOne(k){
  return fetch(API + k, { cache: 'no-store' }).then(function(r){
    if (r.status === 404) return 0;
    if (!r.ok) throw new Error(r.status);
    return r.json().then(function(j){ return typeof j.value === 'number' ? j.value : 0; });
  });
}
function readKeys(keys, onEach){
  var id = ++runId, i = 0;
  return new Promise(function(done){
    (function next(){
      if (id !== runId) return done();
      if (i >= keys.length) return done();
      var k = keys[i++];
      getOne(k).then(function(n){ V[k] = n; }, function(){ V[k] = null; failed++; }).then(function(){ onEach(i, keys.length); setTimeout(next, 420); });
    })();
  });
}
function keysFor(t, day){
  var p = t.id + '-', ks = [p + 'dev'];
  daysOf(t).forEach(function(d){ ks.push(p + 'open-' + ymd(d), p + 'dev-' + ymd(d), p + 'pwa-' + ymd(d)); });
  for (var h = 6; h <= 21; h++) ks.push(p + 'h-' + ymd(day) + '-' + p2(h));
  return ks;
}
function pickDay(t){
  var td = todayStr();
  if (S.day && daysOf(t).indexOf(S.day) >= 0) return S.day;
  if (t.main.indexOf(td) >= 0) return td;
  return td > t.main[t.main.length - 1] ? t.main[t.main.length - 1] : t.main[0];
}
function load(){
  if (busy) return; busy = true; failed = 0;
  var t = T(); S.day = pickDay(t);
  var btn = document.getElementById('reload'); btn.disabled = true;
  var st = document.getElementById('state');
  var ks = keysFor(t, S.day);
  ks.forEach(function(k){ delete V[k]; });
  render();
  readKeys(ks, function(i, n){ st.className = 'state'; st.textContent = '読み込み中　' + i + ' / ' + n; render(); }).then(function(){
    busy = false; btn.disabled = false;
    var d = new Date();
    if (failed){ st.className = 'state bad'; st.textContent = failed + '件 読めませんでした（「—」の所）。少し待って「最新にする」を押してください。'; }
    else { st.className = 'state'; st.textContent = d.getHours() + ':' + p2(d.getMinutes()) + ' 時点の数'; }
    render();
  });
}
function num(k){ return k in V ? (V[k] == null ? '—' : V[k].toLocaleString()) : '…'; }
function render(){
  var t = T(), p = t.id + '-';
  document.getElementById('tour').innerHTML = TOURS.length > 1 ? TOURS.map(function(x){ return '<button type="button" data-tour="' + x.id + '" aria-pressed="' + (x.id === S.tour) + '">' + esc(x.name) + '</button>'; }).join('') : '<b>' + esc(t.name) + '</b>';
  var h = '';
  h += '<div class="big"><b>' + num(p + 'dev') + '</b><span>台</span></div><p class="lead">ページを開いた<wbr>スマホ・パソコンの<wbr>台数<wbr>（全期間）</p>';

  h += '<h2>日ごと</h2><table><thead><tr><th>日</th><th>開いた<br>回数</th><th>見た<br>台数</th><th>ホーム<br>画面<br>から</th></tr></thead><tbody>';
  daysOf(t).forEach(function(d){ var y = ymd(d); h += '<tr><td>' + label(d) + (t.main.indexOf(d) >= 0 ? '<span class="mk">大会の日</span>' : '') + '</td><td>' + num(p + 'open-' + y) + '</td><td>' + num(p + 'dev-' + y) + '</td><td>' + num(p + 'pwa-' + y) + '</td></tr>'; });
  h += '</tbody></table>';
  h += '<p class="note">「見た台数」は、<wbr>その日に<wbr>1回でも<wbr>開いた台数。<wbr>「ホーム画面から」は、<wbr>ホーム画面に<wbr>追加したアイコンから<wbr>開いた台数です。</p>';

  h += '<h2>時間ごとの台数</h2><div class="days">' + daysOf(t).map(function(d){ return '<button type="button" data-day="' + d + '" aria-pressed="' + (d === S.day) + '">' + label(d) + '</button>'; }).join('') + '</div>';
  var hs = [], max = 1;
  for (var x = 6; x <= 21; x++){ var k = p + 'h-' + ymd(S.day) + '-' + p2(x), val = V[k]; hs.push([x, k, val]); if (typeof val === 'number' && val > max) max = val; }
  h += '<ul class="hours">' + hs.map(function(r){ var w = typeof r[2] === 'number' ? Math.round(r[2] / max * 100) : 0; return '<li><span>' + r[0] + '時台</span><span class="bar' + (w ? '' : ' zero') + '" style="width:' + Math.max(w, 1) + '%"></span><span class="n">' + num(r[1]) + '</span></li>'; }).join('') + '</ul>';
  h += '<p class="note">その1時間に<wbr>開いていた台数です。<wbr>同じスマホは<wbr>1時間に<wbr>1回だけ<wbr>数えます。<wbr>6時〜21時台を<wbr>出しています。</p>';

  var off = store.get('nocount') === '1';
  h += '<h2>数え方</h2><ul class="how note">' +
    '<li>スマホ1台を<wbr>1と数えます。<wbr>同じ人が<wbr>2台で見れば2、<wbr>ブラウザを<wbr>変えた場合も<wbr>別の1台に<wbr>なります。</li>' +
    '<li>「開いた回数」は、<wbr>ページを<wbr>開いた回数。<wbr>開いたまま<wbr>30分以上あけて<wbr>戻ったときも<wbr>1回と数えます。<wbr>1分ごとの<wbr>自動更新や<wbr>「最新にする」は<wbr>数えません。</li>' +
    '<li>送るのは<wbr>数だけで、<wbr>名前など<wbr>見た人が<wbr>分かる情報は<wbr>送っていません。<wbr>ただし通信の<wbr>仕組み上、<wbr>IPアドレスは<wbr>計数サービスに<wbr>届きます。</li>' +
    '<li>数えるのに<wbr>使っているのは、<wbr>登録のいらない<wbr>無料の<wbr>計数サービス<wbr>（abacus）です。<wbr>止まっていても<wbr>速報ページの<wbr>表示には<wbr>影響しません。</li></ul>';
  h += '<div class="box"><b>この端末は ' + (off ? '数えない設定' : '数える設定') + 'です</b><p class="note" style="margin:4px 0 8px">このページを<wbr>開いた端末は、<wbr>自動で<wbr>「数えない」に<wbr>なります。<wbr>自分で見た分が<wbr>混ざらないように<wbr>するためです。</p><button class="btn" type="button" data-act="nocount">' + (off ? 'この端末も数える' : 'この端末は数えない') + '</button></div>';
  h += '<p class="foot">このページは<wbr>速報ページとは<wbr>別の場所にあり、<wbr>大会のページを<wbr>消したあとも<wbr>見られます。<wbr>どこからも<wbr>リンクしていません。<br>版 ' + VERSION + '</p>';
  document.getElementById('view').innerHTML = h;
}
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-tour],[data-day],[data-act]'); if (!b) return;
  if (b.dataset.tour){ S.tour = b.dataset.tour; S.day = null; store.set('kazu:tour', S.tour); busy = false; load(); return; }
  if (b.dataset.day){ S.day = b.dataset.day; busy = false; load(); return; }
  if (b.dataset.act === 'nocount'){ store.set('nocount', store.get('nocount') === '1' ? '0' : '1'); render(); }
});
document.getElementById('reload').addEventListener('click', function(){ checkVersion(); load(); });

/* theme / text size (same keys as the 速報 page, so the choice carries over) */
function darkNow(){ var t = document.documentElement.dataset.theme; if (t) return t === 'dark'; try { return matchMedia('(prefers-color-scheme: dark)').matches; } catch(e){ return false; } }
(function(){ var t = store.get('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; })();
function paintTheme(){ var b = document.getElementById('thm'), dk = darkNow(); b.textContent = dk ? '☀ 明るく' : '☾ 暗く'; b.setAttribute('aria-label', dk ? '明るい画面に切り替える' : '暗い画面に切り替える'); }
document.getElementById('thm').addEventListener('click', function(){ var t = darkNow() ? 'light' : 'dark'; document.documentElement.dataset.theme = t; store.set('theme', t); paintTheme(); });
function paintBig(){ var on = document.documentElement.classList.contains('bigtext'), b = document.getElementById('big'); b.textContent = on ? '文字 ふつう' : '文字 大'; b.setAttribute('aria-pressed', String(on)); }
if (store.get('big') === '1') document.documentElement.classList.add('bigtext');
document.getElementById('big').addEventListener('click', function(){ var on = document.documentElement.classList.toggle('bigtext'); store.set('big', on ? '1' : '0'); paintBig(); });
paintTheme(); paintBig();
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme); } catch(e){}

/* newer version check (home-screen pages keep the old page) */
var verBusy = false;
function checkVersion(){
  if (verBusy || location.protocol === 'file:') return; verBusy = true;
  fetch('./?v=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.ok ? r.text() : ''; }).then(function(t){
    verBusy = false;
    var m = t.match(/var VERSION = '([^']+)'/), tried = '';
    try { tried = sessionStorage.getItem('kazu:ver') || ''; } catch(e){}
    if (m && m[1] !== VERSION && m[1] !== tried){ try { sessionStorage.setItem('kazu:ver', m[1]); } catch(e){} location.replace(location.pathname + '?v=' + encodeURIComponent(m[1])); }
  }, function(){ verBusy = false; });
}
setTimeout(checkVersion, 3000);
setInterval(function(){ if (document.visibilityState === 'visible') checkVersion(); }, 300000);
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible'){ checkVersion(); load(); } });

load();
</script>
</body>
</html>

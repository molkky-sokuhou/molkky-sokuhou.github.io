<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="玉野速報">
<meta name="theme-color" content="#1c1c1a">
<meta name="robots" content="noindex, nofollow">
<title>第4回モルック玉野大会 速報</title>
<style>
:root{
  --paper:#f4f4ef; --card:#ffffff; --ink:#1c1c1a; --sub:#55554f; --soft:#d6d6ce;
  --red:#cf1f29; --blue:#1e4fd6; --court:#e2eaf5; --mark:#ffe95c; --ok:#17733a; --warn:#b54a00;
}
:root[data-theme="dark"]{ --paper:#121314; --card:#1b1c1e; --ink:#eeeee8; --sub:#a8a8a1; --soft:#3a3b3e;
    --red:#ff5d64; --blue:#8aa8ff; --court:#24303f; --mark:#6d5f00; --ok:#5fd28c; --warn:#ffad6b; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#121314; --card:#1b1c1e; --ink:#eeeee8; --sub:#a8a8a1; --soft:#3a3b3e;
    --red:#ff5d64; --blue:#8aa8ff; --court:#24303f; --mark:#6d5f00; --ok:#5fd28c; --warn:#ffad6b; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.7 system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  word-break:keep-all;overflow-wrap:anywhere;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
a{color:var(--blue)}

#demo{background:var(--ink);color:var(--paper);font-size:14px;line-height:1.6;padding:8px 14px}

header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:3px solid var(--ink);padding:10px 14px 8px}
.pre{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--sub);line-height:1.6;margin-bottom:2px}
.ttl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ttl h1{margin:0;font-size:18px;line-height:1.35;letter-spacing:.01em}
.ttl h1 small{display:block;font-size:14px;font-weight:600;color:var(--sub);letter-spacing:0}
#reload{flex:none;min-height:44px;padding:0 14px;border:2px solid var(--ink);background:var(--card);font-weight:700;font-size:15px;border-radius:6px}
#reload:active{transform:translateY(1px)}
#reload[disabled]{opacity:.55}
.sub2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.stamp{font-size:14px;color:var(--sub);line-height:1.5}
.thm2{position:relative;flex:none;height:32px;padding:0 10px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:16px;font:inherit;font-size:14px;font-weight:700}
.thm2::after{content:"";position:absolute;left:0;right:0;top:-6px;bottom:-6px}
.thm{flex:none;min-height:44px;padding:0 10px;border:1.5px solid var(--sub);background:transparent;border-radius:6px;font-size:14px;font-weight:700;color:var(--sub)}
.stamp.bad{color:var(--warn);font-weight:700}
.unoff{display:inline-block;font-size:14px;font-weight:800;border:1.5px solid currentColor;border-radius:3px;padding:0 6px;margin-left:6px;vertical-align:2px;color:var(--sub);line-height:1.6}
.broken{margin:12px 0 4px;padding:12px 14px;border:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--card));border-radius:4px}
.broken b{display:block;font-size:17px;color:var(--warn);line-height:1.5}
.broken p{margin:6px 0 0;font-size:15px;line-height:1.6}
.broken a{font-weight:700}
.footrow{display:flex;justify-content:flex-end;margin:22px 0 0}
tr.mine td{background:color-mix(in srgb,var(--mark) 30%,transparent)}
.mlist li.mine{background:color-mix(in srgb,var(--mark) 22%,transparent);box-shadow:inset 5px 0 0 var(--red);padding-left:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));z-index:7;background:var(--ink);color:var(--paper);font-size:15px;font-weight:700;padding:10px 16px;border-radius:6px;width:max-content;max-width:92vw;text-align:center;line-height:1.5}
.foot{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--soft);font-size:14px;color:var(--sub);line-height:1.6}

main{padding:4px 14px 24px;max-width:640px;margin:0 auto}
h2{font-size:19px;margin:22px 0 8px;line-height:1.4}
h3{font-size:17px;margin:18px 0 6px;line-height:1.4}
.lead{color:var(--sub);font-size:15px;margin:0 0 10px}
.note{font-size:15px;color:var(--sub);margin:6px 0}

/* court number: red circle like the venue map */
.cn{display:inline-flex;align-items:center;justify-content:center;flex:none;width:36px;height:36px;border:2.5px solid var(--red);border-radius:50%;
  color:var(--red);font-weight:800;font-size:18px;line-height:1;font-variant-numeric:tabular-nums;background:var(--card)}
.cn.big{width:84px;height:84px;border-width:4px;font-size:44px}
.cn.none{border-style:dashed;border-color:var(--sub);color:var(--sub);font-size:14px}
.me{background:linear-gradient(transparent 52%,var(--mark) 52%);font-weight:800}

/* next match */
.next{border:2.5px solid var(--ink);background:var(--card);border-radius:4px;padding:14px;margin:12px 0 6px}
.next .lbl{font-size:15px;font-weight:700;color:var(--sub)}
.next .row{display:flex;gap:14px;align-items:center;margin-top:6px}
.next .when{font-size:24px;font-weight:800;line-height:1.3}
.next .what{font-size:16px;line-height:1.5}
.next .vs{margin-top:10px;font-size:17px;line-height:1.6}
.next .vs b{font-size:18px}
.tag{display:inline-block;font-size:14px;font-weight:800;padding:1px 8px;border-radius:3px;line-height:1.6;vertical-align:2px}
.tag.now{background:var(--red);color:#fff}
.tag.done{background:var(--soft);color:var(--ink)}
.tag.if{border:1.5px solid var(--sub);color:var(--sub)}

.myhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:14px}
.myhead .nm{font-size:22px;font-weight:800;line-height:1.35}
.myhead .meta{font-size:15px;color:var(--sub)}
.btn{min-height:44px;padding:0 14px;border:2px solid var(--ink);background:var(--card);border-radius:6px;font-weight:700;font-size:15px;flex:none}

/* day plan */
.plan{list-style:none;margin:8px 0 0;padding:0;border-top:2px solid var(--ink)}
.plan li{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--soft)}
.plan li.cur{background:color-mix(in srgb,var(--mark) 28%,transparent)}
.plan .t{font-weight:800;font-size:16px;line-height:1.4}
.plan .s{font-size:15px;color:var(--sub);line-height:1.5}
.plan .o{font-size:16px;line-height:1.55;margin-top:2px}
.plan li.later{opacity:.75}

/* match lists */
.chips{margin:10px 0 4px}
.chips .g{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips .gl{width:2.6em;font-weight:800;font-size:15px}
.chips .gl.u{color:var(--red)} .chips .gl.l{color:var(--blue)}
.chip{min-height:44px;padding:0 12px;border:1.5px solid var(--ink);border-radius:22px;background:var(--card);font-size:15px;font-weight:600}
.chip.on{background:var(--ink);color:var(--paper)}
.rhead{margin:14px 0 4px;padding:8px 0;border-bottom:2px solid var(--ink)}
.rhead .t{font-size:19px;font-weight:800}
.rhead .s{font-size:15px;color:var(--sub);line-height:1.6;word-break:normal;line-break:strict}
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--soft);align-items:flex-start}
.mlist .teams{flex:1;min-width:0}
.tm{display:flex;justify-content:space-between;gap:8px;line-height:1.5;padding:1px 0}
.tm .nm{min-width:0}
.tm .lot{color:var(--sub);font-size:14px;margin-right:4px;font-variant-numeric:tabular-nums}
.tm .sc{flex:none;font-variant-numeric:tabular-nums;font-weight:700}
.tm.win .nm{font-weight:800}
.tm.win .sc::after{content:" 勝";color:var(--ok);font-size:14px}
.tm.ph .nm{color:var(--sub)}
.mlist .blk{font-size:14px;font-weight:800;color:var(--sub)}

/* standings */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:14px;color:var(--sub);font-weight:700;text-align:right;padding:6px 4px;border-bottom:2px solid var(--ink)}
th:nth-child(2){text-align:left}
td{padding:8px 4px;border-bottom:1px solid var(--soft);text-align:right;font-size:16px;line-height:1.45}
td:nth-child(2){text-align:left}
td.rk{font-weight:800;width:2.4em}
td.tot{font-weight:800}
.pf{display:block;font-size:14px;color:var(--sub);font-weight:400}
td.n{white-space:nowrap;width:1.85em;font-size:15px}
td.tot{white-space:nowrap;width:2.6em}
th.n{width:1.85em}
tr.cut td{border-bottom:3px double var(--red)}
.cutnote{font-size:15px;color:var(--red);font-weight:700;margin:6px 0 0}
.awards{border:2.5px solid var(--ink);background:var(--card);padding:10px 14px;margin:10px 0}
.awards div{display:flex;gap:12px;padding:4px 0;font-size:17px}
.awards b{width:4em;flex:none}

.side-u{color:var(--red)} .side-l{color:var(--blue)}

/* map */
.map{width:100%;height:auto;display:block;margin:8px 0}
.map .m-watch{fill:#fbf3cf} .map .m-hall{fill:#e5efdb;stroke:var(--ink);stroke-width:2}
.map .m-room{fill:#ececec;stroke:var(--ink);stroke-width:1.5}
.map .m-hq{fill:#f7a1a1;stroke:var(--ink);stroke-width:1.5}
.map .m-smk{fill:#f5c242;stroke:var(--ink);stroke-width:1}
.map text{font-family:inherit;fill:#1c1c1a}
.map .m-lbl{font-size:13px;font-weight:700}
.map .m-sm{font-size:12px;font-weight:700}
.map .m-court rect{fill:#fff;stroke:#1c1c1a;stroke-width:1.5}
.map .m-court.alt rect{fill:#dfe8f4}
.map .m-court circle{fill:#fff;stroke:#cf1f29;stroke-width:2.5}
.map .m-court text{font-size:16px;font-weight:800;fill:#cf1f29}
.map .m-court.on rect{fill:#cf1f29}
.map .m-court.on circle{fill:#cf1f29;stroke:#fff}
.map .m-court.on text{fill:#fff}
.map .m-court{cursor:pointer}
.map .m-court rect{fill:#fff;stroke:#1c1c1a;stroke-width:1.5}
.map .m-court.u rect{fill:#c9daf6} .map .m-court.l rect{fill:#f3c9cc}
.map .m-court text{font-size:20px;font-weight:800;fill:#1c1c1a}
.map .m-court.on rect{fill:#cf1f29} .map .m-court.on text{fill:#fff}
.map .m-kc{fill:#fbefc7;stroke:#1c1c1a;stroke-width:1}
.map .m-ku{fill:#c9daf6;stroke:#1c1c1a} .map .m-kl{fill:#f3c9cc;stroke:#1c1c1a}
.band{margin:8px -14px -8px;padding:8px 14px 9px;background:var(--ink);color:var(--paper);line-height:1.5}
.band .b1{font-size:17px;font-weight:800}
.band .b1,.band .b2{white-space:nowrap;overflow:hidden}
.band .mq{display:inline-block;padding-right:3em}
.band .track{display:inline-block;white-space:nowrap}
.band .run .track{animation:mq var(--dur,12s) linear infinite;animation-delay:1.5s}
.band.paused .track{animation-play-state:paused}
@keyframes mq{0%{transform:translateX(0)}100%{transform:translateX(var(--dist,-100%))}}
.band.wait{background:#b54a00;color:#fff}
.band.wait .b2{color:#fff}
.band.flash{animation:fl 1s ease-in-out 3}
@keyframes fl{0%,100%{filter:none}50%{filter:invert(1)}}
@media (prefers-reduced-motion: reduce){
  .band .b1,.band .b2{white-space:normal}
  .band .run .track{animation:none}
  .band .run .mq[aria-hidden]{display:none}
  .band.flash{animation:none;outline:4px solid var(--red);outline-offset:-4px}
}
.band .b1 small{font-size:15px;font-weight:700;opacity:.85}
.band .b2{font-size:15px;font-weight:700;color:#ffd166;margin-top:2px}
:root[data-theme="dark"] .band .b2{color:#b54a00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .band .b2{color:#b54a00}}
.sendwarn{margin:10px 0 0;padding:10px 12px;background:#fff1c2;color:#1c1c1a;border:2.5px solid #b54a00;border-radius:4px;font-size:16px;font-weight:700;line-height:1.6}
.sendwarn b{color:#b54a00}
.tools{display:flex;gap:6px;flex:none}
html.bigtext main,html.bigtext nav{zoom:1.22}
.tn{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent);text-underline-offset:3px}
.tn .fav{color:var(--blue);font-weight:800}
.mlist li.favrow{box-shadow:inset 5px 0 0 var(--blue);padding-left:12px}
.favs{list-style:none;margin:8px 0;padding:0;border-top:2px solid var(--blue)}
.favs li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--soft)}
.favs .fx{flex:none;min-height:44px;min-width:44px;border:1.5px solid var(--sub);border-radius:6px;background:transparent;color:var(--sub);font-size:14px;font-weight:700}
.addfav{display:block;width:100%;min-height:48px;margin:8px 0;border:2px dashed var(--blue);border-radius:6px;background:transparent;color:var(--blue);font-weight:800;font-size:16px}
#sheetbg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:82vh;overflow:auto;background:var(--paper);border-top:3px solid var(--ink);border-radius:12px 12px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
#sheet h3{margin:0;font-size:21px;line-height:1.4}
#sheet .meta{color:var(--sub);font-size:15px}
#sheet table{margin:10px 0;width:100%}
#sheet th,#sheet td{white-space:nowrap;width:auto!important;text-align:right}
#sheet th:first-child,#sheet td:first-child{text-align:left}
#sheet .row2{display:flex;gap:8px;margin-top:14px}
#sheet .row2 button{flex:1;min-height:48px;border:2px solid var(--ink);border-radius:6px;background:var(--card);font-weight:800;font-size:16px}
#sheet .row2 button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.install{border:2px solid var(--ink);background:var(--card);padding:12px;margin:10px 0;border-radius:4px}
.install ol{margin:6px 0 0;padding-left:1.4em;line-height:1.8}
.install .big2{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:6px;background:var(--ink);color:var(--paper);font-weight:800;font-size:17px;margin-top:8px}
.send{margin:12px 0 4px;padding:12px;border:2px dashed var(--ink);border-radius:4px}
.sendbtn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 16px;border-radius:6px;background:var(--red);color:#fff;font-weight:800;font-size:17px;text-decoration:none}
.sendhow{margin:8px 0 0;font-size:15px;line-height:1.6}
.sendlist{margin:4px 0 0;padding-left:1.2em;font-size:15px;line-height:1.7}
.rules{margin:6px 0;padding-left:1.2em}
.rules li{margin:6px 0;line-height:1.65}
.cn{font-family:inherit}
.map .m-court.sel rect{stroke:#1e4fd6;stroke-width:4}
.maphint{font-size:14px;color:var(--sub);margin:2px 0 0}
.cinfo{border:2px solid var(--ink);background:var(--card);padding:10px 12px;margin:8px 0;border-radius:4px}
.cinfo .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cinfo .h b{font-size:17px;line-height:1.4}
.cinfo .h span{display:block;font-size:14px;color:var(--sub);font-weight:400}
.cinfo .x{min-height:44px;min-width:44px;border:1.5px solid var(--ink);background:transparent;border-radius:6px;font-size:15px;font-weight:700;flex:none}
.cinfo .tm{padding:3px 0}
.minelabel{font-size:14px;font-weight:800;color:var(--red);margin:10px 0 0}
.map .m-here{font-size:14px;font-weight:800;fill:#cf1f29}
.mapwrap{background:#fff;border:2px solid var(--ink);padding:4px;margin:8px 0}
.access{width:100%;height:auto;display:block;border:2px solid var(--ink)}

.tt{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.tt li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--soft)}
.tt .tm2{width:7.6em;flex:none;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tt .nt{font-size:15px;color:var(--sub);line-height:1.6;margin-top:2px;word-break:normal;line-break:strict}
.tt li.cur{background:color-mix(in srgb,var(--mark) 28%,transparent)}
.rule{white-space:pre-wrap;word-break:normal;line-break:strict;font-size:16px}
details{border-top:2px solid var(--ink);border-bottom:1px solid var(--soft)}
summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer;color:var(--blue)}
.rule h4{margin:16px 0 4px;font-size:17px}

.pick{list-style:none;margin:8px 0;padding:0;border-top:2px solid var(--ink)}
.pick button{width:100%;min-height:52px;text-align:left;border:0;border-bottom:1px solid var(--soft);background:transparent;padding:8px 4px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:17px}
.pick button span{font-size:14px;color:var(--sub);flex:none}
.empty{padding:20px 0;color:var(--sub)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);
  border-top:2.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
nav button{min-height:62px;border:0;background:transparent;font-size:15px;font-weight:700;line-height:1.3;padding:6px 2px}
nav button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>
<div id="demo" hidden>見本（デモデータ・12時55分ごろを想定）。<wbr>本番のページは<wbr>主催者のシートから<wbr>自動で読み込みます。</div>
<header>
  <div class="pre"><span>2026年11月23日（月・祝）<span class="unoff">非公式の速報</span></span><span class="tools"><button id="big" class="thm2" type="button"></button><button id="thm" class="thm2" type="button"></button></span></div>
  <div class="ttl">
    <h1>第4回 モルック<wbr>玉野大会</h1>
    <button id="reload" type="button">最新にする</button>
  </div>
  <div class="stamp" id="stamp" style="margin-top:4px">読み込み中…</div>
  <div class="band" id="band" role="status" hidden></div>
</header>
<main id="view"></main>
<div id="sheetwrap" hidden><div id="sheetbg"></div><div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetttl"></div></div>
<div id="toast" role="status" hidden></div>
<nav id="tabs" role="tablist">
  <button data-tab="me" role="tab">自分の<br>試合</button>
  <button data-tab="games" role="tab">試合・<br>コート</button>
  <button data-tab="rank" role="tab">順位・<br>復活組</button>
  <button data-tab="venue" role="tab">会場・<br>ルール</button>
</nav>
<script>
var BOOT = null;
var ACCESS_IMG = '';
var HAS_GAS = false;
var SHEET_ID = atob('TWFLWmhESDhRQ3RTeEM4RjV1WXh4YW5wRkFUZkVmSEsxS1Mza29wQzVodzE=').split('').reverse().join('');
var TABS = {
  games: { names: ['組合せ（結果あり）'], range: 'A1:AE60', sign: 'チーム名' },
  ranks: { names: ['予選結果'], range: 'A1:AA60', sign: 'チーム名' },
  upper: { names: ['上位トーナメント'], range: 'A1:BG40', sign: '上位トーナメント' },
  lower: { names: ['下位トーナメント'], range: 'A1:AN30', sign: '下位トーナメント' },
  entry: { names: ['エントリーチーム一覧'], range: 'A1:B60', sign: 'チーム名' }
};
var DEMO = !!(BOOT && BOOT.demo);
var AUTO_SEC = 60;

var store = {
  get: function(k){ try { return localStorage.getItem('tmn4:' + k); } catch(e){ return null; } },
  set: function(k, v){ try { localStorage.setItem('tmn4:' + k, v); } catch(e){} }

/* where the winners go next (from the organizer's rules, p.8) */
var U2_FROM = { A: ['A', 'M', 'R5'], B: ['B', 'L', 'R4'], C: ['C', 'K', 'R3'], D: ['D', 'J', 'R2'], E: ['E', 'I', 'R1'] };

function nextCourt(k, c){
  var map = k === 'u1' ? U2_FROM : k === 'u2' ? U3_FROM : k === 'l1' ? L2_FROM : null;
  if (!map) return null;
  for (var to in map) if (map[to].indexOf(c) >= 0) return to;
  return null;
}

/* ---------- read the organizer's sheet ---------- */
function played(teams){ return teams.some(function(t){ return t.g.some(function(x){ return x != null && x !== 0; }); }); }
function parseQuals(g){
  var out = [], round = 0;
  for (var r = 0; r < (g || []).length; r++){
    var a = z(v(at(g, r, 0))).replace(/\s/g, ''), m = a.match(/第(\d)試合/);
    if (m){ round = +m[1]; continue; }
    if (!round || !/^[A-P]$/.test(a)) continue;
    var teams = [1, 11, 21].map(function(b){
      return { no: n(at(g, r, b)), name: v(at(g, r, b + 1)), g: [n(at(g, r, b + 2)), n(at(g, r, b + 3))], bp: n(at(g, r, b + 4)),
        wins: n(at(g, r, b + 7)), draws: n(at(g, r, b + 8)), total: n(at(g, r, b + 9)) };
    }).filter(function(t){ return t.name || t.no != null; });
    out.push({ k: 'q' + round, court: a, teams: teams, played: played(teams) });
  }
  return out;
}
function parseStandings(g){
  var list = [];
  for (var r = 1; r < (g || []).length; r++){
    var name = v(at(g, r, 1)), no = n(at(g, r, 0));
    if (!name || no == null) continue;
    list.push({ no: no, name: name, per: [n(at(g, r, 7)), n(at(g, r, 13)), n(at(g, r, 19))], total: n(at(g, r, 20)),
      wins: n(at(g, r, 21)), draws: n(at(g, r, 22)), rank: n(at(g, r, 25)) });
  }
  return list;
}
/* one block of a tournament sheet: rows grouped by the court letter */
function parseBlock(g, cfg){
  var groups = [], cur = null;
  for (var r = 3; r < (g || []).length; r++){
    var c = cfg.court != null ? z(v(at(g, r, cfg.court))) : 'X';
    var name = v(at(g, r, cfg.name)), label = cfg.label != null ? z(v(at(g, r, cfg.label))) : '', seed = cfg.seed != null ? n(at(g, r, cfg.seed)) : null;
    if (!(cfg.court != null ? /^[A-P]$/.test(c) : (name || /^[A-P]1$/.test(label)))) continue;
    var gk = cfg.court != null ? c : 'final';
    if (!cur || cur.gk !== gk){ cur = { gk: gk, court: cfg.court != null ? c : null, teams: [] }; groups.push(cur); }
    cur.teams.push({ name: name, seed: seed, label: label, no: n(at(g, r, cfg.name - 1)),
      g: cfg.games.map(function(i){ return n(at(g, r, i)); }), wins: n(at(g, r, cfg.wins)),
      total: cfg.total != null ? n(at(g, r, cfg.total)) : null, rank: n(at(g, r, cfg.rank)) });
  }
  groups.forEach(function(x){ x.played = played(x.teams); });
  return groups;
}
var BLOCKS = {
  u1: { sheet: 'upper', court: 2, seed: 3, name: 5, games: [6, 7], wins: 9, total: 10, rank: 12 },
  u2: { sheet: 'upper', court: 19, label: 20, name: 22, games: [23, 24], wins: 26, total: 27, rank: 31 },
  u3: { sheet: 'upper', court: 38, label: 39, name: 41, games: [42, 43, 44], wins: 45, rank: 46 },

/* the sheet fills the next round by formula even before a match is played,

function gate(T){
  function byCourt(k, c){ return (T[k] || []).find(function(x){ return x.court === c; }); }
  function allPlayed(k){ return (T[k] || []).length && T[k].every(function(x){ return x.played; }); }
  var prev = { u2: 'u1', u3: 'u2', u4: 'u3', l2: 'l1', l3: 'l2' };
  Object.keys(prev).forEach(function(k){
    (T[k] || []).forEach(function(m, mi){
      var from = k === 'u2' ? U2_FROM[m.court] : k === 'u3' ? U3_FROM[m.court] : k === 'l2' ? L2_FROM[m.court] :
        k === 'u4' ? ['C', 'D', 'E'] : ['F', 'G'];
      m.teams.forEach(function(t, i){
        var src = from ? from[i] : null, ok = false;
        if (!src) ok = false;
        else if (src.charAt(0) === 'R') ok = allPlayed('u1');
        else if (src === 'S') ok = allPlayed('u2');
        else { var pm = byCourt(prev[k], src); ok = !!(pm && pm.played); }
        t.src = src; t.show = ok && !!t.name;
      });
    });
  });
  ['u1', 'l1'].forEach(function(k){ (T[k] || []).forEach(function(m){ m.teams.forEach(function(t){ t.show = !!t.name; }); }); });
}
function srcText(k, src){
  if (!src) return '';
  if (src.charAt(0) === 'R') return '復活組' + src.charAt(1) + '位';
  if (src === 'S') return '準復活組';
  var pk = { u2: '1回戦', u3: '準々決勝', u4: '準決勝', l2: '準々決勝', l3: '準決勝' }[k];

}
function build(raw){
  var g = (raw && raw.grids) || {}, T = {};
  T.q = parseQuals(g.games);
  Object.keys(BLOCKS).forEach(function(k){ var b = BLOCKS[k]; T[k] = parseBlock(g[b.sheet], b); });
  gate(T);
  var st = parseStandings(g.ranks), names = {};
  (g.entry || []).forEach(function(row, i){ if (i && v(row[1])) names[key(row[1])] = v(row[1]); });
  st.forEach(function(t){ names[key(t.name)] = t.name; });
  var started = st.some(function(t){ return t.total; });
  var qualsDone = T.q.length > 0 && T.q.every(function(m){ return m.played; });
  return { T: T, st: st, names: names, started: started, qualsDone: qualsDone };

/* ---------- rounds and courts ---------- */
function matchesOf(k){
  if (k.charAt(0) === 'q') return M.T.q.filter(function(m){ return m.k === k; });
  return M.T[k] || [];
}
function autoRound(){
  var now = nowMin(), best = null;
  ROUNDS.forEach(function(r){ var s = startMin(r.k), e = endMin(r.k); if (s == null) return;
    if (now <= e && (!best || s < best.s)) best = { k: r.k, s: s }; });
  return best ? best.k : 'u4';
}
function sameTimeKeys(k){ var t = roundInfo(k).t; return ROUNDS.filter(function(r){ return r.t === t; }).map(function(r){ return r.k; }); }
function teamLine(t, k){
  var nm = t.show === false ? srcText(k, t.src) : (t.name || '');
  return { name: nm, ph: t.show === false || !t.name };
}
function scoreText(t, k){
  if (k.charAt(0) === 'q') return t.total != null && (t.g[0] || t.g[1]) ? t.total + '点' : '';
  if (k === 'u3' || k === 'u4' || k === 'l3') return t.g.some(function(x){ return x != null; }) ? (t.wins || 0) + 'セット' : '';
  return t.total ? t.total + '点' : '';
}
function courtInfo(){
  if (!S.court || !M) return '';
  var c = S.court, keys = sameTimeKeys(autoRound()), hit = null;
  keys.forEach(function(k){ if (!hit){ var m = matchesOf(k).find(function(x){ return x.court === c; }); if (m) hit = { k: k, m: m }; } });
  var h = '<div class="cinfo"><div class="h"><b>コート' + esc(c) + '<span>' + (hit ? esc(roundInfo(hit.k).full) + '　' + esc(timeText(hit.k)) : esc(roundInfo(keys[0]).full)) + '</span></b><button class="x" type="button" data-act="closecourt">閉じる</button></div>';
  if (!hit) h += '<p class="note">この時間、<wbr>このコートでの<wbr>試合はありません。</p>';
  else h += hit.m.teams.map(function(t){ var l = teamLine(t, hit.k); return '<div class="tm' + (l.ph ? ' ph' : '') + '"><span>' + (l.ph ? '<span class="nm">' + esc(l.name || '未定') + '</span>' : teamName(l.name)) + '</span><span class="sc">' + esc(t.show === false ? '' : scoreText(t, hit.k)) + '</span></div>'; }).join('');
  return h + '</div>';

/* ---------- one team's day ---------- */
function plan(name){
  var kn = key(name), items = [], T = M.T;
  ['q1', 'q2', 'q3'].forEach(function(k){
    var m = matchesOf(k).find(function(x){ return x.teams.some(function(t){ return key(t.name) === kn; }); });
    var it = { k: k, title: roundInfo(k).full, time: timeText(k) };
    if (m){
      var me = m.teams.find(function(t){ return key(t.name) === kn; });
      it.court = m.court; it.opp = m.teams.filter(function(t){ return t !== me; }).map(function(t){ return { name: t.name, sc: m.played ? t.total : null }; });
      it.done = m.played; it.my = me.total; it.myw = me.wins;
    } else it.wait = '対戦表にまだ入っていません';
    items.push(it);
  });
  function find(k){ var res = null; (T[k] || []).forEach(function(m){ m.teams.forEach(function(t){ if (t.show && key(t.name) === kn) res = { m: m, t: t }; }); }); return res; }
  var side = find('u1') ? 'u' : find('l1') ? 'l' : null;
  if (!side){
    items.push({ k: 'after', title: '予選のあと', note: M.qualsDone ? '上位・下位の振り分けをシートに反映中です' : '予選の合計得点で、上位30チームは上位トーナメント、下位18チームは下位トーナメントに進みます' });
    return { items: items, side: null };
  }
  var order = side === 'u' ? ['u1', 'u2', 'u3', 'u4'] : ['l1', 'l2', 'l3'];
  var court = null, alive = true;
  for (var i = 0; i < order.length; i++){
    var k = order[i], f = find(k), ri = roundInfo(k);
    if (f){
      var opp = f.m.teams.filter(function(t){ return t !== f.t; }).map(function(t){ var l = teamLine(t, k); return l.ph ? { ph: l.name || '未定' } : { name: l.name, sc: f.m.played ? scoreText(t, k) : '' }; });
      items.push({ k: k, title: ri.full.replace('トーナメント ', ' '), time: timeText(k), court: f.m.court || null, opp: opp, done: f.m.played, res: f.m.played ? scoreText(f.t, k) : '',
        note: f.m.court ? '' : '決勝のコートは本部の案内に従ってください' });
      court = f.m.court;
      continue;
    }
    var prevK = order[i - 1], pm = prevK ? (T[prevK] || []).find(function(m){ return m.court === court; }) : null;
    var mine = pm ? pm.teams.find(function(t){ return key(t.name) === kn; }) : null;
    if (pm && pm.played && mine && mine.rank === 1 && (k === 'u4' || k === 'l3' || nextCourt(prevK, court))){
      /* won the last match, but the sheet has not shown the next round yet */
      var nc2 = k === 'u4' || k === 'l3' ? null : nextCourt(prevK, court);
      var nm = nc2 ? (T[k] || []).find(function(m){ return m.court === nc2; }) : (T[k] || [])[0];
      var opp2 = nm ? nm.teams.filter(function(t){ return key(t.name) !== kn; }).map(function(t){ var l = teamLine(t, k); return l.ph ? { ph: l.name || '未定' } : { name: l.name }; }) : [{ ph: '未定' }];
      items.push({ k: k, title: ri.full.replace('トーナメント ', ' '), time: timeText(k), court: nc2, opp: opp2, note: nc2 ? '1位で勝ち上がり（本部の確定をお待ちください）' : '決勝のコートは本部の案内に従ってください' });
      court = nc2; continue;
    }
    if (pm && pm.played){
      if (prevK === 'u1') items.push({ k: 'rev', title: '1回戦の結果', note: '準々決勝の組み合わせに名前がなければ、復活組（コート1位以外で合計得点の上位5チーム）の発表を待ってください' });
      else if (prevK === 'u2') items.push({ k: 'rev', title: '準々決勝の結果', note: '準決勝の組み合わせに名前がなければ、準復活組（コート1位以外で合計得点1位）の発表を待ってください' });
      else items.push({ k: 'end', title: (side === 'u' ? '上位' : '下位') + 'トーナメントはここまで', note: 'おつかれさまでした' });
      alive = false; break;
    }
    var nc = k === 'u4' || k === 'l3' ? null : nextCourt(prevK, court);
    items.push({ k: k, title: ri.full.replace('トーナメント ', ' '), time: timeText(k), court: nc, cond: true, opp: [{ ph: 'コート' + court + 'で1位になったら' }],
      note: nc ? '' : '決勝のコートは本部の案内に従ってください' });
    court = nc;
  }
  return { items: items, side: side };
}

/* ---------- render ---------- */
var VERSION = '11/18-1';

function health(){

function footHtml(){ return '<p class="foot">このページは<wbr>有志が作った<wbr>非公式の速報です。<wbr>主催者の表を<wbr>自動で読み込んで<wbr>表示しています。<wbr>正式な案内は<wbr>大会本部と、<wbr>大会チャットで<wbr>共有されている表で<wbr>確かめてください。</p>'; }
/* ---------- where the day is now ---------- */
var SLOT_KEYS = { q1: ['q1'], q2: ['q2'], q3: ['q3'], u1: ['u1', 'l1'], u2: ['u2', 'l2'], u3: ['u3', 'l3'], u4: ['u4'] };
function slotMatches(sk){ return SLOT_KEYS[sk].reduce(function(a, k){ return a.concat(matchesOf(k).map(function(m){ return { k: k, m: m }; })); }, []); }
function waitingText(list){

  }

}
function band(){
  var el = document.getElementById('band'); if (!el) return;
  var d = new Date(), day = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  var b1 = '', b2 = '';
  if (day < TOUR_DAY){ b1 = '大会は11月23日（月・祝）です'; b2 = ''; }
  else if (day > TOUR_DAY){ b1 = '大会は終了しました'; }
  else if (!M){ el.hidden = true; return; }
  else {
    var now = d.getHours() * 60 + d.getMinutes(), slots = SCHEDULE.map(function(x, i){ var nx2 = SCHEDULE[i + 1]; return { x: x, s: toMin(x.s), e: x.e ? toMin(x.e) : (nx2 ? toMin(nx2.s) : null) }; });
    var cur = slots.filter(function(y){ return now >= y.s && (y.e == null || now < y.e); }).pop();
    var nxt = slots.find(function(y){ return y.s > now && y.x.k; });
    var lastGame = slots.filter(function(y){ return y.x.k && y.s <= now; }).pop();
    function left(m){ return m >= 60 ? Math.floor(m / 60) + '時間' + (m % 60 ? m % 60 + '分' : '') : m + '分'; }
    if (cur && cur.x.k){
      var list = slotMatches(cur.x.k), done = list.filter(function(x){ return x.m.played; }).length;
      if (list.length && done === list.length){ b1 = cur.x.label + '：全コート終了'; if (nxt) b1 += ' <small>次は' + nxt.x.s + '〜（あと' + left(nxt.s - now) + '）</small>'; }
      else { b1 = cur.x.label + ' の試合中 <small>' + cur.x.e + 'まで</small>'; if (list.length) b2 = '結果 ' + done + '／' + list.length + 'コート'; }
      var prevG = slots.filter(function(y){ return y.x.k && y.s < cur.s; }).pop();
      var pw = prevG ? waitingText(slotMatches(prevG.x.k)) : '';
      if (pw) b2 = (b2 ? b2 + '／' : '') + '前の試合の' + pw;
    } else {
      if (cur) b1 = (cur.x.label === '受付開始' ? '受付中' : cur.x.label) + (cur.x.e ? ' <small>' + cur.x.e + 'まで</small>' : '');
      if (nxt) b1 += (b1 ? '<br>' : '') + '次は ' + nxt.x.label + ' <small>' + nxt.x.s + '〜（あと' + left(nxt.s - now) + '）</small>';
      if (!b1) b1 = '本日の試合はすべて終わりました';

  }
  var html = '<div class="b1"><span class="mq">' + b1 + '</span></div>' + (b2 ? '<div class="b2"><span class="mq">' + esc(b2) + '</span></div>' : '');
  el.hidden = false;
  el.classList.toggle('wait', /送信待ち/.test(b2));

  el.innerHTML = html;

  el.querySelectorAll('.b1,.b2').forEach(function(line){
    var sp = line.firstChild;
    if (sp.scrollWidth - line.clientWidth <= 4 && sp.getBoundingClientRect().width <= line.clientWidth + 4) return;
    var c = sp.innerHTML;
    line.innerHTML = '<span class="track"><span class="mq">' + c + '</span><span class="mq" aria-hidden="true">' + c + '</span></span>';
    var w = line.querySelector('.mq').getBoundingClientRect().width, tr = line.firstChild;
    tr.style.setProperty('--dist', -w + 'px'); tr.style.setProperty('--dur', Math.max(8, w / 40) + 's');
    line.classList.add('run');
  });
  if (!first){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); }, 3200); }
}
var lastBand = null;
document.getElementById('band').addEventListener('click', function(){ this.classList.toggle('paused'); });
function render(){

  if (S.tab === 'games'){ var li = view.querySelector('.mlist li.mine'); if (li){ var ul = li.parentNode; ul.insertBefore(li, ul.firstChild); var lab = document.createElement('p'); lab.className = 'minelabel'; lab.textContent = 'あなたのチームの試合'; ul.parentNode.insertBefore(lab, ul); } }

function setStamp(){
  var el = document.getElementById('stamp');
  if (!RAW){ el.className = lastFail ? 'stamp bad' : 'stamp'; el.textContent = lastFail ? 'シートを読み込めませんでした。電波を確かめて「最新にする」を押してください。' : '読み込み中…'; return; }
  if (lastFail || RAW.error){
    el.className = 'stamp bad';
    el.textContent = '最新にできませんでした。' + (RAW.at ? clock(RAW.at) + '時点の内容を表示中。' : '') + '電波を確かめて、もう一度押してください。';
  } else if (RAW.miss && RAW.miss.length){ el.className = 'stamp bad'; el.textContent = clock(RAW.at) + ' 時点。表の一部（' + RAW.miss.map(function(k){ return { games:'予選の対戦', ranks:'予選結果', upper:'上位', lower:'下位', entry:'エントリー' }[k]; }).join('・') + '）を読めませんでした。タブ名が変わった可能性があります。';

var cbn = 0;
function gvizUrl(tab, handler){
  return 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?headers=0&sheet=' + encodeURIComponent(tab.name) + '&range=' + tab.range +
    '&tqx=' + encodeURIComponent('out:json' + (handler ? ';responseHandler:' + handler : '')) + '&_=' + Date.now();
}
function tableToGrid(res){
  if (!res || res.status === 'error' || !res.table) throw new Error((res && res.errors && res.errors[0] && res.errors[0].detailed_message) || 'read error');
  return (res.table.rows || []).map(function(row){
    return (row.c || []).map(function(c){ if (!c) return ''; var x = c.f != null ? c.f : c.v; return x == null ? '' : String(x); });
  });
}
function getTabFetch(tab){
  return fetch(gvizUrl(tab), { cache: 'no-store' }).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(t){ return tableToGrid(JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1))); });
}
function getTabScript(tab){
  return new Promise(function(ok, ng){
    var name = '__gv' + (++cbn), sc = document.createElement('script');
    var tm = setTimeout(function(){ cleanup(); ng(new Error('timeout')); }, 15000);
    function cleanup(){ clearTimeout(tm); try { delete window[name]; } catch(e){ window[name] = undefined; } sc.remove(); }
    window[name] = function(res){ cleanup(); try { ok(tableToGrid(res)); } catch(e){ ng(e); } };
    sc.onerror = function(){ cleanup(); ng(new Error('script')); };
    sc.src = gvizUrl(tab, name); document.head.appendChild(sc);
  });
}
var useScript = false, found = {};
try { found = JSON.parse(localStorage.getItem('tmn4:tabs') || '{}') || {}; } catch(e){ found = {}; }
function getOne(tab){
  if (useScript) return getTabScript(tab);
  return getTabFetch(tab).catch(function(){ useScript = true; return getTabScript(tab); });
}
function hasSign(g, sign){ return g.some(function(row){ return row.some(function(c){ return z(c).replace(/\s/g, '').indexOf(sign) >= 0; }); }); }
/* the tab names have to match exactly; an unknown name silently returns the first tab, so check what came back */
function getTab(k){
  var t = TABS[k], list = found[k] ? [found[k]].concat(t.names.filter(function(n){ return n !== found[k]; })) : t.names.slice();
  function next(i){
    if (i >= list.length) return Promise.reject(new Error('tab ' + k));
    return getOne({ name: list[i], range: t.range }).then(function(g){
      if (hasSign(g, t.sign)){ found[k] = list[i]; return g; }
      return next(i + 1);
    }, function(e){ if (i + 1 < list.length) return next(i + 1); throw e; });
  }
  return next(0);
}
var ONCE = { entry: 1 }, SLOW = {}, gotAt = {};
function fetchAll(force){
  var old = (RAW && RAW.grids) || {}, now = Date.now();
  var keys = Object.keys(TABS).filter(function(k){
    if (!gotAt[k]) return true;
    if (ONCE[k]) return false;
    if (SLOW[k]) return force || now - gotAt[k] > SLOW[k];
    return true;
  });
  var miss = (RAW && RAW.miss ? RAW.miss : []).filter(function(k){ return keys.indexOf(k) < 0; });
  return getTab('games').then(function(first){
    gotAt.games = Date.now();
    return Promise.all(keys.filter(function(k){ return k !== 'games'; }).map(function(k){
      return getTab(k).then(function(g){ gotAt[k] = Date.now(); return [k, g]; }, function(){ miss.push(k); return [k, old[k] || []]; });
    })).then(function(rest){
      var grids = {}; Object.keys(TABS).forEach(function(k){ grids[k] = old[k] || []; });
      grids.games = first; rest.forEach(function(x){ grids[x[0]] = x[1]; });
      try { localStorage.setItem('tmn4:tabs', JSON.stringify(found)); } catch(e){}

    });
  });
}
var lastSig = '', toastTimer = null;
function toast(t){ var el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.hidden = true; }, 3500); }
function load(force){

  var btn = document.getElementById('reload'); btn.disabled = true; btn.textContent = '読み込み中…';
  var finished = false;
  var timer = setTimeout(function(){ if (finished) return; finished = true; done(null); }, 20000);
  function done(data){
    clearTimeout(timer); loading = false; btn.disabled = false; btn.textContent = '最新にする';
    if (data && data.grids){
      var sig = JSON.stringify([data.grids.games, data.grids.upper, data.grids.lower]);

  }
  fetchAll(force).then(function(d){ if (finished) return; finished = true; done(d); }, function(){ if (finished) return; finished = true; done(null); });
}

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="愛媛速報">
<meta name="theme-color" content="#1c1c1a">
<meta name="robots" content="noindex, nofollow">
<title>第6回モルックえひめ大会 速報</title>
<style>
:root{
  --paper:#f4f4ef; --card:#ffffff; --ink:#1c1c1a; --sub:#55554f; --soft:#d6d6ce;
  --red:#cf1f29; --blue:#1e4fd6; --court:#e2eaf5; --mark:#ffe95c; --ok:#17733a; --warn:#b54a00;
}
:root[data-theme="dark"]{ --paper:#121314; --card:#1b1c1e; --ink:#eeeee8; --sub:#a8a8a1; --soft:#3a3b3e;
    --red:#ff5d64; --blue:#8aa8ff; --court:#24303f; --mark:#6d5f00; --ok:#5fd28c; --warn:#ffad6b; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#121314; --card:#1b1c1e; --ink:#eeeee8; --sub:#a8a8a1; --soft:#3a3b3e;
    --red:#ff5d64; --blue:#8aa8ff; --court:#24303f; --mark:#6d5f00; --ok:#5fd28c; --warn:#ffad6b; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.7 system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  word-break:keep-all;overflow-wrap:anywhere;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
a{color:var(--blue)}

#demo{background:var(--ink);color:var(--paper);font-size:14px;line-height:1.6;padding:8px 14px}

header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:3px solid var(--ink);padding:10px 14px 8px}
.pre{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--sub);line-height:1.6;margin-bottom:2px}
.ttl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ttl h1{margin:0;font-size:18px;line-height:1.35;letter-spacing:.01em}
.ttl h1 small{display:block;font-size:14px;font-weight:600;color:var(--sub);letter-spacing:0}
#reload{flex:none;min-height:44px;padding:0 14px;border:2px solid var(--ink);background:var(--card);font-weight:700;font-size:15px;border-radius:6px}
#reload:active{transform:translateY(1px)}
#reload[disabled]{opacity:.55}
.sub2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.result-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:4px 12px;border-radius:6px;background:var(--blue);color:var(--paper);font-weight:700;text-decoration:none;text-align:center;flex-shrink:0}
.stamp{font-size:14px;color:var(--sub);line-height:1.5}
.thm2{position:relative;flex:none;height:32px;padding:0 10px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:16px;font:inherit;font-size:14px;font-weight:700}
.thm2::after{content:"";position:absolute;left:0;right:0;top:-6px;bottom:-6px}
.thm{flex:none;min-height:44px;padding:0 10px;border:1.5px solid var(--sub);background:transparent;border-radius:6px;font-size:14px;font-weight:700;color:var(--sub)}
.stamp.bad{color:var(--warn);font-weight:700}
.unoff{display:inline-block;font-size:14px;font-weight:800;border:1.5px solid currentColor;border-radius:3px;padding:0 6px;margin-left:6px;vertical-align:2px;color:var(--sub);line-height:1.6}
.broken{margin:12px 0 4px;padding:12px 14px;border:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--card));border-radius:4px}
.broken b{display:block;font-size:17px;color:var(--warn);line-height:1.5}
.broken p{margin:6px 0 0;font-size:15px;line-height:1.6}
.broken a{font-weight:700}
.footrow{display:flex;justify-content:flex-end;margin:22px 0 0}
tr.mine td{background:color-mix(in srgb,var(--mark) 30%,transparent)}
.mlist li.mine{background:color-mix(in srgb,var(--mark) 22%,transparent);box-shadow:inset 5px 0 0 var(--red);padding-left:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));z-index:7;background:var(--ink);color:var(--paper);font-size:15px;font-weight:700;padding:10px 16px;border-radius:6px;width:max-content;max-width:92vw;text-align:center;line-height:1.5}
.foot{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--soft);font-size:14px;color:var(--sub);line-height:1.6}

main{padding:4px 14px 24px;max-width:640px;margin:0 auto}
h2{font-size:19px;margin:22px 0 8px;line-height:1.4}
h3{font-size:17px;margin:18px 0 6px;line-height:1.4}
.lead{color:var(--sub);font-size:15px;margin:0 0 10px}
.note{font-size:15px;color:var(--sub);margin:6px 0}

/* court number: red circle like the venue map */
.cn{display:inline-flex;align-items:center;justify-content:center;flex:none;width:36px;height:36px;border:2.5px solid var(--red);border-radius:50%;
  color:var(--red);font-weight:800;font-size:18px;line-height:1;font-variant-numeric:tabular-nums;background:var(--card)}
.cn.big{width:84px;height:84px;border-width:4px;font-size:44px}
.cn.none{border-style:dashed;border-color:var(--sub);color:var(--sub);font-size:14px}
.me{background:linear-gradient(transparent 52%,var(--mark) 52%);font-weight:800}

/* next match */
.next{border:2.5px solid var(--ink);background:var(--card);border-radius:4px;padding:14px;margin:12px 0 6px}
.next .lbl{font-size:15px;font-weight:700;color:var(--sub)}
.next .row{display:flex;gap:14px;align-items:center;margin-top:6px}
.next .when{font-size:24px;font-weight:800;line-height:1.3}
.next .what{font-size:16px;line-height:1.5}
.next .vs{margin-top:10px;font-size:17px;line-height:1.6}
.next .vs b{font-size:18px}
.tag{display:inline-block;font-size:14px;font-weight:800;padding:1px 8px;border-radius:3px;line-height:1.6;vertical-align:2px}
.tag.now{background:var(--red);color:#fff}
.tag.done{background:var(--soft);color:var(--ink)}
.tag.if{border:1.5px solid var(--sub);color:var(--sub)}

.myhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:14px}
.myhead .nm{font-size:22px;font-weight:800;line-height:1.35}
.myhead .meta{font-size:15px;color:var(--sub)}
.btn{min-height:44px;padding:0 14px;border:2px solid var(--ink);background:var(--card);border-radius:6px;font-weight:700;font-size:15px;flex:none}

/* day plan */
.plan{list-style:none;margin:8px 0 0;padding:0;border-top:2px solid var(--ink)}
.plan li{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--soft)}
.plan li.cur{background:color-mix(in srgb,var(--mark) 28%,transparent)}
.plan .t{font-weight:800;font-size:16px;line-height:1.4}
.plan .s{font-size:15px;color:var(--sub);line-height:1.5}
.plan .o{font-size:16px;line-height:1.55;margin-top:2px}
.plan li.later{opacity:.75}

/* match lists */
.chips{margin:10px 0 4px}
.chips .g{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips .gl{width:2.6em;font-weight:800;font-size:15px}
.chips .gl.u{color:var(--red)} .chips .gl.l{color:var(--blue)}
.chip{min-height:44px;padding:0 12px;border:1.5px solid var(--ink);border-radius:22px;background:var(--card);font-size:15px;font-weight:600}
.chip.on{background:var(--ink);color:var(--paper)}
.rhead{margin:14px 0 4px;padding:8px 0;border-bottom:2px solid var(--ink)}
.rhead .t{font-size:19px;font-weight:800}
.rhead .s{font-size:15px;color:var(--sub);line-height:1.6;word-break:normal;line-break:strict}
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--soft);align-items:flex-start}
.mlist .teams{flex:1;min-width:0}
.tm{display:flex;justify-content:space-between;gap:8px;line-height:1.5;padding:1px 0}
.tm .nm{min-width:0}
.tm .lot{color:var(--sub);font-size:14px;margin-right:4px;font-variant-numeric:tabular-nums}
.tm .sc{flex:none;font-variant-numeric:tabular-nums;font-weight:700}
.tm.win .nm{font-weight:800}
.tm.win .sc::after{content:" 勝";color:var(--ok);font-size:14px}
.tm.ph .nm{color:var(--sub)}
.mlist .blk{font-size:14px;font-weight:800;color:var(--sub)}

/* standings */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:14px;color:var(--sub);font-weight:700;text-align:right;padding:6px 4px;border-bottom:2px solid var(--ink)}
th:nth-child(2){text-align:left}
td{padding:8px 4px;border-bottom:1px solid var(--soft);text-align:right;font-size:16px;line-height:1.45}
td:nth-child(2){text-align:left}
td.rk{font-weight:800;width:2.4em}
td.tot{font-weight:800}
.pf{display:block;font-size:14px;color:var(--sub);font-weight:400}
td.n{white-space:nowrap;width:1.85em;font-size:15px}
td.tot{white-space:nowrap;width:2.6em}
th.n{width:1.85em}
tr.cut td{border-bottom:3px double var(--red)}
.cutnote{font-size:15px;color:var(--red);font-weight:700;margin:6px 0 0}
.awards{border:2.5px solid var(--ink);background:var(--card);padding:10px 14px;margin:10px 0}
.awards div{display:flex;gap:12px;padding:4px 0;font-size:17px}
.awards b{width:4em;flex:none}

.side-u{color:var(--red)} .side-l{color:var(--blue)}

/* map */
.map{width:100%;height:auto;display:block;margin:8px 0}
.map .m-watch{fill:#fbf3cf} .map .m-hall{fill:#e5efdb;stroke:var(--ink);stroke-width:2}
.map .m-room{fill:#ececec;stroke:var(--ink);stroke-width:1.5}
.map .m-hq{fill:#f7a1a1;stroke:var(--ink);stroke-width:1.5}
.map .m-smk{fill:#f5c242;stroke:var(--ink);stroke-width:1}
.band{margin:8px -14px -8px;padding:8px 14px 9px;background:var(--ink);color:var(--paper);line-height:1.5}
.band .b1{font-size:17px;font-weight:800}
.band .b1,.band .b2{white-space:nowrap;overflow:hidden}
.band .mq{display:inline-block;padding-right:3em}
.band .track{display:inline-block;white-space:nowrap}
.band .run .track{animation:mq var(--dur,12s) linear infinite;animation-delay:1.5s}
.band.paused .track{animation-play-state:paused}
@keyframes mq{0%{transform:translateX(0)}100%{transform:translateX(var(--dist,-100%))}}
.band.wait{background:#b54a00;color:#fff}
.band.wait .b2{color:#fff}
.band.flash{animation:fl 1s ease-in-out 3}
@keyframes fl{0%,100%{filter:none}50%{filter:invert(1)}}
@media (prefers-reduced-motion: reduce){
  .band .b1,.band .b2{white-space:normal}
  .band .run .track{animation:none}
  .band .run .mq[aria-hidden]{display:none}
  .band.flash{animation:none;outline:4px solid var(--red);outline-offset:-4px}
}
.band .b1 small{font-size:15px;font-weight:700;opacity:.85}
.band .b2{font-size:15px;font-weight:700;color:#ffd166;margin-top:2px}
:root[data-theme="dark"] .band .b2{color:#b54a00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .band .b2{color:#b54a00}}
.sendwarn{margin:10px 0 0;padding:10px 12px;background:#fff1c2;color:#1c1c1a;border:2.5px solid #b54a00;border-radius:4px;font-size:16px;font-weight:700;line-height:1.6}
.sendwarn b{color:#b54a00}
.tools{display:flex;gap:6px;flex:none}
html.bigtext main,html.bigtext nav{zoom:1.22}
.tn{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent);text-underline-offset:3px}
.tn .fav{color:var(--blue);font-weight:800}
.mlist li.favrow{box-shadow:inset 5px 0 0 var(--blue);padding-left:12px}
.favs{list-style:none;margin:8px 0;padding:0;border-top:2px solid var(--blue)}
.favs li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--soft)}
.favs .fx{flex:none;min-height:44px;min-width:44px;border:1.5px solid var(--sub);border-radius:6px;background:transparent;color:var(--sub);font-size:14px;font-weight:700}
.addfav{display:block;width:100%;min-height:48px;margin:8px 0;border:2px dashed var(--blue);border-radius:6px;background:transparent;color:var(--blue);font-weight:800;font-size:16px}
#sheetbg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:82vh;overflow:auto;background:var(--paper);border-top:3px solid var(--ink);border-radius:12px 12px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
#sheet h3{margin:0;font-size:21px;line-height:1.4}
#sheet .meta{color:var(--sub);font-size:15px}
#sheet table{margin:10px 0;width:100%}
#sheet th,#sheet td{white-space:nowrap;width:auto!important;text-align:right}
#sheet th:first-child,#sheet td:first-child{text-align:left}
#sheet .row2{display:flex;gap:8px;margin-top:14px}
#sheet .row2 button{flex:1;min-height:48px;border:2px solid var(--ink);border-radius:6px;background:var(--card);font-weight:800;font-size:16px}
#sheet .row2 button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.install{border:2px solid var(--ink);background:var(--card);padding:12px;margin:10px 0;border-radius:4px}
.install ol{margin:6px 0 0;padding-left:1.4em;line-height:1.8}
.install .big2{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:6px;background:var(--ink);color:var(--paper);font-weight:800;font-size:17px;margin-top:8px}
.send{margin:12px 0 4px;padding:12px;border:2px dashed var(--ink);border-radius:4px}
.sendbtn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 16px;border-radius:6px;background:var(--red);color:#fff;font-weight:800;font-size:17px;text-decoration:none}
.sendhow{margin:8px 0 0;font-size:15px;line-height:1.6}
.sendlist{margin:4px 0 0;padding-left:1.2em;font-size:15px;line-height:1.7}
.rules{margin:6px 0;padding-left:1.2em}
.rules li{margin:6px 0;line-height:1.65}
.cn{font-family:inherit}
.map .m-court.sel rect{stroke:#1e4fd6;stroke-width:4}
.maphint{font-size:14px;color:var(--sub);margin:2px 0 0}
.cinfo{border:2px solid var(--ink);background:var(--card);padding:10px 12px;margin:8px 0;border-radius:4px}
.cinfo .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cinfo .h b{font-size:17px;line-height:1.4}
.cinfo .h span{display:block;font-size:14px;color:var(--sub);font-weight:400}
.cinfo .x{min-height:44px;min-width:44px;border:1.5px solid var(--ink);background:transparent;border-radius:6px;font-size:15px;font-weight:700;flex:none}
.cinfo .tm{padding:3px 0}
.minelabel{font-size:14px;font-weight:800;color:var(--red);margin:10px 0 0}
.map .m-here{font-size:14px;font-weight:800;fill:#cf1f29}
.mapwrap{background:#fff;border:2px solid var(--ink);padding:4px;margin:8px 0}
.access{width:100%;height:auto;display:block;border:2px solid var(--ink)}

.tt{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.tt li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--soft)}
.tt .tm2{width:7.6em;flex:none;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tt .nt{font-size:15px;color:var(--sub);line-height:1.6;margin-top:2px;word-break:normal;line-break:strict}
.tt li.cur{background:color-mix(in srgb,var(--mark) 28%,transparent)}
.rule{white-space:pre-wrap;word-break:normal;line-break:strict;font-size:16px}
details{border-top:2px solid var(--ink);border-bottom:1px solid var(--soft)}
summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer;color:var(--blue)}
.rule h4{margin:16px 0 4px;font-size:17px}

.pick{list-style:none;margin:8px 0;padding:0;border-top:2px solid var(--ink)}
.pick button{width:100%;min-height:52px;text-align:left;border:0;border-bottom:1px solid var(--soft);background:transparent;padding:8px 4px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:17px}
.pick button span{font-size:14px;color:var(--sub);flex:none}
.empty{padding:20px 0;color:var(--sub)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);
  border-top:2.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
nav button{min-height:62px;border:0;background:transparent;font-size:15px;font-weight:700;line-height:1.3;padding:6px 2px}
nav button[aria-selected="true"]{background:var(--ink);color:var(--paper)}

.days{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.days button{min-height:48px;border:2px solid var(--ink);background:var(--card);border-radius:6px;font-size:15px;font-weight:700;line-height:1.35;padding:4px 6px}
.days button b{display:block;font-size:14px}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
h2 small{display:block;font-size:15px;font-weight:600;color:var(--sub)}
.rounds{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.rounds button{min-height:44px;padding:0 12px;border:1.5px solid var(--ink);border-radius:22px;background:var(--card);font-size:15px;font-weight:700}
.rounds button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.next .lab{font-size:15px;font-weight:800;color:var(--sub)}
.next.done p{margin:6px 0 0}
.cn.wide{width:auto;min-width:36px;padding:0 6px;border-radius:18px;font-size:15px}
.cn.big.wide{width:auto;min-width:84px;padding:0 10px;border-radius:42px;font-size:30px}
.chg{flex:none;min-height:44px;padding:4px 10px;border:1.5px solid var(--ink);background:var(--card);border-radius:6px;font-size:14px;font-weight:700;line-height:1.3}
.myhead .s{font-size:15px;color:var(--sub)}
.favs .s{font-size:15px;color:var(--sub);line-height:1.5}
.favs .o{font-size:16px;line-height:1.55}
.mlist .wait{font-size:14px;font-weight:800;color:var(--warn)}
.ph{color:var(--sub)}
.champ{font-size:17px;margin:12px 0 0}
.subwarn{margin:12px 0 0;padding:10px 12px;background:#fff1c2;color:#1c1c1a;border:2.5px solid #b54a00;border-radius:4px;font-size:16px;font-weight:600;line-height:1.65}
.subwarn b{color:#b54a00}
.tt li.side .tm2,.tt li.side b{color:var(--sub)}
.place{font-size:17px;line-height:1.6}
.maplink{display:flex;align-items:center;justify-content:center;min-height:50px;border:2px solid var(--ink);border-radius:6px;background:var(--card);color:var(--ink);font-weight:800;text-decoration:none}
.map{display:block;width:100%;height:auto}
.map text{font-family:inherit;fill:#1c1c1a}
.map .m-lbl{font-size:14px;font-weight:800}
.map .m-sm{font-size:12px;font-weight:700;fill:#55554f}
.map .m-spare{fill:#eeeee8;stroke:#999;stroke-dasharray:3 3}
.map .m-hq{fill:#f7a1a1;stroke:#1c1c1a;stroke-width:1.5}
.map .m-court{cursor:pointer}
.map .m-court rect{fill:#dfe8f4;stroke:#1c1c1a;stroke-width:1.2}
.map .m-court text{font-size:15px;font-weight:800;fill:#1c1c1a}
.map .m-court.on rect{fill:#cf1f29}
.map .m-court.on text{fill:#fff}
.map .m-court.sel rect{stroke:#1e4fd6;stroke-width:4}
.foot{margin-top:28px}
th{white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="pre"><span><span style="white-space:nowrap">11月28日（土）</span>・<span style="white-space:nowrap">29日（日）</span><span class="unoff">非公式の速報</span></span><span class="tools"><button id="big" class="thm2" type="button"></button><button id="thm" class="thm2" type="button"></button></span></div>
  <div class="ttl">
    <h1>第6回 モルック<wbr>えひめ大会</h1>
    <button id="reload" type="button">最新にする</button>
  </div>
  <div class="days" role="group" aria-label="どの日の大会を見るか">

/* who won: from either side's entry; a lone team (bye) wins once it has a result; both "won" = not decided yet */

/* ---------- read the organizer's sheet: day 1 ---------- */

function buildTag(g){

/* ---------- rounds ---------- */
function roundOf(k){ return M ? M.rounds.find(function(r){ return r.k === k; }) : null; }

function plan(nm){
  var items = [], end = false;

    var s = slotOf(r.k), m = matchOf(r, nm);

      opp: m.teams.filter(function(t){ return t !== me; }), done: m.played || !!(me && (me.sent || me.win || me.lose)) });
  });

    var lastT = items.filter(function(x){ return /^t/.test(x.k); }).pop();

    if (lastT && lastT.k === 't5' && (lastT.me.win || lastT.me.lose)) end = 'final';

}

      else if (force && lastSig) toast('変更なし（最新です）');
      lastSig = sig;
      RAW = data; lastFail = false; M = build(RAW); try { localStorage.setItem('ehm6:last:' + day, JSON.stringify(RAW)); } catch(e){}
    } else { lastFail = true; if (force) toast('読み込めませんでした'); }
    setStamp(); render();
  }
  fetchAll(day, force).then(function(d){ if (finished) return; finished = true; done(d); }, function(){ if (finished) return; finished = true; done(null); });
}
function restore(){
  RAW = null; M = null; lastSig = ''; lastBand = null;
  try { var c = JSON.parse(localStorage.getItem('ehm6:last:' + S.day) || 'null'); if (c && c.grids){ RAW = c; M = build(c); } } catch(e){}
}

/* ---------- events ---------- */
document.getElementById('reload').addEventListener('click', function(){ checkVersion(true); load(true); });
/* a page saved to the home screen keeps the old page: look for a newer version and reload into it */
var verBusy = false;
function checkVersion(now){
  if (verBusy || location.protocol === 'file:') return; verBusy = true;
  fetch('./?v=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.ok ? r.text() : ''; }).then(function(t){
    verBusy = false;
    var m = t.match(/var VERSION = '([^']+)'/);
    var tried = ''; try { tried = sessionStorage.getItem('ehm6:ver') || ''; } catch(e){}
    if (m && m[1] !== VERSION && m[1] !== tried){ try { sessionStorage.setItem('ehm6:ver', m[1]); } catch(e){} toast('新しい版（' + m[1] + '）に切り替えます'); setTimeout(function(){ location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]) + location.hash); }, 1200); }
  }, function(){ verBusy = false; });
}
setTimeout(checkVersion, 4000);
setInterval(function(){ if (document.visibilityState === 'visible') checkVersion(); }, 300000);
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') checkVersion(); });
document.querySelector('.days').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b || b.dataset.day === S.day) return;
  S.day = b.dataset.day; store.set('day', S.day); S.round = null; S.court = null; S.info = null; S.picking = false;
  restore(); setStamp(); render(); load(false);
});
document.getElementById('tabs').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  S.tab = b.dataset.tab; store.set('tab', S.tab); S.court = null; S.picking = false; render(); window.scrollTo(0, 0);
});
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-pick],[data-addfav],[data-unfav],[data-info],[data-sfav],[data-round],[data-act]'); if (!t) return;
  var d = t.dataset;
  if (d.pick){ store.set('team:' + S.day, d.pick); S.picking = false; render(); window.scrollTo(0, 0); return; }
  if (d.addfav){ var a = favs(); if (!a.some(function(f){ return key(f) === key(d.addfav); })) a.push(d.addfav); saveFavs(a); S.picking = false; render(); return; }
  if (d.unfav){ saveFavs(favs().filter(function(f){ return key(f) !== key(d.unfav); })); render(); return; }
  if (d.info){ S.info = d.info; paintSheet(); return; }
  if (d.sfav){ var b2 = favs(); if (isFav(d.sfav)) b2 = b2.filter(function(f){ return key(f) !== key(d.sfav); }); else b2.push(d.sfav); saveFavs(b2); render(); return; }
  if (d.round){ S.round = d.round; S.court = null; render(); return; }
  if (d.act === 'change'){ S.picking = 'me'; render(); window.scrollTo(0, 0); return; }
  if (d.act === 'addfav'){ S.picking = 'fav'; render(); window.scrollTo(0, 0); return; }
  if (d.act === 'cancelpick'){ S.picking = false; render(); return; }
  if (d.act === 'closecourt'){ S.court = null; render(); return; }
  if (d.act === 'closeinfo'){ S.info = null; paintSheet(); return; }
  if (d.act === 'install' && installEvt){ installEvt.prompt(); installEvt = null; return; }
});
document.getElementById('sheetbg').addEventListener('click', function(){ S.info = null; paintSheet(); });
window.addEventListener('hashchange', render);
setInterval(function(){ if (document.visibilityState === 'visible' && !S.picking) load(false); }, (AUTO_SEC + Math.floor(Math.random() * 12)) * 1000);
setInterval(function(){ setStamp(); band(); }, 30000);
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && RAW && Date.now() - RAW.at > AUTO_SEC * 1000) load(false); });

function darkNow(){ var t = document.documentElement.dataset.theme; if (t) return t === 'dark'; try { return matchMedia('(prefers-color-scheme: dark)').matches; } catch(e){ return false; } }
(function(){ var t = store.get('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; })();
function paintTheme(){ var b = document.getElementById('thm'), dk = darkNow(); b.textContent = dk ? '☀ 明るく' : '☾ 暗く'; b.setAttribute('aria-label', dk ? '明るい画面に切り替える' : '暗い画面に切り替える'); }
paintTheme();
function paintBig(){ var on = document.documentElement.classList.contains('bigtext'), b = document.getElementById('big'); b.textContent = on ? '文字 ふつう' : '文字 大'; b.setAttribute('aria-pressed', String(on)); }
if (store.get('big') === '1') document.documentElement.classList.add('bigtext');
paintBig();
document.getElementById('big').addEventListener('click', function(){ var on = document.documentElement.classList.toggle('bigtext'); store.set('big', on ? '1' : '0'); paintBig(); });
document.getElementById('thm').addEventListener('click', function(){ var t = darkNow() ? 'light' : 'dark'; document.documentElement.dataset.theme = t; store.set('theme', t); paintTheme(); });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme); } catch(e){}

restore(); setStamp(); render(); load(false);
</script>
</body>
</html>
